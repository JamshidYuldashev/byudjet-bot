<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byudjet treker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5.2.8/index.min.css">
<style>
/* Dizayn tizimi: bitta asosiy rang, qisqa shrift shkalasi (rem), kamida 44 px nishon, WCAG 2.2 AA kontrast */
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --surface2: #ECEEF2; --field: #FFFFFF; --line: #E3E6EB; --bd: #7F8A9B; --res: #8A94A4;
  --text: #10151C; --soft: #4A5462; --muted: #5D6776;
  --accent: #1F5FD6; --on-accent: #FFFFFF; --sel: #E8EFFC; --on-strong: #FFFFFF;
  --mint: #0B7A4B; --mint-t: #E6F4EC; --coral: #C2341F; --coral-t: #FDEDEA; --amber: #9A5B00; --amber-t: #FFF3E0;
  --blue: #1F5FD6; --teal: #0B7D73; --purple: #6A48D7; --pink: #B8336A; --gray: #5D6776;
  --hero: #18355E; --hero-muted: #C3D3EE; --shadow: rgba(14, 17, 22, .16);
  --ch-plan: #2563D9; --ch-act: #0E7A4D;
  --spring: cubic-bezier(.2, .9, .25, 1.02);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #171B22; --surface2: #222832; --field: #171B22; --line: #2A3140; --bd: #6B7686; --res: #5D6776;
    --text: #ECEFF4; --soft: #B4BCC9; --muted: #98A2B3;
    --accent: #6EA8FE; --on-accent: #0B1220; --sel: #1B2A42; --on-strong: #0B1220;
    --mint: #3DDC97; --mint-t: #12291F; --coral: #FF8A7A; --coral-t: #2E1815; --amber: #F5B83D; --amber-t: #2B2210;
    --blue: #6EA8FE; --teal: #4FD1C5; --purple: #B69CFF; --pink: #FF8FB1; --gray: #B4BCC9;
    --hero: #1B2A42; --shadow: rgba(0, 0, 0, .5); --ch-plan: #4F8FEA; --ch-act: #22AE76;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #171B22; --surface2: #222832; --field: #171B22; --line: #2A3140; --bd: #6B7686; --res: #5D6776;
  --text: #ECEFF4; --soft: #B4BCC9; --muted: #98A2B3;
  --accent: #6EA8FE; --on-accent: #0B1220; --sel: #1B2A42; --on-strong: #0B1220;
  --mint: #3DDC97; --mint-t: #12291F; --coral: #FF8A7A; --coral-t: #2E1815; --amber: #F5B83D; --amber-t: #2B2210;
  --blue: #6EA8FE; --teal: #4FD1C5; --purple: #B69CFF; --pink: #FF8FB1; --gray: #B4BCC9;
  --hero: #1B2A42; --shadow: rgba(0, 0, 0, .5); --ch-plan: #4F8FEA; --ch-act: #22AE76;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--text); overflow-x: hidden;
  font: 500 .9375rem/1.4 'Manrope Variable', Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, p { margin: 0; }
.i { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

#view { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(100px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
body.sub #view { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
body.sub #nav, body.sub #fab { display: none; }
#view:has(.tbar) { padding-bottom: calc(92px + env(safe-area-inset-bottom)) !important; }

/* Yuklanish */
#loading { max-width: 560px; margin: 0 auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
.sk { display: block; background: var(--surface2); border-radius: 8px; }
.skrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: no-preference) { .sk { animation: pulse 1.4s ease-in-out infinite; } }

/* Saqlash holati */
#netbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: .8125rem; font-weight: 600; min-height: 44px; }
#netbar.warn { background: var(--amber-t); color: var(--amber); }
#netbar.fail { background: var(--coral-t); color: var(--coral); }
#netbar span { flex: 1; min-width: 0; }
#netbar button { border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; flex: none; }

/* Umumiy bloklar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
.hacts { display: flex; gap: 8px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.h1 { font-size: 1.375rem; font-weight: 800; letter-spacing: -0.01em; }
.h2 { font-size: 1.0625rem; font-weight: 700; }
.kicker, .lbl { font-size: .8125rem; color: var(--soft); font-weight: 600; }
.lbl { display: inline-flex; align-items: center; gap: 6px; }
.small { font-size: .8125rem; }
.muted { color: var(--muted); }
.big { font-size: 1.375rem; font-weight: 800; line-height: 1.2; }
.num { white-space: nowrap; font-weight: 700; }
.c-in { color: var(--mint); } .c-bad { color: var(--coral); } .c-warn { color: var(--amber); }
.c-acc { color: var(--accent); } .c-soft { color: var(--soft); } .c-muted { color: var(--muted); }
.note { font-size: .8125rem; color: var(--muted); line-height: 1.5; padding: 0 4px; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.list { padding: 4px 16px 6px; gap: 0; }
.card.list > .ch { margin: 0 -16px 2px; padding: 8px 16px 4px; }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card.stat3 { flex-direction: row; justify-content: space-between; gap: 12px; }
.stat3 > span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stat3 small { font-size: .8125rem; color: var(--muted); font-weight: 600; }
.stat3 b { font-weight: 700; white-space: nowrap; }
.rowcard { flex-direction: row; align-items: center; gap: 14px; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 20px 8px; color: var(--muted); font-size: .875rem; }
.empty b { color: var(--text); font-size: .9375rem; }

/* Rangli fon: rang currentColor dan olinadi */
.soft { position: relative; isolation: isolate; }
.soft::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: .14; z-index: -1; }

/* Tugmalar: bir ekranda bitta asosiy, qolgani kulrang yoki matn */
.pill-btn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--surface2); color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 700; white-space: nowrap; text-decoration: none; }
.pill-btn.primary { background: var(--accent); color: var(--on-accent); }
.round { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface2); color: var(--text);
  display: flex; align-items: center; justify-content: center; flex: none; padding: 0; position: relative; }
.round.sm { width: 44px; height: 44px; }
.round.flat { background: none; }
.round:disabled { opacity: .35; }
.round em { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--on-accent);
  font-size: .75rem; font-weight: 700; font-style: normal; display: grid; place-items: center; }
.btn { min-height: 52px; border-radius: 14px; border: 0; background: var(--surface2); color: var(--text); padding: 0 14px;
  font-size: .9375rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary.bad, .btn.dng { background: var(--coral-t); color: var(--coral); }
.btn.primary:disabled { background: var(--surface2); color: var(--muted); }
.btn.fill-warn { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: none; color: var(--coral); }
.btn.sm { min-height: 44px; border-radius: 12px; font-size: .8125rem; }
.btn.txt { background: none; min-height: 44px; font-size: .875rem; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: .8125rem; font-weight: 700; min-height: 44px; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
.act { min-height: 40px; border-radius: 10px; border: 0; padding: 0 12px; font-size: .8125rem; font-weight: 700; background: var(--sel); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: none; position: relative; white-space: nowrap; }
.act::after { content: ""; position: absolute; inset: -2px 0; }
.act.done { background: none; color: var(--mint); padding: 0 4px; }

/* Ikonka plitkasi */
.tile { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; color: var(--c, var(--soft)); }
.tile.lg { width: 48px; height: 48px; border-radius: 14px; }
.tile.md { width: 44px; height: 44px; border-radius: 12px; }
.tile b { color: var(--text); font-size: .9375rem; }

/* Qator */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); width: 100%;
  background: none; text-align: left; color: var(--text); min-height: 60px; }
.ch + .row, .group > .row:first-child, .row:first-child { border-top: 0; }
.row .t { font-size: .9375rem; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .t > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s.c-bad { color: var(--coral); } .row .s.c-warn { color: var(--amber); } .row .s.c-in { color: var(--mint); }
.rowlink { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; color: var(--text); min-height: 44px; }
.end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.end .num { font-size: .9375rem; }
.end .bal { font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tag { font-size: .75rem; font-weight: 700; color: var(--soft); padding: 1px 8px; border-radius: 6px; background: var(--surface2); flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.tag.bad { background: var(--coral-t); color: var(--coral); }
.tag.ok { background: var(--mint-t); color: var(--mint); }
.msg { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: .875rem; font-weight: 600; line-height: 1.35; }
.msg.soft::before { display: none; }
.msg.c-warn { background: var(--amber-t); } .msg.c-bad { background: var(--coral-t); } .msg.c-in { background: var(--mint-t); } .msg.c-acc { background: var(--sel); }
.msg.warnbox { align-items: flex-start; padding: 8px 10px; font-size: .8125rem; }
.msg .act { background: var(--surface); }
.dt { width: 40px; height: 44px; border-radius: 12px; background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; line-height: 1.1; }
.dt b { font-size: .9375rem; font-weight: 800; }
.dt small { font-size: .75rem; font-weight: 600; color: var(--soft); }
.dt.warn { background: var(--amber-t); } .dt.warn small { color: var(--amber); }
.dt.neg { background: var(--coral-t); } .dt.neg small { color: var(--coral); }
.notice { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 60px; border: 0; border-radius: 16px; background: var(--surface); width: 100%; text-align: left; color: var(--text); }
.notice .t { font-size: .875rem; font-weight: 700; line-height: 1.3; }
.notice .s { font-size: .8125rem; color: var(--muted); }

/* Reja bandi */
.ev { display: flex; align-items: center; gap: 10px; min-height: 60px; border-top: 1px solid var(--line); padding: 8px 0; }
.ev .t { font-size: .9375rem; font-weight: 700; }
.ev .s { font-size: .8125rem; color: var(--muted); }
.ev .num { font-size: .9375rem; }
.evlink { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; color: var(--text); min-height: 44px; }

/* Progress */
.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; display: block; }
.bar.lg { height: 10px; border-radius: 5px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--accent)); }
.bar.thin { height: 4px; border-radius: 2px; margin-top: 4px; }

/* Bo'limlar, chip */
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 14px; background: var(--surface2); }
.seg.inset { border-radius: 12px; }
.seg button { flex: 1 1 0; min-width: fit-content; min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--soft); font-size: .8125rem; font-weight: 700; padding: 0 6px; }
.seg.inset button { border-radius: 10px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--bd); background: transparent; color: var(--soft); position: relative;
  font-size: .8125rem; font-weight: 700; white-space: nowrap; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.chip::after { content: ""; position: absolute; inset: -3px 0; }
.chip.sm { font-size: .8125rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Maydonlar: 1rem — telefonda sahifa o'zi kattalashib ketmasligi uchun */
.field { min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--bd); background: var(--field); color: var(--text); font-size: 1rem; width: 100%; min-width: 0; }
.field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field.r { text-align: right; }
.fl { display: flex; flex-direction: column; gap: 6px; font-size: .8125rem; font-weight: 600; color: var(--soft); min-width: 0; }
.search { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: var(--field); border: 1px solid var(--bd); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 1rem; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: .875rem; font-weight: 600; }
.check input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); }
textarea.field { padding: 12px; min-height: 150px; resize: vertical; font: .75rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--soft); }
#modal .field.big-in { font-size: 1.375rem; font-weight: 800; min-height: 52px; }

/* Asosiy blok: bitta qattiq rang */
.hero { background: var(--hero); color: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column;
  --text: #FFFFFF; --soft: #D6E0F1; --muted: #C3D3EE; --res: rgba(255, 255, 255, .38); --mint: #5FE3A8; --coral: #FFB0A5; }
.hlabel { align-self: flex-start; border: 0; background: none; padding: 0; min-height: 28px; display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 600; color: var(--soft); position: relative; }
.hlabel::after { content: ""; position: absolute; inset: -8px -8px; }
.hnum { font-size: clamp(2rem, 11vw, 2.75rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.hnum small { font-size: 1.0625rem; font-weight: 700; color: var(--soft); letter-spacing: 0; }
button.hnum { border: 0; background: none; padding: 0; color: inherit; text-align: left; }
.hcap { font-size: .8125rem; color: var(--muted); margin-top: 2px; }
.hcap.neg { color: var(--coral); font-weight: 700; }
.hbar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 14px; }
.hbar i { display: block; height: 100%; min-width: 6px; }
.hlg { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: .8125rem; color: var(--soft); flex-wrap: wrap; }
.hlg span { display: flex; align-items: center; gap: 6px; }
.hlg u { width: 8px; height: 8px; border-radius: 50%; flex: none; text-decoration: none; }
.hlg b { color: var(--text); font-weight: 700; }
.hero .msg { margin-top: 12px; background: rgba(255, 255, 255, .12); color: var(--coral); }
.accs { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 64px; padding: 12px 8px 12px 16px; border: 0; border-radius: 20px; background: var(--surface); color: var(--text); text-align: left; }
.accs > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.accs small { font-size: .8125rem; color: var(--muted); font-weight: 600; }
.accs b { font-size: .9375rem; font-weight: 700; white-space: nowrap; }
.accs .i { color: var(--muted); }
.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.btile { min-height: 104px; padding: 14px 16px; border: 0; border-radius: 20px; background: var(--surface); color: var(--text); text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.btile .lbl { margin-bottom: 6px; }
.btile b { font-size: 1.0625rem; font-weight: 800; }
.btile small { font-size: .8125rem; color: var(--muted); font-weight: 500; }

/* Qo'shish */
.amount { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0 4px; }
.amount b { font-size: clamp(2rem, 11vw, 2.375rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; }
.amount b.long { font-size: 1.75rem; }
.amount small { font-size: 1.0625rem; color: var(--soft); font-weight: 700; letter-spacing: 0; }
.calc-expr { color: var(--soft); font-weight: 700; font-size: .875rem; }
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.cat { position: relative; min-height: 62px; padding: 6px 2px 5px; border-radius: 12px; border: 0; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--soft); }
.cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--sel); color: var(--accent); }
.cat.bad .i { color: var(--coral); }
.cat .nm { font-size: .75rem; font-weight: 600; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.sel { position: relative; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border: 1px solid var(--bd); border-radius: 12px; background: var(--surface); color: var(--text); text-align: left; min-width: 0; }
.sel .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.sel b { font-size: .8125rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel small { font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel.big { min-height: 60px; }
.sel.big b { font-size: .9375rem; }
.sel input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.metarow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(112px, 118px); gap: 6px; }
.metarow.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.trbox { position: relative; display: flex; flex-direction: column; gap: 6px; }
.trbox .round { position: absolute; right: 44px; top: 39px; background: var(--sel); color: var(--accent); }

/* Ichki sahifa asboblari: faqat shu sahifaga oid amallar, menyu bilan birga chiqmaydi */
.tbar { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 4px; max-width: calc(100% - 24px);
  border: 1px solid var(--line); border-radius: 28px; background: var(--surface); background: color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 6px 24px var(--shadow); }

.low-end #nav, .low-end .tbar { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }

#toast { position: fixed; z-index: 50; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: .875rem; font-weight: 600;
  max-width: calc(100% - 32px); width: max-content; opacity: 0; pointer-events: none; transition: opacity .2s; }

/* Pastdan chiqadigan oyna: tutqich, pastga surib yopish */
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(14, 17, 22, .48); display: flex; align-items: flex-end; justify-content: center; }
#modal .sheet:focus { outline: 0; }

  display: flex; flex-direction: column; max-height: calc(var(--tg-viewport-stable-height, 100vh) - 24px); overflow-y: auto; }
.grab { position: sticky; top: 0; z-index: 2; align-self: center; flex: none; display: flex; justify-content: center; width: 100%; height: 22px; padding-top: 8px; background: var(--surface); touch-action: none; }

.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .875rem; }
.kv > span:first-child { color: var(--soft); }
.kv > b { font-weight: 700; text-align: right; }

@keyframes sheet { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: no-preference) { html:not(.low-end) #modal .sheet { animation: sheet .26s var(--spring) both; } }

/* Jonli animatsiyalar (harakatni kamaytirish yoqilgan bo'lsa — yo'q) */
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes ring { from { stroke-dasharray: 0 999; } }
@media (prefers-reduced-motion: no-preference) {
  html:not(.low-end) #view.enter > * { animation: rise .32s var(--spring) both; }
  html:not(.low-end) #view.enter > *:nth-child(2) { animation-delay: .03s; } html:not(.low-end) #view.enter > *:nth-child(3) { animation-delay: .06s; }
  html:not(.low-end) #view.enter > *:nth-child(n+4) { animation-delay: .09s; }
  .ring .fg { animation: ring 1s cubic-bezier(.2, .7, .3, 1) both; }

  .st-slide > *:nth-child(4) { animation-delay: .36s; } .st-slide > *:nth-child(n+5) { animation-delay: .48s; }
  .btn, .act, .keys button, .cat, #fab, #nav, #nav button, .tbar button, .row, .notice, .accs, .btile { transition: transform .12s ease, background-color .15s ease, min-height .2s var(--spring), width .2s var(--spring), height .2s var(--spring); }
  .btn:active, .act:active, .keys button:active, .cat:active, #fab:active, .tbar button:active, .notice:active, .accs:active, .btile:active { transform: scale(.97); }
}
@media (forced-colors: active) {

  .hbar i, .bar > i, .bars > i, .mk { forced-color-adjust: none; }
}
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 95; }

      for (let i = 1; i < n; i++) {

  for (const [doc, list] of Object.entries(docs)) {

function nextId(prefix) { db.seq++; return prefix + db.seq.toString(36); }

const LOG_MAX = 500;
function logEv(k, m, r = '') {
  db.log.push({ t: `${today()} ${nowHM()}`, k, m: m.slice(0, 240), r });
  if (db.log.length > LOG_MAX) db.log.splice(0, db.log.length - LOG_MAX);

}
const sgn = t => (t.k === 'in' ? `+${fmt(t.a)}` : t.k === 'out' ? `−${fmt(t.a)}` : fmt(t.a));
function txLabel(t) {
  return `${txTitle(t, calc())} ${sgn(t)}${t.k === 'tr' ? '' : ` · ${accName(t.acc, cardOf(t))}`} · ${dm(t.d)}${t.n ? ` · ${t.n}` : ''}`;
}
// Qarz amali yozilganda qarzning yangi holati qo'shiladi
function debtNote(t) {
  const d = t.debt && debtById(t.debt);
  if (!d || t.k !== repayKind(d)) return '';
  const s = debtState(calc(), d);
  return s.closed ? ' · qarz yopildi' : ` · ${fmt(s.left)} qoldi`;
}
function addTx(t, how = {}) {
  const tx = { id: nextId('t'), tm: '', to: '', c: '', n: '', p: '', h: '', debt: '', b: '', cd: '', tc: '', ...t };
  fixCards(tx);
  db.tx.push(tx);
  if (how.quiet) { ver++; return tx; }
  unsynced.add(tx.id);
  touch('meta', tdoc(tx.d));
  const d = tx.debt && debtById(tx.debt);
  if (!how.nolog) logEv('add', `${how.prefix || (d ? debtFlow(tx, d) : "Qo'shildi")}: ${txLabel(tx)}${debtNote(tx)}`, tx.debt || tx.id);
  return tx;
}
function updateTx(tx, patch) {
  const before = { ...tx };
  Object.assign(tx, patch);
  touch(tdoc(before.d), tdoc(tx.d));
  const ch = [];
  if (before.k !== tx.k) ch.push('tur');
  if (before.a !== tx.a) ch.push(`summa ${fmt(before.a)} → ${fmt(tx.a)}`);
  if (before.d !== tx.d) ch.push(`sana ${dm(before.d)} → ${dm(tx.d)}`);
  if (before.acc !== tx.acc || before.to !== tx.to) ch.push(`hisob ${ACC[before.acc].name} → ${ACC[tx.acc].name}`);
  else if (db.cards.length && ((before.cd || '') !== (tx.cd || '') || (before.tc || '') !== (tx.tc || ''))) {
    ch.push(`karta ${accName(before.acc, before.cd)} → ${accName(tx.acc, tx.cd)}`);
  }
  if (before.c !== tx.c && tx.c) ch.push(`kategoriya ${CATS[before.c]?.name || '—'} → ${CATS[tx.c].name}`);
  if (before.n !== tx.n) ch.push('izoh');
  if (before.p !== tx.p) ch.push(tx.p ? "rejaga bog'landi" : 'rejadan ajratildi');
  if (before.debt !== tx.debt) ch.push(tx.debt ? "qarzga bog'landi" : 'qarzdan ajratildi');
  if (ch.length) logEv('edit', `O'zgartirildi: ${txTitle(tx, calc())} ${sgn(tx)} — ${ch.join(', ')}${debtNote(tx)}`, tx.debt || before.debt || tx.id);
}
function removeTx(tx) {
  const label = txLabel(tx);
  db.tx.splice(db.tx.indexOf(tx), 1);
  touch(tdoc(tx.d));
  logEv('del', `O'chirildi: ${label}${debtNote(tx)}`, tx.debt || tx.id);
}
// O'chirish: 10 soniya «Qaytarish» bilan
function deleteTx(tx) {

  removeTx(tx);
  haptic.light();
  toast("O'chirildi", () => {
    if (db.tx.some(x => x.id === copy.id)) return;
    db.tx.push(copy);
    touch('meta', tdoc(copy.d));
    logEv('add', `Qaytarildi: ${txLabel(copy)}${debtNote(copy)}`, copy.debt || copy.id);

}
// Amalni bugungi sanaga takrorlash (HUMO izi va reja bog'lanishisiz)
function copyTxToday(tx) {

  const t = { d: clampDate(today()), tm: nowHM(), k: tx.k, a: tx.a, acc: tx.acc, to: tx.to, cd: tx.cd, tc: tx.tc, c: tx.c, n: tx.n, p: '', h: '',

function txFromEvent(e, d) {

// Yangi amal shu kungi bajarilmagan reja bandiga mos kelsa — bog'lanadi
function autoLink(t) {
  const C = calc();
  if (t.debt) {
    for (const e of C.events.values()) if (e.debt === t.debt && isPending(C, e)) return e.key;
  }
  for (const e of C.byIso[t.d] || []) {

    if (t.k === 'tr' ? e.kind === 'lock' && t.to === 'save' : e.kind === t.k && e.cat === t.c && !e.debt) return e.key;

const TABS = [['main', 'Asosiy', 'home'], ['tarix', 'Tarix', 'list'], ['reja', 'Reja', 'calendar'], ['tahlil', 'Tahlil', 'chart']];

let navY = 0, navTick = false;
window.addEventListener('scroll', () => {

// ===== Yaqin to'lovlar: reja bandlari, o'zim qo'shganlar va muddatli qarzlar bitta ro'yxatda =====
const MON_SHORT = ['yan', 'fev', 'mar', 'apr', 'may', 'iyn', 'iyl', 'avg', 'sen', 'okt', 'noy', 'dek'];
function upcoming(C) {
  const out = [];
  for (const e of C.events.values()) {
    if (e.id !== 'yol' && isPending(C, e)) out.push({ iso: e.iso, key: e.key, title: e.title, kind: e.kind, amount: e.amount, type: 'plan', e });
  }
  for (const list of Object.values(C.dueByIso)) {
    for (const o of list) if (o.first) out.push({ iso: o.iso, key: o.key, title: o.title, kind: o.kind, amount: o.amount, type: 'due', due: o.due });
  }
  // Rejaga bog'lanmagan muddatli qarzlar
  const linked = new Set([...C.events.values()].filter(e => e.debt && isPending(C, e)).map(e => e.debt));
  for (const d of db.debts) {
    const s = debtState(C, d);
    if (s.closed || !d.due || linked.has(d.id)) continue;
    out.push({ iso: d.due, key: `d:${d.id}`, title: d.who, kind: d.dir === 'owe' ? 'out' : 'in', amount: s.left, type: 'debt', debt: d });
  }
  return out.sort((a, b) => a.iso.localeCompare(b.iso));
}
const whenText = (iso, t) => { const n = daysBetween(t, iso); return n < 0 ? `${-n} kun kechikdi` : n === 0 ? 'Bugun' : n === 1 ? 'Ertaga' : `${n} kun qoldi`; };
const kindAmount = (kind, a) => (kind === 'lock' ? `<span class="num c-acc">${money(a)}</span>` : kind === 'in' ? `<span class="num c-in">+${money(a)}</span>` : `<span class="num">−${money(a)}</span>`);
const ACT_LABEL = { in: 'Tushdi', out: "To'ladim", lock: "O'tkazdim" };
function payRow(x, C) {
  const t = C.t, n = daysBetween(t, x.iso);
  const tone = n < 0 ? 'neg' : n <= 1 ? 'warn' : '';
  const open = x.type === 'plan' ? `data-act="ev-open" data-key="${x.key}"` : x.type === 'due' ? `data-act="due-open" data-id="${x.due.id}"` : `data-act="d-open" data-id="${x.debt.id}"`;
  const src = x.type === 'plan' ? evSub(x.e) : x.type === 'due' ? [x.due.rp ? RP_NAMES[x.due.rp] : '', accName(x.due.acc, dueCard(x.due))].filter(Boolean).join(' · ') : 'Qarz';
  const act = n > 1 ? '' : x.type === 'plan' ? `<button class="act" data-act="plan" data-key="${x.key}">${ACT_LABEL[x.kind]}</button>`
    : x.type === 'due' ? `<button class="act" data-act="due-pay" data-id="${x.due.id}">${ACT_LABEL[x.kind]}</button>`
    : `<button class="act" data-act="d-open" data-id="${x.debt.id}">${ACT_LABEL[x.kind]}</button>`;
  return `<div class="row"><button class="rowlink" ${open}><span class="dt ${tone}"><b>${Number(x.iso.slice(8))}</b><small>${MON_SHORT[Number(x.iso.slice(5, 7)) - 1]}</small></span>`
    + `<span class="body"><span class="t"><span>${esc(x.title)}</span></span><span class="s ${n < 0 ? 'c-bad' : n <= 1 ? 'c-warn' : ''}">${whenText(x.iso, t)} · ${esc(src)}</span></span></button>`
    + `<span class="end">${kindAmount(x.kind, x.amount)}${act}</span></div>`;
}
// Eng yaqin to'lov kuni uchun asosiy kartada pul yetadimi: yetmasa — bir bosishda o'tkazish
function shortMsg(C, items) {
  const m = mainCard();
  const onMain = x => (x.type === 'due' ? x.due.acc === 'card' && (!m || dueCard(x.due) === m.id)
    : x.type === 'plan' && (x.e.acc || 'card') === 'card' && (!multiCard() || lastCardFor(x.e.id) === m.id));
  const amt = kind => sum(items.filter(x => x.kind === kind && onMain(x)), x => x.amount);
  const need = amt('out') + amt('lock') - amt('in'), card = m ? C.cardBal[m.id] : C.bal.card;
  if (need <= card) return '';
  const where = m && multiCard() ? m.n : 'Karta';
  const src = [...activeCards().filter(k => k !== m).map(k => ({ acc: 'card', cd: k.id, n: k.n, v: C.cardBal[k.id] })), { acc: 'cash', cd: '', n: 'Naqd', v: C.bal.cash }]
    .filter(x => x.v > 0).sort((a, b) => b.v - a.v)[0];
  const move = src ? Math.min(need - card, src.v) : 0;
  return `<div class="msg soft c-warn" style="margin:0 0 10px"><span style="flex:1">${esc(where)}da ${money(need - card)} yetmaydi</span>`
    + `${move > 0 ? `<button class="act" data-act="topup" data-a="${move}" data-acc="${src.acc}" data-cd="${src.cd}">${esc(src.n)}dan o'tkazish</button>` : ''}</div>`;
}
const emptyBox = (title, sub, btn = '') => `<div class="empty"><b>${title}</b><span>${sub}</span>${btn}</div>`;
function payCard(C, t) {
  const all = upcoming(C);
  const near = all.filter(x => daysBetween(t, x.iso) <= 30);
  const head = n => `<div class="ch"><h2 class="h2">Yaqin to'lovlar</h2>${n ? `<button class="link-btn" data-act="reja-tab" data-t="tolov">Hammasi · ${n}</button>` : ''}</div>`;
  if (!all.length) {
    return `<section class="card list">${head(0)}${emptyBox("Oldinda to'lov yo'q", 'Rejadagi hamma band bajarilgan.', `<button class="btn sm" data-act="due-new">${ic('plus', 16, 2.5)}To'lov qo'shish</button>`)}</section>`;
  }
  const late = all.filter(x => x.iso < t);
  const shown = all.slice(0, Math.max(3, late.length));
  const firstDay = all.find(x => x.iso >= t)?.iso;
  const warn = firstDay ? shortMsg(C, all.filter(y => y.iso === firstDay)) : '';
  let body = '', placed = false;
  shown.forEach((x, i) => {
    body += payRow(x, C);
    if (x.iso === firstDay && shown[i + 1]?.iso !== firstDay) { body += warn; placed = true; }
  });
  // Kechikkanlar ko'p bo'lib, eng yaqin kun ro'yxatga sig'masa ham ogohlantirish ko'rinadi
  return `<section class="card list">${head(near.length || all.length)}${body}${placed ? '' : warn}</section>`;
}
function todayCard(C, t) {
  const list = C.sorted.filter(x => x.d === t);
  const spent = sum(list.filter(x => x.k === 'out' && x.c !== 'tuz'), x => x.a);
  return `<section class="card list"><div class="ch"><h2 class="h2">Bugun${spent ? ` <span class="muted" style="font-weight:600">−${money(spent)}</span>` : ''}</h2>
      <button class="link-btn" data-act="tab" data-to="tarix">Tarix</button></div>
    ${list.length ? list.slice(0, 5).map(x => txRow(x, C)).join('') : emptyBox("Bugun hali yozuv yo'q", "«+» bilan yozing yoki HUMO xabarini joylang.")}</section>`;
}
function streakOf(C, t) {
  let n = 0;
  for (let i = DAYS.length - 1; i >= 0; i--) {
    const d = DAYS[i];
    if (d.iso > t) continue;
    if (C.dayStat[d.iso]?.bad) break;
    n++;
  }
  return n;
}
function debtTotals(C, t) {
  const res = { owe: 0, lent: 0, nOwe: 0, nLent: 0, near: null };
  for (const d of db.debts) {
    const s = debtState(C, d);
    if (s.closed) continue;
    res[d.dir] += s.left;
    res[d.dir === 'owe' ? 'nOwe' : 'nLent']++;
    if (d.dir === 'owe' && d.due && (!res.near || d.due < res.near.due)) res.near = d;
  }
  return res;
}
// Reja bandi tafsiloti: oyna ichida «To'ladim» — kerakli summa va hisob oldindan to'ldiriladi
function evSheet(key) {

  const rep = Object.values(PLAN.monthly).flat().some(x => x.id === e.id) ? `Har oy, ${Number(e.iso.slice(8))}-sanada` : 'Bir marta';

    : settled ? `<div class="msg soft c-in">${ic('check', 16, 2.5)}Qarz yopilgan</div>`
    : `<button class="btn primary" data-act="plan" data-key="${key}">${ic('check', 18, 2.5)}${ACT_LABEL[e.kind]}</button>`;

      <span class="small ${!tx && !settled && n < 0 ? 'c-bad' : !tx && !settled && n <= 1 ? 'c-warn' : 'muted'}" style="font-weight:600">${longDate(e.iso)}, ${WEEKDAYS[dowOf(e.iso)].toLowerCase()}${tx || settled ? '' : ` · ${whenText(e.iso, t).toLowerCase()}`}</span></span>${closeBtn()}</div>
    <div class="sh-big">${e.kind === 'in' ? '+' : e.kind === 'out' ? '−' : ''}${money(e.amount)} <small>so'm</small></div>
    <div><div class="kv"><span>${e.kind === 'in' ? 'Qayerga' : 'Qayerdan'}</span><b>${esc(acc)}</b></div><div class="kv"><span>Takrorlanadi</span><b>${rep}</b></div>
      ${e.debt ? `<div class="kv"><span>Bog'langan</span><b>Qarz</b></div>` : ''}</div>
    ${main}`);

// Reja tugagach: yakun ekrani. Tarix va Tahlil ochiq qoladi.
function viewPlanDone(C) {

// ===== Klaviaturadagi kalkulyator: «25 000 + 12 000», «120 000 ÷ 3» =====
const OPS = '+−×÷';

function evalExpr(e) {
  const tk = e.match(/\d+|[+−×÷]/g) || [];
  while (tk.length && OPS.includes(tk[tk.length - 1])) tk.pop();
  if (!tk.length) return 0;
  let total = 0, sign = 1, term = Number(tk[0]);
  for (let i = 1; i < tk.length; i += 2) {
    const op = tk[i], n = Number(tk[i + 1]);
    if (op === '×') term *= n;
    else if (op === '÷') term = n ? term / n : term;
    else { total += sign * term; sign = op === '+' ? 1 : -1; term = n; }
  }
  return Math.max(0, Math.min(999999999, Math.round(total + sign * term)));
}

const CAT_WORDS = {

const noteWords = s => s.toLowerCase().replace(/[ʻʼ’‘'`]/g, '').split(/[^a-z0-9а-яёўқғҳ]+/).filter(w => w.length >= 3);
let learnCache = null;
function noteCat(text, k) {

  for (const w of words) {
    for (const [c, n] of Object.entries(learnCache.map[w] || {})) score[c] = (score[c] || 0) + 3 * n;
    for (const [c, list] of Object.entries(CAT_WORDS)) if (list.split(' ').some(kw => w.startsWith(kw))) score[c] = (score[c] || 0) + 2;

  return best;
}
function pressKey(k) {

function rejaDay(C, iso) {
  const day = DAY_BY_ISO.get(iso);
  const t = C.t;
  const work = isWorkday(day);
  const bad = C.dayStat[iso]?.bad || 0;
  const n = daysBetween(t, iso);
  const rel = n === 0 ? 'Bugun' : n === 1 ? 'Ertaga' : n === -1 ? 'Kecha' : n < 0 ? `${-n} kun oldin` : `${n} kun qoldi`;
  const yol = work ? `ish kuni, ${PLAN.transport.title.toLowerCase()} ${fmt(PLAN.transport.amount)}` : 'dam olish kuni';
  const notes = [rel, day.holiday || yol, bad ? `qoida buzilgan, −${fmt(bad)}` : ''].filter(Boolean).join(' · ');
  const evs = C.byIso[iso];
  const plannedIds = new Set([...C.byPlan.values()].map(x => x.id));
  const extra = db.tx.filter(x => x.d === iso && !plannedIds.has(x.id)).sort(txCmp);
  const dues = C.dueByIso[iso] || [];
  return `<section class="card list"><div class="ch" style="align-items:flex-start;padding-top:12px"><span class="col"><h2 class="h2">${longDate(iso)}, ${WEEKDAYS[day.dow].toLowerCase()}</h2>
      <span class="small ${bad ? 'c-bad' : 'muted'}">${esc(notes)}</span></span></div>
    ${evs.length || dues.length ? evs.map(e => eventRow(e, C)).join('') + dues.map(o => dueRow(o, C)).join('') : '<p class="small muted" style="padding:6px 0 10px">Bu kunga reja bandi yo\'q.</p>'}
    ${extra.length ? `<span class="small muted" style="font-weight:700;padding:10px 0 2px">Rejada yo'q amallar</span>${extra.map(x => txRow(x, C)).join('')}` : ''}
    <button class="row c-acc" data-act="r-work" data-iso="${iso}" style="min-height:48px;font-size:.875rem;font-weight:700;color:var(--accent)">${work ? 'Dam olish kuni qilish' : 'Ish kuni qilish'}</button></section>`;
}

const blankDebtForm = () => ({ id: '', dir: 'owe', who: '', a: '', due: '', flow: true });

function debtInfo(C, d, s, t) {
  const owe = d.dir === 'owe';
  const txs = db.tx.filter(x => x.debt === d.id).sort((a, b) => a.d.localeCompare(b.d) || idNum(a.id) - idNum(b.id));
  const lastPay = txs.filter(x => x.k === repayKind(d)).pop();
  const overdue = !s.closed && !!d.due && d.due < t;
  const soon = !s.closed && !!d.due && !overdue && d.due <= addDays(t, 3);
  const due = s.closed ? `${owe ? "To'landi" : 'Qaytdi'}${lastPay ? ` · ${dm(lastPay.d)}` : ''}`
    : d.due ? (overdue ? `Muddati o'tdi · ${dm(d.due)}` : `Muddat ${dm(d.due)} · ${relDay(d.due, t)}`) : 'Muddatsiz';
  return {
    owe, txs, due, color: owe ? 'coral' : 'mint',
    dueCls: s.closed ? 'c-in' : overdue ? 'c-bad' : soon ? 'c-warn' : '',
    pct: Math.min(100, Math.round((s.paid / d.a) * 100)),

}

}

function recordDebtPay(id, amount) {
  const C = calc();
  const d = C.debtMap.get(id);
  const s = debtState(C, d);
  const a = Math.min(amount, s.left);
  if (!a) return;
  const k = repayKind(d);
  const t = { d: clampDate(C.t), tm: nowHM(), k, a, acc: debtUI.acc, cd: debtUI.acc === 'card' ? debtUI.cd : '', c: k === 'out' ? 'qarz' : 'qarzq', debt: d.id };
  t.p = autoLink(t);
  addTx(t);
  closeModal();
  haptic.ok();
  toast(s.left - a ? `${d.who}: ${fmt(a)} yozildi, ${fmt(s.left - a)} qoldi` : `${d.who}: qarz yopildi`);
  if (!(s.left - a)) confetti();
  rerender();
}
function saveDebt() {
  const f = debtUI.form;
  const who = f.who.trim();
  const a = digits(f.a);
  if (!who) { toast('Kim bilan ekanini yozing'); haptic.error(); return; }
  if (!a) { toast('Summani kiriting'); haptic.error(); return; }
  const dirName = dir => (dir === 'owe' ? 'men qarzdorman' : 'menga qarzdor');
  if (f.id) {
    const d = debtById(f.id);
    const ch = [];
    if (d.who !== who) ch.push(`ism ${d.who} → ${who}`);
    if (d.dir !== f.dir) ch.push(`yo'nalish → ${dirName(f.dir)}`);
    if (d.a !== a) ch.push(`summa ${fmt(d.a)} → ${fmt(a)}`);
    if (d.due !== f.due) ch.push(`muddat ${d.due ? dm(d.due) : '—'} → ${f.due ? dm(f.due) : '—'}`);
    Object.assign(d, { dir: f.dir, who, a, due: f.due });
    if (ch.length) logEv('debt', `Qarz o'zgartirildi: ${who} — ${ch.join(', ')}`, d.id);
    toast('Qarz yangilandi');
  } else {
    const d = { id: nextId('d'), dir: f.dir, who, a, due: f.due, d: clampDate(today()) };
    db.debts.push(d);
    logEv('debt', `Yangi qarz: ${who} — ${dirName(f.dir)}, ${fmt(a)}${f.due ? ` · muddat ${dm(f.due)}` : ''}`, d.id);
    if (f.flow) {
      addTx({ d: clampDate(today()), tm: nowHM(), k: f.dir === 'owe' ? 'in' : 'out', a, acc: f.acc || 'card', cd: f.cd || '', c: f.dir === 'owe' ? 'qarzo' : 'qarz', debt: d.id });
    }
    toast('Qarz saqlandi');
  }
  touch('meta', 'debts');
  haptic.ok();
  debtUI.form = blankDebtForm();
  closeModal();
  rerender();
}

// Bitta ro'yxat: summa, limit va sur'at birga (avval uchta alohida blok edi)
function categoryCard(C, t, m, txs) {
  const out = txs.filter(x => x.k === 'out');
  const total = sum(out, x => x.a);
  const head = `<div class="ch"><span class="col"><span class="small muted" style="font-weight:600">Jami chiqim</span><span class="big">${money(total)} so'm</span></span><button class="link-btn" data-act="page" data-to="sz-lim">Limitlar</button></div>`;
  if (!total) return `<section class="card list">${head}${emptyBox("Bu oyda xarajat yo'q", 'Yozilgan chiqimlar shu yerda kategoriya bo\'yicha ko\'rinadi.')}</section>`;
  const by = {};
  for (const x of out) by[x.c] = (by[x.c] || 0) + x.a;
  for (const c of LIMIT_CATS) if (db.lim[c] && !by[c]) by[c] = 0;
  const mDays = DAYS.filter(d => d.month === m);
  const passed = mDays.filter(d => d.iso <= t).length;
  const live = m === t.slice(0, 7) && inPeriod(t) && passed >= 5;
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([c, v]) => {
    const cat = CATS[c] || CATS.boshqa;
    const lim = db.lim[c];
    const proj = Math.round((v / Math.max(1, passed)) * mDays.length);
    let note, tone = '', pct = (v / total) * 100, color = 'accent';
    if (cat.bad) { note = "Taqiqlangan: 0 bo'lishi kerak edi"; tone = 'c-bad'; pct = 100; color = 'coral'; }
    else if (lim) {
      pct = Math.min(100, (v / lim) * 100);
      const over = v > lim, risk = !over && live && proj > lim;
      note = over ? `Limit ${fmt(lim)} oshdi: ${fmt(v - lim)} ortiqcha` : live ? `Limit ${fmt(lim)} · shu sur'atda ${fmt(proj)}` : `Limit ${fmt(lim)} · ${fmt(lim - v)} qoldi`;
      tone = over ? 'c-bad' : risk ? 'c-warn' : 'c-in';
      color = over ? 'coral' : risk ? 'amber' : 'mint';
    } else if (c === 'yol') {
      const plan = mDays.filter(d => isWorkday(d)).length * PLAN.transport.amount;
      pct = plan ? Math.min(100, (v / plan) * 100) : 100;
      note = `Reja ${fmt(plan)}`;
    } else note = `${Math.round((v / total) * 100)}%`;
    return `<div class="cr"><div class="a"><span>${cat.name}</span><span class="num">${money(v)}</span></div>
      <span class="bar"><i style="width:${pct.toFixed(1)}%;--c:var(--${color})"></i></span><span class="small ${tone || 'muted'}">${note}</span></div>`;
  }).join('');
  return `<section class="card list">${head}${rows}</section>`;
}
// Rejadan tashqari, ixtiyoriy xarajat: yo'lkira, reja bandi, qarz va tuzatishsiz
const isFree = (C, x) => x.k === 'out' && x.c !== 'tuz' && x.c !== 'yol' && !x.debt && !(x.p && C.byPlan.get(x.p) === x);
const mln = v => `${(v / 1e6).toFixed(1).replace('.', ',')} mln`;
const kv = (k, v) => `<div class="spread" style="padding:10px 0;border-top:1px solid var(--line);font-size:.8125rem;gap:12px"><span class="muted" style="font-weight:600">${k}</span><b style="text-align:right">${v}</b></div>`;

// O'tib ketgan, yozilmagan yo'lkira hisobga olinmaydi (affordPath va C.prog bilan bir xil qoida)
function forecast(C) {
  const t = C.t;
  let s = C.total;
  for (const e of C.events.values()) if (e.iso < t && e.id !== 'yol' && isPending(C, e)) s += delta(e);
  for (const [iso, list] of Object.entries(C.dueByIso)) if (iso < t) s += sum(list, dueDelta);
  return DAYS.map(d => {
    const p = { iso: d.iso, plan: C.planByIso[d.iso], act: null, proj: null };
    if (d.iso < t) { p.act = totalOf(balOn(C, d.iso)); return p; }
    for (const e of C.byIso[d.iso]) if (isPending(C, e)) s += delta(e);
    s += sum(C.dueByIso[d.iso] || [], dueDelta);
    if (d.iso === t) p.act = C.total;
    p.proj = s;
    return p;
  });
}

function fcTip(ev) {
  const svg = ev.target.closest?.('.fc svg');

  const r = svg.getBoundingClientRect();
  const n = fcData.length - 1;
  const i = Math.max(0, Math.min(n, Math.round(((ev.clientX - r.left) / r.width) * n)));
  const q = fcData[i];

// ===== HUMO bilan solishtirish: har HUMO xabaridagi 💰 karta qoldig'i ↔ trekerdagi karta qoldig'i =====
// Farq birinchi paydo bo'lgan joy topiladi: oxirgi mos nuqtadan keyingi qo'lda yozilgan karta amallari — gumondorlar.
// Tuzatish HUMO xabaridan bir daqiqa oldinga yoziladi — o'sha xabardagi qoldiq bilan mos tushadi
const minuteBefore = tm => {
  if (!tm) return '';
  const [hh, mm] = tm.split(':').map(Number);
  const m = hh * 60 + mm - 1;
  return m < 0 ? '' : `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
};
function reconcile(C) {
  const pts = [];
  const run = { [db.cards[0]?.id || '']: db.open.card };
  for (let i = C.sorted.length - 1; i >= 0; i--) {
    const x = C.sorted[i];
    const a = x.acc === 'card' ? cardOf(x) : null, to = x.k === 'tr' && x.to === 'card' ? cardOf(x, 'to') : null;
    if (a !== null) run[a] = (run[a] || 0) + (x.k === 'in' ? x.a : -x.a);
    if (to !== null) run[to] = (run[to] || 0) + x.a;
    const kid = a ?? to;
    if (Number.isInteger(x.b) && kid !== null) {
      const app = run[kid];
      pts.push({ tx: x, i, kid, app, humo: x.b, diff: Math.floor(x.b / 100) - app, ok: Math.abs(app * 100 - x.b) < 100 });
    }
  }
  if (!pts.length) return null;
  // Har karta bo'yicha oxirgi tekshiruv; mos kelmaganlardan eng oxirgisi ko'rsatiladi
  const lasts = [...new Map(pts.map(q => [q.kid, q])).values()];
  const wrong = lasts.filter(q => !q.ok).sort((a, b) => a.i - b.i)[0];
  if (!wrong) return { pts, lasts, ok: true };
  const kp = pts.filter(q => q.kid === wrong.kid);
  // Oxirgi farq bilan bir xil farqli nuqtalar — bitta sabab; farq o'zgargan joy — paydo bo'lgan oraliq
  let k = kp.length - 1;
  while (k > 0 && !kp[k - 1].ok && kp[k - 1].diff === wrong.diff) k--;
  const bad = kp[k], from = kp[k - 1] || null;
  const upTo = from ? from.i : C.sorted.length;
  const mine = x => (x.acc === 'card' && cardOf(x) === bad.kid) || (x.k === 'tr' && x.to === 'card' && cardOf(x, 'to') === bad.kid);
  const suspects = C.sorted.filter((x, i) => i > bad.i && i < upTo && !x.h && x.c !== 'tuz' && mine(x));
  return { pts, lasts, ok: false, bad, from, suspects };
}

// ===== G'ayrioddiy xarajatlar: odatdagi chek, haftalik va kunlik o'rtachaga nisbatan =====
function anomalies(C, t) {
  const list = db.tx.filter(x => isFree(C, x) && x.d <= t);
  const span = Math.max(0, daysBetween(PLAN.start, t) + 1);
  const rat = v => v.toFixed(1).replace('.', ',').replace(',0', '');
  const res = [];
  if (list.length >= 8) {
    const amts = list.map(x => x.a).sort((a, b) => a - b);
    const med = amts[Math.floor(amts.length / 2)];
    for (const x of list.filter(z => z.d >= addDays(t, -13)).sort((a, b) => b.a - a.a).slice(0, 2)) {
      if (x.a < 50000 || x.a < med * 3) continue;
      res.push({ icon: CATS[x.c]?.icon || 'dots', color: 'amber', act: `data-act="edit-tx" data-id="${x.id}"`,
        text: `${longDate(x.d)}: «${esc(txTitle(x, C))}» <b>${fmt(x.a)}</b> — odatdagi xariddan ${rat(x.a / med)} barobar katta`, sub: `Odatdagi (o'rta) xarid: ${fmt(med)}` });
    }
  }
  const weeks = Math.floor((span - 7) / 7);
  if (weeks >= 3) {
    const cur = {}, prev = {};
    const from = addDays(t, -6), pFrom = addDays(t, -6 - 7 * weeks);
    for (const x of list) {
      if (x.d >= from) cur[x.c] = (cur[x.c] || 0) + x.a;
      else if (x.d >= pFrom) prev[x.c] = (prev[x.c] || 0) + x.a;
    }
    for (const [c, v] of Object.entries(cur)) {
      const avg = (prev[c] || 0) / weeks;
      if (v < 30000 || v < avg * 2) continue;
      res.push({ icon: 'up', color: 'coral', act: '',
        text: `Bu hafta «${CATS[c]?.name || 'Boshqa'}» odatdagidan ${avg ? `<b>${rat(v / avg)} barobar</b>` : '<b>ancha</b>'} ko'p: ${fmt(v)}`, sub: `Oldingi ${weeks} hafta o'rtachasi: ${fmt(Math.round(avg))} / hafta` });
    }
  }
  if (span >= 15) {
    const tday = sum(list.filter(x => x.d === t), x => x.a);
    const avg = sum(list.filter(x => x.d < t), x => x.a) / (span - 1);
    if (tday >= 30000 && tday >= avg * 3) {
      res.push({ icon: 'alert', color: 'coral', act: 'data-act="today-tx"',
        text: `Bugun rejadan tashqari <b>${fmt(tday)}</b> — kunlik o'rtachadan ${avg ? `${rat(tday / avg)} barobar` : 'ancha'} ko'p`, sub: `Kunlik o'rtacha: ${fmt(Math.round(avg))}` });
    }
  }
  return { res: res.slice(0, 4), need: Math.max(0, 28 - span) };
}

function saveCard() {

  if (l4 && !/^\d{4}$/.test(l4)) { toast("Oxirgi 4 raqamni to'liq kiriting"); haptic.error(); return; }
  if (l4 && db.cards.some(k => k.id !== f.id && k.l4 === l4)) { toast('Bu raqamli karta allaqachon bor'); haptic.error(); return; }
  if (f.id) {
    const k = cardById(f.id);
    const ch = [];
    if (k.n !== n) ch.push(`nomi ${k.n} → ${n}`);
    if (k.l4 !== l4) ch.push('raqami');
    if (f.main && !k.main) { db.cards.forEach(x => { x.main = x === k; }); ch.push('asosiy karta qilindi'); }
    Object.assign(k, { n, l4, ty: f.ty, col: f.col });

    const k = { id: nextId('k'), n, l4, ty: f.ty, col: f.col, main: first, off: false };

      for (const t of db.tx) {
        const was = `${t.cd}|${t.tc}`;

    logEv('set', `Karta qo'shildi: ${n}${l4 ? ` ·${l4}` : ''}${first ? ' (asosiy)' : ''}`);
    const bal = digits(f.bal);
    if (!first && bal) {

const exportText = () => JSON.stringify({
  v: 2, plan: PLAN_RAW, open: db.open, work: db.work, lim: db.lim, seq: db.seq, cards: db.cards,
  debts: db.debts, tx: [...db.tx].sort((a, b) => a.d.localeCompare(b.d) || idNum(a.id) - idNum(b.id)), log: db.log, wish: db.wish, due: db.due,
});
function parseBackup(text) {
  if (!text) throw new Error('Avval zaxira JSON matnini joylang.');
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error(`JSON xato: ${e.message}`); }
  if (!isObj(data)) throw new Error("Format noto'g'ri: obyekt kutilgan.");
  if (data.v === 1) {
    if (!isObj(data.months)) throw new Error("Format noto'g'ri: \"months\" topilmadi.");
    const prev = db;
    db = blankDb();
    try { migrateV1(data.months); return db; } finally { db = prev; }
  }
  if (data.v !== 2 || !Array.isArray(data.tx) || !Array.isArray(data.debts)) throw new Error('Format noto\'g\'ri: {"v": 2, "tx": [...], "debts": [...]} kutilgan.');
  const meta = cleanMeta({ ...data, mig: 1 });
  const wish = Array.isArray(data.wish) ? data.wish.map(cleanWish) : [];
  const due = Array.isArray(data.due) ? data.due.map(cleanDue) : [];
  return finishDb({ ...meta, wish, due }, data.debts.map(cleanDebt), data.tx.map(cleanTx), data.log || []);
}
// sep=';' — fayl (Excel), sep='\t' — buferga (Excel/Sheets'ga joylanganda ustunlarga bo'linadi)
function csvText(sep) {
  const C = calc();
  const TYPE = { in: 'Kirim', out: 'Chiqim', tr: "O'tkazma" };
  const cell = v => {
    let s = String(v);
    if (/^[=+\-@]/.test(s)) s = `'${s}`;
    return s.includes(sep) || /["\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [['Sana', 'Vaqt', 'Turi', 'Summa', 'Hisob', 'Qayerga', 'Kategoriya', 'Nomi', 'Izoh', 'Manba']];
  for (const t of [...C.sorted].reverse()) {
    rows.push([dm(t.d) + '.' + t.d.slice(0, 4), t.tm, TYPE[t.k], t.a, accName(t.acc, cardOf(t)), t.to ? accName(t.to, cardOf(t, 'to')) : '',
      t.c ? CATS[t.c].name : '', txTitle(t, C), t.n, t.h ? 'HUMO' : '']);
  }
  return rows.map(r => r.map(cell).join(sep)).join('\r\n');
}

}
function showLock(mode, done) {

  $('lock').innerHTML = `<div class="lockbox" role="dialog" aria-modal="true" aria-labelledby="lock-title">

    <p class="small ${u.msg || wait ? 'c-bad' : 'muted'}" style="min-height:18px;font-weight:700" role="alert">${wait ? `Juda ko'p urinish. ${wait} soniyadan keyin qayta urining.` : esc(u.msg)}</p>

    <div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button data-act="pin-key" data-k="${k}"${dis}>${k}</button>`).join('')}
      ${side}<button data-act="pin-key" data-k="0"${dis}>0</button><button data-act="pin-key" data-k="back" aria-label="O'chirish">${ic('backspace', 24)}</button></div>

async function pinKey(k) {
  const u = pinUI;

  if (k === 'back') { u.buf = u.buf.slice(0, -1); renderLock(); return; }
  if (u.buf.length >= PIN_LEN) return;
  u.buf += k;
  u.msg = '';
  renderLock();
  if (u.buf.length < PIN_LEN) return;
  const pin = u.buf;
  if (u.mode === 'set1') { Object.assign(u, { first: pin, buf: '', mode: 'set2' }); renderLock(); return; }
  if (u.mode === 'set2') {
    if (pin !== u.first) {

      haptic.error();
      renderLock(true);
      return;
    }
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    db.pin = { s: salt, h: await pinHash(pin, salt) };
    touch('meta');
    logEv('set', "PIN-kod o'rnatildi");
    haptic.ok();
    toast("PIN-kod o'rnatildi");
    finishLock();
    return;
  }
  if (db.pin && (await pinHash(pin, db.pin.s)) === db.pin.h) {
    u.fails = 0;
    haptic.ok();
    finishLock();
    return;
  }
  u.fails++;
  u.buf = '';
  u.msg = "Noto'g'ri PIN-kod";
  if (u.fails >= 5) { u.until = Date.now() + 30000; u.fails = 0; }

}

// ===== Egasi tekshiruvi: treker faqat bot egasining Telegram akkauntida ochiladi =====
// OWNER_HASH ni pages workflow'i joylaydi: sha256("byudjet-bot:" + CHAT_ID secret). ID kodda turmaydi.
// Lokal fayl va localhost — tekshirish uchun ochiq.
const OWNER_HASH = '__OWNER_HASH__';
const DEV_HOST = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
// PBKDF2 (pages.yml bilan bir xil): sahifadagi hash'dan Telegram ID ni tanlab topish juda qimmat
const OWNER_ITER = 300000;
async function ownerMatch(id, hash) {
  if (!id || !/^[0-9a-f]{64}$/.test(hash) || !window.crypto?.subtle) return false;
  const enc = new TextEncoder();

  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('byudjet-bot'), iterations: OWNER_ITER }, key, 256);
  return hex(new Uint8Array(bits)) === hash;
}
// Sekin hash har ochilishda hisoblanmasin: shu qurilmada egasi tasdiqlangan bo'lsa — eslab qolinadi
// (id va sahifadagi hash bilan; boshqa akkaunt yoki yangi hash bo'lsa qayta tekshiriladi)
async function isOwner() {
  if (DEV_HOST) return true;
  const id = inTelegram && WA.initDataUnsafe?.user?.id;
  if (!id) return false;
  const memo = `${id}:${OWNER_HASH}`;
  try { if (localStorage.getItem('byudjet:ui:owner') === memo) return true; } catch { /* saqlash yo'q */ }
  const ok = await ownerMatch(id, OWNER_HASH);
  if (ok) try { localStorage.setItem('byudjet:ui:owner', memo); } catch { /* saqlash yo'q */ }
  return ok;
}

// ===== Jonli effektlar: konfetti, raqam sanash =====
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n = 140) {
  haptic.ok();
  if (reducedMotion()) return;
  const cv = document.createElement('canvas');
  cv.className = 'confetti';
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  document.body.append(cv);
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colors = ['--accent', '--mint', '--amber', '--coral', '--purple', '--pink'].map(v => css.getPropertyValue(v).trim() || '#4F8BFF');
  const P = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - 0.5) * 120, y: H * 0.38, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 5,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0],
  }));
  let last = performance.now();
  const end = last + 4000;
  const frame = () => {
    const now = performance.now(); // rAF vaqt belgisi ba'zi WebView'larda boshqa soatdan keladi
    const dt = Math.max(0, Math.min(32, now - last)) / 16;
    last = now;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of P) {
      p.vy += 0.38 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.y < H + 20) alive++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    }
    if (alive && now < end) requestAnimationFrame(frame); else cv.remove();
  };
  requestAnimationFrame(frame);
  setTimeout(() => cv.remove(), 4500); // kadrlar to'xtab qolsa ham (fon, eski WebView) ekranda qolib ketmasin
}

}
function countTo(el, from, to, dur, pre = '') {
  const t0 = performance.now();
  const step = () => {
    if (!el.isConnected) return;
    const k = Math.max(0, Math.min(1, (performance.now() - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
    el.textContent = pre + fmt(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = pre + fmt(from);
  requestAnimationFrame(step);
  setTimeout(() => { if (el.isConnected) el.textContent = pre + fmt(to); }, dur + 80); // kadr kelmasa ham yakuniy qiymat
}

// ===== Intizom bahosi (0–100) va nishonlar =====
function health(C, t) {
  const past = DAYS.filter(d => d.iso <= t).slice(-14);
  const ok = past.filter(d => !C.dayStat[d.iso]?.bad).length;
  const overdue = [...C.events.values()].filter(e => e.iso < t && e.id !== 'yol' && isPending(C, e)).length;
  const lateDebts = db.debts.filter(d => d.dir === 'owe' && d.due && d.due < t && !debtState(C, d).closed).length;
  const parts = [
    { name: 'Intizom', max: 40, v: past.length ? Math.round((40 * ok) / past.length) : 40, sub: `So'nggi ${past.length || 14} kunning ${ok} tasida taqiqlangan xarajat yo'q`, tip: 'Ko\'cha ovqati, kofe va taksidan saqlaning' },
    { name: 'Rejaga muvofiqlik', max: 30, v: C.dev >= 0 ? 30 : Math.round(30 * Math.max(0, 1 + C.dev / 500000)), sub: `Reja holati: ${C.dev ? signed(C.dev) : '±0'}`, tip: 'Rejadan tashqari xarajatni kamaytiring' },
    { name: 'Reja bandlari', max: 15, v: Math.max(0, 15 - 5 * overdue), sub: overdue ? `${overdue} ta belgilanmagan band` : 'Hammasi belgilangan', tip: 'Belgilanmagan rejalarni belgilang' },
    { name: 'Qarzlar', max: 15, v: Math.max(0, 15 - 8 * lateDebts), sub: lateDebts ? `${lateDebts} ta muddati o'tgan qarz` : "Muddati o'tgan qarz yo'q", tip: "Muddati o'tgan qarzni yoping" },
  ];
  const score = sum(parts, p => p.v);
  const [level, color] = score >= 90 ? ["A'lo", 'mint'] : score >= 75 ? ['Yaxshi', 'blue'] : score >= 50 ? ["O'rtacha", 'amber'] : ['Xavf', 'coral'];
  const weak = parts.reduce((a, b) => (b.max - b.v > a.max - a.v ? b : a));
  return { score, level, color, parts, tip: weak.v < weak.max ? weak.tip : 'Hammasi zo\'r — shunday davom eting' };
}
const BADGES = [
  ['first', 'Birinchi qadam', 'Birinchi amalni yozdingiz', 'check', 'mint'],
  ['streak7', '7 kun taqiqsiz', 'Ketma-ket 7 kun qoidaga amal qildingiz', 'flame', 'amber'],
  ['streak30', '30 kun taqiqsiz', 'Ketma-ket 30 kun — temir intizom', 'flame', 'coral'],
  ['lockday', "Omonat to'ldi", "Omonat kuni pulni o'sha kuni o'tkazdingiz", 'lock', 'blue'],
  ['nodebt', 'Qarzsiz', 'Barcha qarzlaringiz yopilgan', 'users', 'teal'],
  ['planmonth', 'Reja ustasi', 'Bir oyning hamma reja bandlari bajarildi', 'calendar', 'purple'],
  ['humo10', 'HUMO ustasi', '10 ta amal HUMO dan import qilindi', 'clipboard', 'teal'],
  ['plus', 'Rejadan oldinda', 'Balansingiz rejadagidan ko\'p', 'chart', 'mint'],
  ['half', "Yarim yo'l", 'Yakuniy maqsadning yarmi yig\'ildi', 'target', 'pink'],
];
function badges(C, t) {
  let run = 0, best = 0;
  for (const d of DAYS) { if (d.iso > t) break; run = C.dayStat[d.iso]?.bad ? 0 : run + 1; best = Math.max(best, run); }
  const monthDone = MONTHS.some(m => {
    const days = DAYS.filter(d => d.month === m);
    if (!days.length || days[days.length - 1].iso >= t) return false;
    return days.every(d => C.byIso[d.iso].every(e => e.id === 'yol' || !isPending(C, e)));
  });
  const has = {
    first: db.tx.length > 0,
    streak7: best >= 7,
    streak30: best >= 30,
    lockday: db.tx.some(x => x.p?.endsWith(':lock') && x.d === x.p.slice(0, 10)),
    nodebt: db.debts.some(d => d.dir === 'owe') && db.debts.filter(d => d.dir === 'owe').every(d => debtState(C, d).closed),
    planmonth: monthDone,
    humo10: db.tx.filter(x => x.h).length >= 10,

}

function checkBadges(C, t) {

  const all = [...new Set([...(Array.isArray(seen) ? seen : []), ...earned])];
  try { localStorage.setItem('byudjet:ui:badges', JSON.stringify(all)); } catch { /* saqlash yo'q */ }
  if (!Array.isArray(seen)) return;
  const fresh = earned.filter(id => !seen.includes(id));

}

// ===== Aqlli xulosalar =====
function insights(C, t) {
  const res = [];
  const planned = x => x.p && C.byPlan.get(x.p) === x;
  const free = x => x.k === 'out' && x.c !== 'tuz' && x.c !== 'yol' && !x.debt && !planned(x); // rejadan tashqari, ixtiyoriy
  const byCat = (from, to) => {
    const o = {};
    for (const x of db.tx) if (free(x) && x.d >= from && x.d <= to) o[x.c] = (o[x.c] || 0) + x.a;
    return o;
  };
  const cur = byCat(addDays(t, -6), t), prev = byCat(addDays(t, -13), addDays(t, -7));
  let best = null;
  for (const c of new Set([...Object.keys(cur), ...Object.keys(prev)])) {
    const a = cur[c] || 0, b = prev[c] || 0;
    if (Math.abs(a - b) >= 20000 && (!best || Math.abs(a - b) > Math.abs(best.a - best.b))) best = { c, a, b };
  }
  if (best && addDays(t, -13) >= PLAN.start) {
    const name = CATS[best.c]?.name || 'Boshqa', more = best.a > best.b;
    const text = !best.b ? `Bu hafta «${name}» uchun ${fmt(best.a)} sarfladingiz — o'tgan hafta umuman yo'q edi`
      : !best.a ? `Bu hafta «${name}» uchun hech narsa sarflamadingiz — o'tgan hafta ${fmt(best.b)} edi`
      : `Bu hafta «${name}» uchun o'tgan haftadan <b>${Math.round((Math.abs(best.a - best.b) / best.b) * 100)}% ${more ? "ko'p" : 'kam'}</b> sarfladingiz (${fmt(best.a)} / ${fmt(best.b)})`;
    res.push({ icon: more ? 'up' : 'down', color: more ? 'amber' : 'mint', text });
  }
  let quiet = 0;
  for (let i = 0; i < 60; i++) {
    const d = addDays(t, -i);
    if (d < PLAN.start || db.tx.some(x => free(x) && x.d === d)) break;
    quiet++;
  }
  if (quiet >= 3) res.push({ icon: 'check', color: 'mint', text: `<b>${quiet} kun</b>dan beri rejadan tashqari xarajat yo'q` });
  const m = t.slice(0, 7), dom = Number(t.slice(8)), dim = new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5)), 0)).getUTCDate();
  for (const c of LIMIT_CATS) {
    const lim = db.lim[c];
    if (!lim || dom < 5) continue;
    const v = sum(db.tx.filter(x => x.k === 'out' && x.c === c && x.d.startsWith(m)), x => x.a);
    const proj = Math.round((v / dom) * dim);
    if (v < lim && proj > lim * 1.1) res.push({ icon: 'alert', color: 'amber', text: `Shu sur'atda oy oxirigacha «${CATS[c].name}» <b>${fmt(proj)}</b> bo'ladi — limit ${fmt(lim)}` });
  }
  const past = DAYS.filter(d => d.iso < t);
  if (past.length >= 14) {
    const spend = {};
    for (const x of db.tx) if (free(x)) spend[x.d] = (spend[x.d] || 0) + x.a;
    const tot = Array(7).fill(0), cnt = Array(7).fill(0);
    for (const d of past) { tot[d.dow] += spend[d.iso] || 0; cnt[d.dow]++; }
    const avg = tot.map((v, i) => (cnt[i] ? v / cnt[i] : 0));
    const all = sum(tot, v => v) / past.length;
    const i = avg.indexOf(Math.max(...avg));
    if (avg[i] >= 10000 && avg[i] >= all * 1.5) res.push({ icon: 'calendar', color: 'purple', text: `<b>${WEEKDAYS[i]}</b> kunlari eng ko'p sarflaysiz — o'rtacha ${fmt(Math.round(avg[i]))}` });
  }
  const places = {};
  for (const x of db.tx) {
    if (!x.h || x.k !== 'out' || x.d < addDays(t, -29)) continue;
    const p = x.n.split(' · ').pop();
    if (p) { places[p] ||= { n: 0, a: 0 }; places[p].n++; places[p].a += x.a; }
  }
  const top = Object.entries(places).sort((a, b) => b[1].a - a[1].a)[0];
  if (top && top[1].n >= 3) res.push({ icon: 'cart', color: 'teal', text: `Eng ko'p pul ketgan joy: <b>${esc(top[0])}</b> — ${top[1].n} marta, ${fmt(top[1].a)}` });
  return res.slice(0, 3);
}
function insightsCard(C, t) {
  const list = insights(C, t).slice(0, 3);
  if (!list.length) return '';
  return `<section class="card list"><div class="ch"><h2 class="h2">Shu oyda nima bo'ldi</h2></div>
    ${list.map(x => `<div class="row" style="min-height:0"><span class="tile soft" style="--c:var(--${x.color})">${ic(x.icon, 18)}</span>`

// ===== «Qachon sotib ola olaman?»: rejani buzmasdan qaysi kundan pul yetadi =====
// Karta + naqd (omonatga tegilmaydi) kunma-kun reja bandlari bo'yicha: xariddan keyin hech qaysi kunda manfiyga tushmasligi kerak.
function affordPath(C) {
  const t = C.t;
  let s = C.bal.card + C.bal.cash;
  const step = e => (e.kind === 'lock' ? -e.amount : delta(e));
  for (const e of C.events.values()) if (e.iso < t && e.id !== 'yol' && isPending(C, e)) s += step(e); // muddati o'tgan bandlar
  for (const [iso, list] of Object.entries(C.dueByIso)) if (iso < t) s += sum(list, dueDelta); // to'lanmagan o'zim qo'shganlar
  const path = [];
  for (const d of DAYS) {
    if (d.iso < t) continue;
    for (const e of C.byIso[d.iso]) if (isPending(C, e)) s += step(e);
    s += sum(C.dueByIso[d.iso] || [], dueDelta);
    path.push({ iso: d.iso, s });
  }
  if (!path.length) path.push({ iso: t, s });
  for (let i = path.length - 1, m = Infinity; i >= 0; i--) { m = Math.min(m, path[i].s); path[i].min = m; }
  return path;
}
// Erkin pul: rejadagi barcha to'lovlardan keyin karta + naqddan hozir sarflash mumkin bo'lgan summa
function freeMoney(C) {
  const path = affordPath(C);
  const low = path.find(x => x.s === path[0].min) || path[0];
  return { v: path[0].min, iso: low.iso };
}
function freeInfo() {
  const C = calc(), fm = freeMoney(C);
  const hand = C.bal.card + C.bal.cash;
  const next = DAYS.find(d => d.iso > C.t && C.byIso[d.iso].some(e => e.kind === 'in' && isPending(C, e)));
  const inc = next ? sum(C.byIso[next.iso].filter(e => e.kind === 'in' && isPending(C, e)), e => e.amount) : 0;
  const free = Math.max(0, fm.v), short = Math.max(0, -fm.v);
  openModal(`<div class="sh-h"><span class="col"><span class="lbl">Sarflasa bo'ladi</span><span class="sh-big">${fmt(free)} <small>so'm</small></span></span>${closeBtn()}</div>
    <p>${short ? `${longDate(fm.iso)}da ${fmt(short)} so'm yetmaydi. Yangi xarajat qilmang yoki bir to'lovni suring.` : "Bugun shuncha sarflasangiz ham, rejadagi hamma to'lovlarga pul yetadi."}</p>
    <div><div class="kv"><span>Karta va naqd</span><b>${fmt(hand)}</b></div><div class="kv"><span>Oldindagi to'lovlar va yo'lkira</span><b>−${fmt(hand - fm.v)}</b></div>
      <div class="kv tot"><b>${short ? 'Yetmaydi' : 'Erkin'}</b><b class="${short ? 'c-bad' : 'c-in'}">${fmt(short || free)}</b></div></div>
    <div class="msg soft c-acc">${ic('info', 16)}<span>Eng qiyin kun ${longDate(fm.iso)}.${next ? ` ${longDate(next.iso)}da ${fmt(inc)} keladi.` : ''} Omonat hisobga olinmagan.</span></div>
    <div class="grid2" style="gap:8px"><button class="btn" data-act="afford">Xarid rejalash</button><button class="btn primary" data-act="modal-close">Tushunarli</button></div>`);
}
function whenAfford(C, price) {
  const p = affordPath(C);
  const i = p.findIndex(x => x.min >= price);
  const low = p.find(x => x.s - price < 0);
  return { now: i === 0, iso: i < 0 ? '' : p[i].iso, max: Math.max(0, p[0].min), low };
}
function affordResultHTML(price) {
  const C = calc();
  if (!price) return '<p class="small muted" style="text-align:center">Narxni kiriting</p>';

    : r.iso ? `<div class="msg soft c-warn">${ic('calendar', 18)}<span><b>${longDate(r.iso)}</b> dan keyin oling. Hozir olsangiz, ${dm(r.low.iso)} da ${fmt(price - r.low.s)} so'm yetmay qoladi.</span></div>`
    : `<div class="msg soft c-bad">${ic('alert', 18)}<span>Davr oxirigacha rejani buzmasdan olib bo'lmaydi. Hozir rejaga zarar qilmasdan sarflash mumkin bo'lgani: <b>${fmt(r.max)}</b> so'm.</span></div>`;
  return `${main}<div class="spread small" style="padding:0 4px"><span class="muted">Yakuniy prognoz</span><b>${fmt(prog)} → ${fmt(prog - price)}</b></div>`;

// ===== Bir qatorli tez yozish: «30k non karta», «+3.3m oylik», «kecha 12 000 taksi naqd» =====
function parseLine(s) {
  let x = ` ${s.toLowerCase().replace(/[ʻʼ’‘`]/g, "'").replace(/(\d)[ .](?=\d{3}(?!\d))/g, '$1')} `;
  const r = { a: 0, k: '', acc: '', y: false, note: '' };
  const am = x.match(/(\d+(?:[.,]\d+)?)\s*(k|ming|mln|million|m)?(?![a-z0-9'])/);
  if (am) {
    const mul = /^(k|ming)$/.test(am[2] || '') ? 1000 : am[2] ? 1e6 : 1;
    r.a = Math.round(parseFloat(am[1].replace(',', '.')) * mul);
    x = x.replace(am[0], ' ');
  }
  if (/(^|\s)\+/.test(x) || /\b(kirim|oylik|avans|tushdi|keldi|qaytdi)\b/.test(x)) r.k = 'in';
  if (/\b(karta|kartadan|kartaga|card|humo)\b/.test(x)) r.acc = 'card';
  else if (/\b(naqd|naqt|naqddan|naqdga|cash)\b/.test(x)) r.acc = 'cash';
  r.y = /\bkecha\b/.test(x);
  r.note = x.replace(/\b(karta|kartadan|kartaga|card|naqd|naqt|naqddan|naqdga|cash|kecha|bugun)\b/g, ' ').replace(/[+\-−]/g, ' ').replace(/\s+/g, ' ').trim();
  return r;
}
function applyLine(s) {
  if (!s.trim() || !form) return;
  const r = parseLine(s);
  if (!r.a) { toast('Summani topa olmadim — masalan: 30k non karta'); haptic.error(); return; }
  const k = r.k || (form.k === 'in' ? 'in' : 'out');
  const note = r.note ? r.note[0].toUpperCase() + r.note.slice(1) : '';
  const c = noteCat(note, k);
  form.expr = String(Math.min(r.a, 999999999));
  Object.assign(form, { k, a: form.expr, acc: r.acc || (form.acc === 'save' ? 'card' : form.acc), to: '', n: note || form.n, debt: '', p: '' });
  if (r.y) form.d = clampDate(addDays(today(), -1));
  if (c) { form.c = c; form.catSet = false; } else if (!catOk(form.c, k)) form.c = '';
  haptic.ok();
  rerender();
  toast(`Ajratildi: ${k === 'in' ? '+' : '−'}${fmt(digits(form.a))}${form.c ? ` · ${CATS[form.c].name}` : ''} · ${ACC[form.acc].name}`);
}

function wrapReady(t) {
  const cur = t.slice(0, 7), day = Number(t.slice(8));
  const prev = MONTHS[MONTHS.indexOf(cur) - 1] || (cur > PLAN.end.slice(0, 7) ? MONTHS[MONTHS.length - 1] : '');

function monthWrap(C, m) {
  const t = C.t;
  const days = DAYS.filter(d => d.month === m && d.iso <= t);
  const txs = db.tx.filter(x => x.d.startsWith(m) && x.d <= t && x.c !== 'tuz');
  const outs = txs.filter(x => x.k === 'out');
  const byCat = {};
  for (const x of outs) byCat[x.c] = (byCat[x.c] || 0) + x.a;
  let run = 0, best = 0;
  for (const d of days) { run = C.dayStat[d.iso]?.bad ? 0 : run + 1; best = Math.max(best, run); }
  const bad = days.filter(d => C.dayStat[d.iso]?.bad).length;
  const last = days.length ? days[days.length - 1].iso : t;
  return {
    m, days, count: txs.length, ins: sum(txs.filter(x => x.k === 'in'), x => x.a), outs: sum(outs, x => x.a),
    cats: Object.entries(byCat).sort((a, b) => b[1] - a[1]), biggest: [...outs].sort((a, b) => b.a - a.a)[0] || null,
    bad, ok: days.length - bad, best, locked: sum(txs.filter(x => x.k === 'tr' && x.to === 'save'), x => x.a),
    last, endBal: totalOf(balOn(C, last)), planBal: C.planByIso[last] ?? PLAN.startBalance,
  };
}

function wrapCanvas() {
  const w = story.data, C = calc(), h = health(C, C.t);

  cv.width = 1080; cv.height = 1350;
  const g = cv.getContext('2d');

  grad.addColorStop(0, '#2F6BFF'); grad.addColorStop(1, '#0B1638');
  g.fillStyle = grad; g.fillRect(0, 0, 1080, 1350);
  const font = (wt, px) => `${wt} ${px}px "Manrope Variable", Manrope, system-ui, sans-serif`;
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = font(700, 40); g.fillText('OY YAKUNI · BYUDJET TREKER', 80, 150);
  g.fillStyle = '#FFFFFF'; g.font = font(800, 104); g.fillText(`${monthName(w.m)} ${w.m.slice(0, 4)}`, 80, 270);
  const rows = [['Kirim', `+${fmt(w.ins)}`, '#8FF0C4'], ['Chiqim', `−${fmt(w.outs)}`, '#FFFFFF'],
    ["Eng ko'p", w.cats[0] ? `${CATS[w.cats[0][0]]?.name || ''} · ${fmt(w.cats[0][1])}` : '—', '#FFFFFF'],

    ['Oy oxiridagi balans', fmt(w.endBal), '#FFFFFF'], ['Intizom bahosi', `${h.score} / 100 · ${h.level}`, '#FFD27A']];
  let y = 420;
  for (const [k, v, col] of rows) {
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(80, y - 70, 920, 1.5);
    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = font(600, 38); g.fillText(k, 80, y);
    g.fillStyle = col; g.font = font(800, 46); g.textAlign = 'right'; g.fillText(v, 1000, y); g.textAlign = 'left';
    y += 120;
  }
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = font(600, 32); g.fillText(`Maqsad ${dm(PLAN.end)}.${PLAN.end.slice(0, 4)}: ${fmt(C.final)} so'm`, 80, 1270);
  return cv;
}
async function saveWrapImage() {
  const cv = wrapCanvas();

  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  if (blob && !inTelegram) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Rasm saqlandi');

  }
  if (blob && ['android', 'android_x', 'ios'].includes(WA.platform)) {
    try {
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  // Ulashib bo'lmasa — rasm shu yerda ko'rsatiladi, bosib turib saqlanadi

// Tarix: qatorni chapga surish — o'chirish, o'ngga — bugunga nusxalash (90px dan keyin)
const swipe = { row: null, id: 0, x0: 0, y0: 0, dx: 0, on: false, block: false };
const SWIPE_AT = 90;
document.addEventListener('pointerdown', ev => {
  const row = ev.target.closest?.('.sw > .row[data-id]');
  if (!row || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  Object.assign(swipe, { row, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, dx: 0, on: false });
});
document.addEventListener('pointermove', ev => {
  const s = swipe;
  if (!s.row || ev.pointerId !== s.id) return;
  const dx = ev.clientX - s.x0, dy = ev.clientY - s.y0;
  if (!s.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s.row = null; return; }
    if (Math.abs(dx) < 12) return;
    s.on = true;
    s.row.classList.add('swiping');
    try { s.row.setPointerCapture(ev.pointerId); } catch { /* sintetik hodisa */ }
  }
  s.dx = Math.max(-140, Math.min(140, dx));
  s.row.style.transform = `translateX(${s.dx}px)`;
  const wrap = s.row.parentElement;
  if (s.dx > 0) wrap.dataset.dir = 'r'; else wrap.dataset.dir = 'l';
  if (Math.abs(s.dx) >= SWIPE_AT && !s.row.dataset.armed) { s.row.dataset.armed = '1'; haptic.light(); }
  if (Math.abs(s.dx) < SWIPE_AT) delete s.row.dataset.armed;
});
function endSwipe(ev) {
  const s = swipe;
  if (!s.row || ev.pointerId !== s.id) return;
  const { row, dx, on } = s;
  s.row = null;
  if (!on) return;
  s.block = true; // keyingi "click" tahrirlashni ochmasin
  setTimeout(() => { s.block = false; }, 350);
  row.classList.remove('swiping');
  const tx = db.tx.find(x => x.id === row.dataset.id);
  if (ev.type === 'pointerup' && tx && Math.abs(dx) >= SWIPE_AT) {
    if (dx < 0) deleteTx(tx); else copyTxToday(tx);
    rerender();
    return;
  }
  row.style.transform = '';
  setTimeout(() => { delete row.parentElement?.dataset.dir; }, 200);
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
document.addEventListener('click', ev => {
  if (swipe.block && ev.target.closest?.('.sw')) { swipe.block = false; ev.stopPropagation(); ev.preventDefault(); }
}, true);
