<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Byudjet treker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5.2.8/index.min.css">
<style>
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --surface2: #E8ECF2; --field: #F6F7F9; --line: #DDE2EA;
  --nav: #FFFFFF; --nav-line: #DDE2EA; --text: #0E1116; --muted: #5B6678; --soft: #3D4757;
  --accent: #2563D9; --on-accent: #FFFFFF; --sel: #E4EDFC; --on-strong: #FFFFFF;
  --blue: #2563D9; --mint: #0E7A4D; --coral: #C7382B; --amber: #8A5A00; --teal: #0B7D73;
  --purple: #6A48D7; --pink: #B8336A; --gray: #5B6678;
  --hero: #18355E; --hero-muted: #B9CCEB; --shadow: rgba(14, 17, 22, .18);
  --ch-plan: #2563D9; --ch-act: #0E7A4D;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #171B22; --surface2: #1E242E; --field: #12161C; --line: #2A3140;
    --nav: #12161C; --nav-line: #222935; --text: #ECEFF4; --muted: #8F99AB; --soft: #AEB6C4;
    --accent: #6EA8FE; --on-accent: #0B1220; --sel: #1E2A3D; --on-strong: #0B1220;
    --blue: #6EA8FE; --mint: #3DDC97; --coral: #FF7B6B; --amber: #F5B83D; --teal: #4FD1C5;
    --purple: #B69CFF; --pink: #FF8FB1; --gray: #AEB6C4; --shadow: rgba(0, 0, 0, .45);
    --ch-plan: #4F8FEA; --ch-act: #22AE76;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #171B22; --surface2: #1E242E; --field: #12161C; --line: #2A3140;
  --nav: #12161C; --nav-line: #222935; --text: #ECEFF4; --muted: #8F99AB; --soft: #AEB6C4;
  --accent: #6EA8FE; --on-accent: #0B1220; --sel: #1E2A3D; --on-strong: #0B1220;
  --blue: #6EA8FE; --mint: #3DDC97; --coral: #FF7B6B; --amber: #F5B83D; --teal: #4FD1C5;
  --purple: #B69CFF; --pink: #FF8FB1; --gray: #AEB6C4; --shadow: rgba(0, 0, 0, .45);
    --ch-plan: #4F8FEA; --ch-act: #22AE76;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--text); overflow-x: hidden;
  font: 500 15px/1.4 'Manrope Variable', Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, p { margin: 0; }
.i { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

#loading { padding: 64px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
#view { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(112px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
body.sub #view { padding-top: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
body.sub #nav { display: none; }

/* Umumiy bloklar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
.h2 { font-size: 16px; font-weight: 800; }
.kicker, .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.big { font-size: 22px; font-weight: 800; line-height: 1.2; }
.num { white-space: nowrap; font-weight: 800; }
.c-in { color: var(--mint); } .c-bad { color: var(--coral); } .c-warn { color: var(--amber); }
.c-acc { color: var(--accent); } .c-soft { color: var(--soft); } .c-muted { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 0 4px; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.list { padding-bottom: 6px; gap: 0; }
.card.list > .spread { margin-bottom: 4px; }
.card.bad-border { border: 1px solid var(--coral); }
.card.warn-border { border: 1px solid var(--amber); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lbl { font-size: 12px; font-weight: 700; }
.kpi .num { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.rowcard { flex-direction: row; align-items: center; gap: 14px; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* Rangli fon: rang currentColor dan olinadi (color-mix kerak emas) */
.soft { position: relative; isolation: isolate; }
.soft::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: .14; z-index: -1; }

.pill-btn { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: var(--surface2); color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; text-decoration: none; }
.pill-btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 800; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface2); color: var(--text);
  display: flex; align-items: center; justify-content: center; flex: none; padding: 0; }
.round.sm { width: 40px; height: 40px; }
.round:disabled { opacity: .35; }
.btn { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); padding: 0 12px;
  font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-size: 15px; min-height: 54px; border-radius: 16px; }
.btn.primary.bad { background: var(--coral); color: var(--on-strong); }
.btn.primary:disabled { background: var(--surface2); color: var(--muted); }
.btn.fill-warn { background: var(--amber); color: var(--on-strong); border-color: transparent; }
.btn.danger { color: var(--coral); }
.btn.sm { min-height: 44px; border-radius: 12px; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 700; min-height: 32px; padding: 0; }

/* Ikonka plitkasi */
.tile { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; color: var(--c, var(--accent)); }
.tile.lg { width: 48px; height: 48px; border-radius: 16px; }
.tile.md { width: 46px; height: 46px; border-radius: 15px; }

/* Amal qatori */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); width: 100%;
  background: none; text-align: left; color: var(--text); min-height: 60px; }
.group > .row:first-child { border-top: 0; }
.row .t { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .t > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.end .num { font-size: 14px; }
.end .bal { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 800; color: var(--coral); padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--soft); padding: 2px 6px; border-radius: 6px; background: var(--surface2); flex: none; }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 12px; white-space: nowrap; flex: none; border: 0; }
button.status { min-height: 36px; background: var(--accent); color: var(--on-accent); }
.msg { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; line-height: 1.35; }
.msg.warnbox { align-items: flex-start; border: 1px solid currentColor; }
.msg.warnbox span { color: var(--text); font-weight: 600; }

/* Reja hodisasi */
.ev { display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid var(--line); padding: 6px 0; }
.ev .t { font-size: 14px; font-weight: 700; }
.ev .s { font-size: 12px; color: var(--muted); }
.ev .num { font-size: 14px; }
.act { min-width: 76px; min-height: 36px; border-radius: 18px; border: 0; padding: 0 10px; font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; gap: 4px; flex: none; color: var(--on-strong); }
.act.in { background: var(--mint); } .act.out { background: var(--amber); } .act.lock { background: var(--accent); color: var(--on-accent); }
.act.done { color: var(--mint); background: transparent; }

/* Progress */
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar.lg { height: 10px; border-radius: 5px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--accent)); }

/* Segment, chip */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface); }
.seg.inset { background: var(--field); border-radius: 12px; }
.seg button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--soft); font-size: 14px; font-weight: 800; padding: 0 4px; }
.seg.inset button { font-size: 13px; border-radius: 9px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--soft);
  font-size: 13px; font-weight: 800; white-space: nowrap; flex: none; }
.chip.sm { font-size: 12px; background: transparent; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Maydonlar */
.field { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); color: var(--text); font-size: 14px; width: 100%; min-width: 0; }
.field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field.r { text-align: right; }
.fl { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
.search { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 14px; background: var(--surface); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 13px; font-weight: 600; }
.check input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
textarea.field { padding: 12px; min-height: 150px; resize: vertical; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--soft); }

/* Asosiy: balans kartasi */
.hero { background: var(--hero); color: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero .lbl { color: var(--hero-muted); }
.hero-chip { font-size: 12px; font-weight: 700; color: var(--hero-muted); padding: 4px 10px; border-radius: 12px; background: rgba(255, 255, 255, .08); white-space: nowrap; }
.hero-total { font-size: 38px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.hero-total small { font-size: 18px; font-weight: 700; color: var(--hero-muted); }
.acc { background: rgba(255, 255, 255, .08); border: 0; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left; color: #FFFFFF; }
.acc > span { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--hero-muted); }
.acc b { font-size: clamp(13px, 3.9vw, 15px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero hr { border: 0; height: 1px; background: rgba(255, 255, 255, .12); margin: 0; }
.dev-neg { color: #FFB4A8; font-weight: 800; white-space: nowrap; } .dev-pos { color: #8FF0C4; font-weight: 800; white-space: nowrap; }

/* Qo'shish */
.amount { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; }
.amount b { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
.amount b.long { font-size: 34px; }
.amount small { font-size: 20px; color: var(--muted); font-weight: 800; }
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.cat { position: relative; min-height: 76px; padding: 8px 2px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text); }
.cat[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
.cat.bad[aria-pressed="true"] { border-color: var(--coral); }
.cat .tile { width: 34px; height: 34px; border-radius: 11px; }
.cat .nm { font-size: 10.5px; font-weight: 700; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
.cat .lock { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 8px; background: var(--coral); color: var(--bg);
  display: flex; align-items: center; justify-content: center; }
.opt { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; position: relative; min-width: 0; }
.opt[aria-pressed="true"] { border-color: var(--accent); }
.opt:disabled { opacity: .35; }
.opt input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.trrow { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 16px; background: var(--surface); }
.linkchip { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--surface); font-size: 13px; font-weight: 700; }
.linkchip .body { flex-direction: row; gap: 6px; align-items: center; }
.notefield { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; }
.notefield input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; font-weight: 600; }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.keys button { min-height: 52px; border: 0; border-radius: 14px; background: var(--surface2); color: var(--text); font-size: 22px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; }

/* Tarix */
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 4px 0; font-size: 13px; font-weight: 800; }
.dayhead .wd { font-weight: 600; color: var(--muted); }
.group { background: var(--surface); border-radius: 18px; padding: 0 14px; border: 1px solid transparent; }
.group.bad { border-color: var(--coral); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* Reja kalendari */
.mnav { display: flex; align-items: center; gap: 4px; }
.mnav > span { font-size: 15px; font-weight: 800; min-width: 112px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wdh { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.cal .d { height: 48px; padding: 0; border-radius: 12px; border: 2px solid transparent; background: transparent; color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; }
.cal .d b { font-size: 14px; font-weight: 800; line-height: 1; }
.cal .d.off { color: var(--muted); }
.cal .d.today { border-color: var(--soft); }
.cal .d.bad { color: var(--coral); }
.cal .d[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
.cal .d:disabled { opacity: .3; }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 3px; background: var(--c); }
.dots i.done { opacity: .35; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 6px 0; font-size: 11px; font-weight: 700; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 4px; background: var(--c); }

/* Hisobot */
.donut { position: relative; width: 150px; height: 150px; flex: none; }
.donut .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.lgd { display: flex; align-items: flex-start; gap: 8px; }
.lgd > i { width: 10px; height: 10px; border-radius: 5px; margin-top: 4px; flex: none; background: var(--c); }
.bars { position: relative; height: 100px; display: flex; align-items: flex-end; gap: 3px; }
.bars > i { flex: 1; max-width: 24px; border-radius: 5px 5px 2px 2px; background: var(--c); min-height: 3px; }
.bars .limit { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--amber); }
.barlbl { display: flex; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted); }
.barlbl > span { flex: 1; max-width: 24px; text-align: center; overflow: visible; white-space: nowrap; }
.chart { width: 100%; height: auto; display: block; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* HUMO */
.step { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--soft); }
.step b { width: 24px; height: 24px; border-radius: 12px; color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.hrow { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hrow.off { opacity: .6; }
.hrow .top { min-height: 0; align-items: flex-start; gap: 12px; justify-content: flex-start; }
.hrow .cb { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: none; }
.hrow .cb input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.hnote { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.hnote.box { padding: 8px 10px; border-radius: 10px; background: var(--surface2); color: var(--soft); }
.catsel { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
.catsel select { min-height: 36px; border-radius: 18px; border: 1px solid var(--line); background: var(--field); color: var(--text); padding: 0 10px; font-size: 12px; font-weight: 800; }

/* Balansni yashirish */
.eye { width: 40px; height: 40px; margin: -10px 0; border-radius: 20px; border: 0; padding: 0; background: rgba(255, 255, 255, .08);
  color: var(--hero-muted); display: flex; align-items: center; justify-content: center; }
button.hero-total { background: none; border: 0; padding: 0; color: #FFFFFF; text-align: left; font-size: 38px; font-weight: 800; letter-spacing: .04em; }

/* PIN-kod */
#lock { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; align-items: center; justify-content: center;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; }
.lockbox { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.lockbox .keys { width: 100%; }
.pindots { display: flex; gap: 14px; margin: 4px 0; }
.pindots i { width: 14px; height: 14px; border-radius: 7px; border: 2px solid var(--muted); }
.pindots i.on { background: var(--accent); border-color: var(--accent); }
.pindots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

const DAY_MS = 86400000;

const validISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && toISO(parseISO(s)) === s;
// ?today=YYYY-MM-DD — tekshirish uchun "bugun"ni almashtiradi

function today() {
  if (TODAY_OVERRIDE) return TODAY_OVERRIDE;
  const n = new Date();
  return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
}
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
const inPeriod = iso => iso >= PLAN.start && iso <= PLAN.end;
const clampDate = iso => (iso < PLAN.start ? PLAN.start : iso > PLAN.end ? PLAN.end : iso);
function relDay(iso, t = today()) {
  const n = daysBetween(t, iso);
  return n === 0 ? 'bugun' : n === 1 ? 'ertaga' : n === -1 ? 'kecha' : n > 0 ? `${n} kun qoldi` : `${-n} kun oldin`;
}

const fmt = n => (n < 0 ? '−' : '') + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const signed = n => (n > 0 ? '+' : '') + fmt(n);
const digits = s => Math.min(999999999, Number(String(s).replace(/\D/g, '')) || 0);
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const $ = id => document.getElementById(id);
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const sum = (list, f = x => x) => list.reduce((s, x) => s + f(x), 0);

const DAYS = [];
for (let t = parseISO(PLAN.start), end = parseISO(PLAN.end); t <= end; t += DAY_MS) {
  const date = new Date(t), iso = toISO(t);
  DAYS.push({ iso, month: iso.slice(0, 7), day: date.getUTCDate(), dow: date.getUTCDay(), holiday: PLAN.holidays[iso] || '' });
}
const DAY_BY_ISO = new Map(DAYS.map(d => [d.iso, d]));

// db.tx: { id, d, tm, k: in|out|tr, a, acc, to, c, n, p (reja kaliti "ISO:id"), h (HUMO izi), debt, b (HUMO 💰 karta qoldig'i, tiyin) }

// db.wish: { id, ts (ms), a, c, n, acc, st: w (kutilmoqda) | b (sotib olindi) | s (voz kechildi), rd: hal qilingan sana }
let db = null;

const defaultWorkday = day => day.dow >= 1 && day.dow <= 5 && !day.holiday;
function isWorkday(day) {
  const w = db.work[day.iso];
  return w === undefined ? defaultWorkday(day) : w === 1;
}
function eventsOn(day) {
  const list = [...(PLAN.monthly[day.day] || []), ...(PLAN.once[day.iso] || [])];
  if (isWorkday(day)) list.push(PLAN.transport);
  return list.map(e => ({ ...e, iso: day.iso, key: `${day.iso}:${e.id}` }));
}
const delta = e => (e.kind === 'in' ? e.amount : e.kind === 'out' ? -e.amount : 0);
const txDelta = t => (t.k === 'in' ? t.a : t.k === 'out' ? -t.a : 0);
const idNum = id => parseInt(id.slice(1), 36) || 0;
const txCmp = (a, b) => b.d.localeCompare(a.d) || (b.tm || '').localeCompare(a.tm || '') || idNum(b.id) - idNum(a.id);
const repayKind = debt => (debt.dir === 'owe' ? 'out' : 'in');
const debtById = id => db.debts.find(d => d.id === id);

// Barcha hosila qiymatlar — har o'zgarishda bir marta hisoblanadi
function calc() {
  const t = today();
  if (cache && cache.ver === ver && cache.t === t) return cache;
  const events = new Map(), byIso = {}, planByIso = {};
  let pb = PLAN.startBalance;
  for (const day of DAYS) {
    const list = eventsOn(day);
    byIso[day.iso] = list;
    for (const e of list) { events.set(e.key, e); pb += delta(e); }
    planByIso[day.iso] = pb;
  }
  const bal = { ...db.open };
  const byPlan = new Map(), dayStat = {}, debtPaid = {};
  const debtMap = new Map(db.debts.map(d => [d.id, d]));
  for (const tx of db.tx) {
    if (tx.k === 'in') bal[tx.acc] += tx.a;
    else if (tx.k === 'out') bal[tx.acc] -= tx.a;
    else { bal[tx.acc] -= tx.a; bal[tx.to] += tx.a; }
    const e = tx.p ? events.get(tx.p) : null;
    if (e && !byPlan.has(tx.p)) byPlan.set(tx.p, tx);
    const planned = e && byPlan.get(tx.p) === tx;
    const debt = tx.debt ? debtMap.get(tx.debt) : null;
    if (debt && tx.k === repayKind(debt)) debtPaid[debt.id] = (debtPaid[debt.id] || 0) + tx.a;
    if (tx.k === 'out') {
      const s = dayStat[tx.d] || (dayStat[tx.d] = { disc: 0, bad: 0 });
      if (CATS[tx.c]?.bad) s.bad += tx.a;
      // Kunlik limitga kiradi: yo'lkira va rejadan tashqari xarajatlar
      if (!debt && tx.c !== 'tuz' && !(planned && e.id !== 'yol')) s.disc += tx.a;
    }
  }
  let expected = PLAN.startBalance;
  for (const key of byPlan.keys()) expected += delta(events.get(key));
  const total = bal.card + bal.cash + bal.save;
  // Prognoz: o'tib ketgan, yozilmagan yo'lkira hisobga olinmaydi — pulsiz borilgan kunlar ham bo'ladi
  let pastYol = 0;
  for (const e of events.values()) if (e.id === 'yol' && e.iso < t && !byPlan.has(e.key)) pastYol += e.amount;
  const sorted = [...db.tx].sort(txCmp);
  // Har amaldan keyingi hisob qoldig'i (vaqt tartibida, eng eskisidan) — HUMO xabaridagi 💰 bilan solishtiriladi
  const after = new Map(), dayEnd = new Map();
  const run = { ...db.open };
  for (let i = sorted.length - 1; i >= 0; i--) {
    const tx = sorted[i];
    if (tx.k === 'in') run[tx.acc] += tx.a;
    else if (tx.k === 'out') run[tx.acc] -= tx.a;
    else { run[tx.acc] -= tx.a; run[tx.to] += tx.a; }
    after.set(tx.id, run[tx.acc]);
    dayEnd.set(tx.d, { ...run }); // kun oxiridagi qoldiqlar (sanalar o'sish tartibida qo'shiladi)
  }
  cache = {
    ver, t, events, byIso, planByIso, final: pb, bal, total, byPlan, dayStat, debtPaid, debtMap,
    expected, dev: total - expected, prog: pb + total - expected + pastYol, sorted, after, dayEnd, endDays: [...dayEnd.keys()],
  };
  return cache;
}
const isPending = (C, e) => !C.byPlan.has(e.key);
// iso kuni oxiridagi hisob qoldiqlari
function balOn(C, iso) {
  for (let i = C.endDays.length - 1; i >= 0; i--) if (C.endDays[i] <= iso) return C.dayEnd.get(C.endDays[i]);
  return db.open;
}
const totalOf = b => b.card + b.cash + b.save;
// Rejadan farq nimadan yig'ilgan: farq = jami − kutilgan; har amal o'z ulushini qo'shadi
function devParts(C) {
  const p = { out: 0, in: 0, tuz: 0, plan: 0, open: totalOf(db.open) - PLAN.startBalance, byCat: {} };
  for (const x of db.tx) {
    if (x.k === 'tr') continue;
    const e = x.p && C.byPlan.get(x.p) === x ? C.events.get(x.p) : null;
    if (e) p.plan += txDelta(x) - delta(e);
    else if (x.c === 'tuz') p.tuz += txDelta(x);
    else if (x.k === 'out') { p.out -= x.a; p.byCat[x.c] = (p.byCat[x.c] || 0) + x.a; }
    else p.in += x.a;
  }
  return p;
}
function debtState(C, d) {
  const paid = C.debtPaid[d.id] || 0;
  return { paid, left: Math.max(0, d.a - paid), closed: paid >= d.a };
}

// ===== Saqlash: CloudStorage (6.9+) yoki localStorage; hujjatlar 3500 belgilik bo'laklarga bo'linadi =====
// Kalitlar: meta_N, debts_N, log_N, t_YYYY-MM_N. Birinchi bo'lak "bo'laklar_soni|" bilan boshlanadi.
const CHUNK = 3500; // CloudStorage qiymati 4096 belgigacha

function createStore() {
  if (tgAtLeast('6.9') && WA.CloudStorage) {
    const cs = WA.CloudStorage;
    const call = (fn, ...args) => new Promise((res, rej) => fn.call(cs, ...args, (err, val) => (err ? rej(new Error(String(err))) : res(val))));
    return {
      label: "Ma'lumotlar Telegram bulutida saqlanadi.",
      keys: () => call(cs.getKeys),
      getMany: keys => call(cs.getItems, keys),
      set: (k, v) => call(cs.setItem, k, v),
      remove: keys => call(cs.removeItems, keys),

  let ls = null;

    getMany: async keys => Object.fromEntries(keys.map(k => [k, (ls ? ls.getItem(P + k) : mem.get(k)) || ''])),
    set: async (k, v) => { if (ls) ls.setItem(P + k, v); else mem.set(k, v); },

}

async function getBatched(keys) {

const packTx = t => {

function serialize(doc) {
  if (doc === 'meta') return JSON.stringify({ v: 2, open: db.open, work: db.work, lim: db.lim, seq: db.seq, mig: db.mig, pin: db.pin, bio: db.bio, home: db.home, imp: db.imp });
  if (doc === 'debts') return JSON.stringify(db.debts.map(d => [d.id, d.dir, d.who, d.a, d.due, d.d]));
  if (doc === 'log') return JSON.stringify(db.log.map(e => [e.t, e.k, e.m, e.r]));
  if (doc === 'wish') return JSON.stringify(db.wish.map(w => [w.id, w.ts, w.a, w.c, w.n, w.acc, w.st, w.rd]));

async function writeDoc(doc, text) {
  const parts = [];
  for (let i = 0; i === 0 || i < text.length; i += CHUNK) parts.push(text.slice(i, i + CHUNK));
  parts[0] = `${parts.length}|${parts[0]}`;

  for (let i = parts.length - 1; i >= 0; i--) await store.set(`${doc}_${i}`, parts[i]);

const ID_RE = /^t[0-9a-z]{1,10}$/;

function cleanTx(o) {
  if (!isObj(o)) throw new Error('amal obyekt emas');
  const t = {
    id: o.id, d: o.d, tm: o.tm || '', k: o.k, a: o.a, acc: o.acc, to: o.to || '', c: o.c || '',

  if (typeof t.id !== 'string' || !ID_RE.test(t.id)) throw bad('id');
  if (!validISO(t.d) || !inPeriod(t.d)) throw bad('sana');
  if (t.tm && !/^([01]\d|2[0-3]):[0-5]\d$/.test(t.tm)) throw bad('vaqt');
  if (!['in', 'out', 'tr'].includes(t.k)) throw bad('tur');
  if (!isAmt(t.a)) throw bad('summa');
  if (!ACC[t.acc]) throw bad('hisob');
  if (t.k === 'tr') {
    if (!ACC[t.to] || t.to === t.acc) throw bad("o'tkazma");
    t.c = ''; t.debt = '';
  } else {
    if (!catOk(t.c, t.k)) throw bad('kategoriya');
    t.to = '';
  }
  if (!isStr(t.n, 120) || !isStr(t.h, 64)) throw bad('matn');
  if (t.p && !(typeof t.p === 'string' && /^\d{4}-\d{2}-\d{2}:[a-z]{1,12}$/.test(t.p))) throw bad('reja');

  const ids = v => (Array.isArray(v) ? v.filter(x => typeof x === 'string' && /^[a-z][0-9a-z]{1,12}$/.test(x)).slice(0, 500) : []);

const LOG_KINDS = ['add', 'edit', 'del', 'debt', 'plan', 'set', 'import', 'wish'];
function cleanWish(o) {

function cleanLog(list) {

// v1 (m_YYYY-MM shardlari) → v2 amallari
function migrateV1(shards) {
  for (const [m, s] of Object.entries(shards)) {
    for (const [dd, v] of Object.entries(isObj(s.w) ? s.w : {})) {
      const day = DAY_BY_ISO.get(`${m}-${dd}`);
      if (day && (v === 0 || v === 1) && (v === 1) !== defaultWorkday(day)) db.work[day.iso] = v;
    }
  }
  for (const [m, s] of Object.entries(shards)) {
    for (const key of Object.keys(isObj(s.c) ? s.c : {})) {
      const [dd, id] = key.split(':');
      const day = DAY_BY_ISO.get(`${m}-${dd}`);
      const e = day && eventsOn(day).find(x => x.id === id);
      if (e) addTx(txFromEvent(e, e.iso), { quiet: true });
    }
    for (const [dd, v] of Object.entries(isObj(s.x) ? s.x : {})) {
      const iso = `${m}-${dd}`;
      if (DAY_BY_ISO.has(iso) && isAmt(v)) {
        addTx({ d: iso, tm: '', k: 'out', a: v, acc: 'cash', to: '', c: 'boshqa', n: 'Rejadan tashqari (v1)', p: '', h: '', debt: '' }, { quiet: true });

  }

async function load() {
  const keys = await store.keys();
  const groups = {}, v1Keys = [];
  for (const k of keys) {
    const m = DOC_RE.exec(k);
    if (m) (groups[m[1]] || (groups[m[1]] = [])).push(Number(m[2]));
    else if (V1_RE.test(k)) v1Keys.push(k);
  }
  const wanted = Object.entries(groups).flatMap(([doc, idx]) => idx.map(i => `${doc}_${i}`));
  const raw = await getBatched([...wanted, ...v1Keys]);
  const broken = [];
  const docs = {};
  for (const [doc, idx] of Object.entries(groups)) {
    chunkCount[doc] = Math.max(...idx) + 1;
    try {
      const first = raw[`${doc}_0`] || '';
      const bar = first.indexOf('|');
      const n = Number(first.slice(0, bar));
      if (bar < 1 || !Number.isInteger(n) || n < 1) throw new Error();
      let text = first.slice(bar + 1);
      for (let i = 1; i < n; i++) {
        if (!raw[`${doc}_${i}`] && raw[`${doc}_${i}`] !== '') throw new Error();
        text += raw[`${doc}_${i}`];
      }
      docs[doc] = JSON.parse(text);
    } catch { broken.push(doc); }
  }
  let meta = null;
  if (docs.meta) {
    try { meta = cleanMeta(docs.meta); } catch { broken.push('meta'); }
  }
  if (meta) {
    db = { ...meta, debts: [], tx: [], log: [], wish: [] };
  } else {
    db = blankDb();
    db.mig = v1Keys.length ? 0 : 1;
    if (docs.debts === undefined) touch('meta', 'debts'); else touch('meta');
  }
  let skipped = 0;
  if (Array.isArray(docs.debts)) {
    db.debts = [];
    for (const a of docs.debts) {
      try { db.debts.push(cleanDebt({ id: a[0], dir: a[1], who: a[2], a: a[3], due: a[4], d: a[5] })); } catch { skipped++; }
    }
  }
  if (Array.isArray(docs.wish)) {
    for (const a of docs.wish) {
      try { db.wish.push(cleanWish(a)); } catch { skipped++; }
    }
  }
  for (const [doc, list] of Object.entries(docs)) {
    if (!doc.startsWith('t_') || !Array.isArray(list)) continue;
    for (const a of list) {
      try { db.tx.push(cleanTx(Array.isArray(a) ? unpackTx(a, doc.slice(2)) : a)); } catch { skipped++; }
    }
  }
  Object.assign(db, finishDb(db, db.debts, db.tx, docs.log || []));
  if (!db.mig && v1Keys.length) {
    const shards = {};
    for (const k of v1Keys) {
      try { const s = JSON.parse(raw[k]); if (isObj(s)) shards[V1_RE.exec(k)[1]] = s; } catch { /* buzilgan v1 shard */ }
    }
    migrateV1(shards);
    db.mig = 1;
    logEv('import', `1-versiyadagi belgilar ko'chirildi: ${db.tx.length} ta amal`);
    touch('meta', 'debts', ...new Set(db.tx.map(t => tdoc(t.d))));
    toast("Eski versiyadagi belgilar ko'chirildi");
  }
  if (broken.length || skipped) toast(`Ba'zi saqlangan ma'lumotlar buzilgan, e'tiborsiz qoldirildi (${broken.length + skipped})`);
  ver++;
}

// ===== O'zgartirishlar =====

// ===== Jurnal: har bir o'zgarish vaqti bilan yoziladi =====
const LOG_MAX = 500;
function logEv(k, m, r = '') {

  if (db.log.length > LOG_MAX) db.log.splice(0, db.log.length - LOG_MAX);

}
const sgn = t => (t.k === 'in' ? `+${fmt(t.a)}` : t.k === 'out' ? `−${fmt(t.a)}` : fmt(t.a));
function txLabel(t) {
  return `${txTitle(t, calc())} ${sgn(t)}${t.k === 'tr' ? '' : ` · ${ACC[t.acc].name}`} · ${dm(t.d)}${t.n ? ` · ${t.n}` : ''}`;
}
// Qarz amali yozilganda qarzning yangi holati qo'shiladi
function debtNote(t) {
  const d = t.debt && debtById(t.debt);
  if (!d || t.k !== repayKind(d)) return '';
  const s = debtState(calc(), d);
  return s.closed ? ' · qarz yopildi' : ` · ${fmt(s.left)} qoldi`;
}
function addTx(t, how = {}) {
  const tx = { id: nextId('t'), tm: '', to: '', c: '', n: '', p: '', h: '', debt: '', b: '', ...t };
  db.tx.push(tx);
  if (how.quiet) { ver++; return tx; }
  touch('meta', tdoc(tx.d));
  const d = tx.debt && debtById(tx.debt);
  if (!how.nolog) logEv('add', `${how.prefix || (d ? debtFlow(tx, d) : "Qo'shildi")}: ${txLabel(tx)}${debtNote(tx)}`, tx.debt || tx.id);
  return tx;
}
function updateTx(tx, patch) {

  Object.assign(tx, patch);
  touch(tdoc(before.d), tdoc(tx.d));
  const ch = [];
  if (before.k !== tx.k) ch.push('tur');
  if (before.a !== tx.a) ch.push(`summa ${fmt(before.a)} → ${fmt(tx.a)}`);
  if (before.d !== tx.d) ch.push(`sana ${dm(before.d)} → ${dm(tx.d)}`);
  if (before.acc !== tx.acc || before.to !== tx.to) ch.push(`hisob ${ACC[before.acc].name} → ${ACC[tx.acc].name}`);
  if (before.c !== tx.c && tx.c) ch.push(`kategoriya ${CATS[before.c]?.name || '—'} → ${CATS[tx.c].name}`);
  if (before.n !== tx.n) ch.push('izoh');
  if (before.p !== tx.p) ch.push(tx.p ? "rejaga bog'landi" : 'rejadan ajratildi');
  if (before.debt !== tx.debt) ch.push(tx.debt ? "qarzga bog'landi" : 'qarzdan ajratildi');
  if (ch.length) logEv('edit', `O'zgartirildi: ${txTitle(tx, calc())} ${sgn(tx)} — ${ch.join(', ')}${debtNote(tx)}`, tx.debt || before.debt || tx.id);
}

}
// O'chirish — tasdiqsiz, lekin 5 soniya «Qaytarish» bilan
function deleteTx(tx) {

    if (db.tx.some(x => x.id === copy.id)) return;
    db.tx.push(copy);
    touch('meta', tdoc(copy.d));
    logEv('add', `Qaytarildi: ${txLabel(copy)}${debtNote(copy)}`, copy.debt || copy.id);
    toast('Qaytarildi');
    rerender();
  });
}
// Amalni bugungi sanaga takrorlash (HUMO izi va reja bog'lanishisiz)
function copyTxToday(tx) {

  const t = { d: clampDate(today()), tm: nowHM(), k: tx.k, a: tx.a, acc: tx.acc, to: tx.to, c: tx.c, n: tx.n, p: '', h: '',
    debt: tx.debt && debtById(tx.debt) ? tx.debt : '' };
  t.p = autoLink(t);
  const nt = addTx(t, { prefix: 'Nusxalandi' });
  haptic.ok();
  toast(`Bugunga nusxalandi: ${sgn(nt)}`, () => {
    if (!db.tx.includes(nt)) return;
    removeTx(nt);
    toast('Nusxa bekor qilindi');
    rerender();
  });
}
function txFromEvent(e, d) {
  const base = { d, tm: '', n: '', p: e.key, h: '' };
  if (e.kind === 'lock') return { ...base, k: 'tr', a: e.amount, acc: 'card', to: 'save', c: '', debt: '' };
  return { ...base, k: e.kind, a: e.amount, acc: e.acc || 'card', to: '', c: e.cat, debt: e.debt && debtById(e.debt) ? e.debt : '' };
}
// Yangi amal shu kungi bajarilmagan reja bandiga mos kelsa — bog'lanadi
function autoLink(t) {
  const C = calc();
  if (t.debt) {
    for (const e of C.events.values()) if (e.debt === t.debt && isPending(C, e)) return e.key;
  }
  for (const e of C.byIso[t.d] || []) {
    if (!isPending(C, e)) continue;
    if (t.k === 'tr' ? e.kind === 'lock' && t.to === 'save' : e.kind === t.k && e.cat === t.c && !e.debt) return e.key;
  }
  return '';
}
function setWorkday(iso, work) {
  const day = DAY_BY_ISO.get(iso);
  if (work === defaultWorkday(day)) delete db.work[iso]; else db.work[iso] = work ? 1 : 0;
  // Dam olishga o'tgan kunning yo'lkirasi rejadan chiqadi — yozilgan amal oddiy xarajat bo'lib qoladi
  if (!work) for (const t of db.tx) if (t.p === `${iso}:yol`) { t.p = ''; touch(tdoc(t.d)); }
  touch('meta');
  logEv('plan', `${dm(iso)} (${WEEKDAYS[day.dow]}) ${work ? 'ish kuni' : 'dam olish kuni'} qilindi`);
}

// Pastki menyu: 4 bo'lim va markazda «+». Qolgan sahifalar (qo'shish, HUMO, sozlamalar) ustiga ochiladi — «Orqaga» qaytaradi.
const TABS = [['main', 'Asosiy', 'home'], ['tarix', 'Tarix', 'list'], ['add'], ['reja', 'Reja', 'calendar'], ['tahlil', 'Tahlil', 'chart']];
const TAB_IDS = TABS.map(x => x[0]).filter(id => id !== 'add');
let route = 'main';
const stack = [];
let enterAnim = false; // bo'lim almashganda kartalar silliq paydo bo'ladi
function go(name) {
  stack.length = 0;
  route = name;
  enterAnim = true;
  render(0);
}
function push(name) {
  stack.push({ route, y: window.scrollY });
  route = name;
  render(0);
}
function back() {
  if (!$('story').hidden) { closeStory(); return; }
  if (!$('modal').hidden) { closeModal(); return; }
  const prev = stack.pop();
  if (!prev) return;
  route = prev.route;
  render(prev.y);
}
function render(scrollY) {
  document.body.classList.toggle('sub', !TAB_IDS.includes(route));
  document.body.classList.toggle('padded', route === 'add');
  const view = $('view');
  view.classList.remove('enter');
  view.innerHTML = VIEWS[route]();
  if (enterAnim) { void view.offsetWidth; view.classList.add('enter'); enterAnim = false; }
  if (route === 'add') document.body.style.setProperty('--padh', `${$('f-pad').offsetHeight}px`);
  if (route === 'main') { heroCount(); const C = calc(); checkBadges(C, C.t); }
  $('nav').firstElementChild.innerHTML = TABS.map(([id, label, icon]) => (id === 'add'
    ? `<button class="nav-add" data-act="add" aria-label="Yangi amal qo'shish">${ic('plus', 28, 2.5)}</button>`
    : `<button data-act="tab" data-to="${id}"${route === id ? ' aria-current="page"' : ''}>${ic(icon, 22)}${label}</button>`)).join('');
  if (scrollY !== undefined) window.scrollTo(0, scrollY);
  if (tgAtLeast('6.1')) { if (stack.length) WA.BackButton.show(); else WA.BackButton.hide(); }
}
const rerender = () => render();

function txTitle(t, C) {
  const e = t.p && C.byPlan.get(t.p) === t ? C.events.get(t.p) : null;
  if (t.k === 'tr') return e ? e.title : `${ACC[t.acc].name} → ${ACC[t.to].name}`;
  const debt = t.debt && C.debtMap.get(t.debt);
  if (debt) return debt.who;
  if (e && e.id !== 'yol') return e.title;
  return CATS[t.c]?.name || 'Amal';
}
function debtFlow(t, debt) {
  if (debt.dir === 'owe') return t.k === 'out' ? "Qarz to'lovi" : 'Qarz olindi';
  return t.k === 'in' ? 'Qarz qaytdi' : 'Qarz berildi';
}
function txSub(t, C, withDate) {
  const debt = t.debt && C.debtMap.get(t.debt);
  const parts = [t.k === 'tr' ? "O'tkazma" : ACC[t.acc].name];
  if (debt) parts.push(debtFlow(t, debt));
  if (withDate) parts.push(t.d === C.t ? 'bugun' : longDate(t.d));
  if (t.tm) parts.push(t.tm);
  if (t.n) parts.push(t.n);
  return parts.join(' · ');
}
function txLook(t) {
  if (t.k === 'tr') return t.to === 'save' ? { icon: 'lock', color: 'blue' } : { icon: 'transfer', color: 'gray' };
  const c = CATS[t.c] || CATS.boshqa;
  return { icon: c.icon, color: c.color };
}
function amountHTML(t) {

  if (t.k === 'out') return `<span class="num${CATS[t.c]?.bad ? ' c-bad' : ''}">−${fmt(t.a)}</span>`;
  return `<span class="num c-soft">${fmt(t.a)}</span>`;
}
function txRow(t, C, withDate, withBal) {

// Hero: so'nggi 7 kun oxiridagi jami balans chizig'i
function sparkHTML(C, t) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  const vals = days.map(d => totalOf(balOn(C, d)));
  const min = Math.min(...vals), max = Math.max(...vals);
  const y = v => (max === min ? 16 : 28 - ((v - min) / (max - min)) * 24).toFixed(1);
  const pts = vals.map((v, i) => `${((i / 6) * 100).toFixed(1)},${y(v)}`).join(' ');
  const ch = vals[6] - vals[0];
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div class="spark-row"><span>${dm(days[0])} – ${dm(days[6])}</span><span>7 kunda: <b>${ch ? signed(ch) : '±0'}</b></span></div>`;
}

// Diqqat: HUMO bilan farq, qarz muddati, limitlar, bugungi qoida buzilishi, xohishlar, seriya
function alertsCard(C, t) {
  const items = [];
  const rc = reconcile(C);
  if (rc && !rc.ok) {
    items.push({ lvl: 2, color: 'coral', icon: 'clipboard', act: 'data-act="recon"',
      text: `Karta HUMO bilan mos emas: trekerda ${fmt(Math.abs(rc.bad.diff))} ${rc.bad.diff > 0 ? 'kam' : "ko'p"}`,
      sub: `${dm(rc.bad.tx.d)}, ${rc.bad.tx.tm} holatiga · bosing — tafsilot va tuzatish` });
  }
  for (const d of db.debts) {
    const s = debtState(C, d);
    if (s.closed || !d.due || d.due > addDays(t, 3)) continue;
    const late = d.due < t;
    items.push({
      lvl: late ? 2 : 1, color: late ? 'coral' : 'amber', icon: d.dir === 'owe' ? 'users' : 'user', act: `data-act="d-open" data-id="${d.id}"`,
      text: `${esc(d.who)} — ${fmt(s.left)} ${d.dir === 'owe' ? "to'lashingiz kerak" : 'qaytarishi kerak'}`,
      sub: late ? `Muddati ${-daysBetween(t, d.due)} kun oldin o'tdi (${dm(d.due)})` : `Muddat ${relDay(d.due, t)} (${dm(d.due)})`,
    });
  }
  const m = t.slice(0, 7);
  for (const c of LIMIT_CATS) {
    const lim = db.lim[c];
    if (!lim) continue;
    const v = sum(db.tx.filter(x => x.k === 'out' && x.c === c && x.d.startsWith(m)), x => x.a);
    if (v < lim * 0.8) continue;
    const over = v > lim;
    items.push({
      lvl: over ? 2 : 1, color: over ? 'coral' : 'amber', icon: CATS[c].icon, act: 'data-act="tab" data-to="tahlil"',
      text: over ? `${CATS[c].name} limiti oshdi: ${fmt(v)} / ${fmt(lim)}` : `${CATS[c].name} limitining ${Math.round((v / lim) * 100)}% ishlatildi`,
      sub: over ? `${fmt(v - lim)} so'm ortiqcha` : `${fmt(lim - v)} so'm qoldi`,
    });
  }
  const bad = C.dayStat[t]?.bad || 0;
  if (bad) {
    items.push({ lvl: 2, color: 'coral', icon: 'alert', act: 'data-act="today-tx"',
      text: `Bugun qoida buzildi: −${fmt(bad)}`, sub: "Ko'cha ovqati, kofe yoki taksi — prognoz shuncha kamaydi" });
  }
  for (const w of db.wish.filter(wishReady)) {
    items.push({ lvl: 1, color: 'purple', icon: 'hourglass', act: `data-act="wish-ask" data-id="${w.id}"`,
      text: `${esc(w.n || CATS[w.c].name)} — ${fmt(w.a)}: hali ham kerakmi?`, sub: '24 soat o\'tdi. Bosing — sotib oldim yoki voz kechdim' });
  }
  const streak = streakOf(C, t);
  if (streak >= 7 && streak % 7 === 0) {
    items.push({ lvl: 0, color: 'mint', icon: 'flame', act: '', text: `${streak} kun ketma-ket qoidaga amal qildingiz`, sub: "Zo'r natija — shunday davom eting" });
  }
  if (!items.length) return '';
  items.sort((a, b) => b.lvl - a.lvl);
  return `<section class="card list">
    <div class="spread"><span class="h2 c-warn" style="display:flex;align-items:center;gap:6px">${ic('alert', 18)}Diqqat</span><span class="small muted">${items.length} ta</span></div>
    ${items.map(x => {
      const tag = x.act ? 'button' : 'div';
      return `<${tag} class="row" ${x.act}><span class="tile soft" style="--c:var(--${x.color})">${ic(x.icon)}</span>`
        + `<span class="body"><span class="t" style="white-space:normal">${x.text}</span><span class="s">${x.sub}</span></span>`
        + `${x.act ? `<span class="c-muted" style="display:flex">${ic('right', 16)}</span>` : ''}</${tag}>`;
    }).join('')}</section>`;
}
// Yaqin to'lovlar: o'tib ketgan belgilanmagan bandlar, eng yaqin to'lov kuni (kartada yetadimi) va undan keyingisi
function payCard(C, t) {
  const late = [...C.events.values()].filter(e => e.iso < t && e.id !== 'yol' && isPending(C, e));
  const groups = [];
  for (const d of DAYS) {
    if (d.iso < t || groups.length === 2) continue;
    const list = C.byIso[d.iso].filter(e => e.id !== 'yol' && isPending(C, e));
    if (list.length) groups.push({ day: d, list });
  }
  if (!late.length && !groups.length) return '';
  const when = iso => { const n = daysBetween(t, iso); return n === 0 ? 'Bugun' : n === 1 ? 'Ertaga' : `${n} kundan keyin`; };
  let body = '';
  if (late.length) body += `<span class="grp-l c-bad">O'tib ketgan — bo'lgan bo'lsa belgilang</span>${late.map(e => eventRow(e, C, true)).join('')}`;
  const g = groups[0];
  if (g) {
    const amt = kind => sum(g.list.filter(e => e.kind === kind), e => e.amount);
    const need = amt('out') + amt('lock') - amt('in'), card = C.bal.card;
    body += `<span class="grp-l c-warn">${when(g.day.iso)} · ${longDate(g.day.iso)}, ${WEEKDAYS[g.day.dow]}</span>${g.list.map(e => eventRow(e, C)).join('')}`;
    if (need > 0 && card >= need) {
      body += `<div class="msg soft c-in" style="margin:4px 0 10px">${ic('check', 16, 2.5)}Kartada ${ui.hide ? '•••••' : fmt(card)} bor — to'lovlarga yetadi</div>`;
    } else if (need > 0) {
      const move = Math.min(need - card, Math.max(0, C.bal.cash));
      body += `<div class="msg soft c-bad" style="margin:4px 0 10px">${ic('alert', 16)}<span style="flex:1">Kartada ${fmt(need - card)} yetmaydi</span>`
        + `${move > 0 ? `<button class="status" data-act="cash2card" data-a="${move}" style="background:var(--coral);color:var(--on-strong)">Naqddan o'tkazish</button>` : ''}</div>`;
    }
  }
  const g2 = groups[1];
  if (g2) {

// ===== Klaviaturadagi kalkulyator: «25 000 + 12 000», «120 000 ÷ 3» =====
const OPS = '+−×÷';
const OP_NAMES = { '+': "Qo'shish", '−': 'Ayirish', '×': "Ko'paytirish", '÷': "Bo'lish" };
const exprText = e => (e.match(/\d+|[+−×÷]/g) || []).map(x => (OPS.includes(x) ? ` ${x} ` : fmt(Number(x)))).join('');
function evalExpr(e) {
  const tk = e.match(/\d+|[+−×÷]/g) || [];
  while (tk.length && OPS.includes(tk[tk.length - 1])) tk.pop();
  if (!tk.length) return 0;
  let total = 0, sign = 1, term = Number(tk[0]);
  for (let i = 1; i < tk.length; i += 2) {
    const op = tk[i], n = Number(tk[i + 1]);
    if (op === '×') term *= n;
    else if (op === '÷') term = n ? term / n : term;
    else { total += sign * term; sign = op === '+' ? 1 : -1; term = n; }
  }
  return Math.max(0, Math.min(999999999, Math.round(total + sign * term)));
}

// ===== Izohdan kategoriya: oldingi amallaringizdan o'rganadi + tayyor kalit so'zlar =====
const CAT_WORDS = {
  oziq: 'non gosht bozor korzinka makro havas sut meva sabzavot guruch yog tuxum kartoshka piyoz shakar oziq ovqat',
  kucha: 'shaurma lavash somsa burger kafe choyxona pizza hotdog fastfood kfc evos tushlik',
  kofe: 'kofe coffee shirinlik tort muzqaymoq pishiriq kapuchino latte',
  taksi: 'taksi taxi yandex mytaxi uklon',
  aloqa: 'sim telefon internet beeline ucell mobiuz uzmobile obuna aloqa',
  yol: 'metro avtobus yolkira marshrutka',
  talim: 'kurs kitob dars ingliz talim',
  sog: 'dori apteka dorixona shifokor klinika stomatolog',
  uy: 'kommunal svet gaz suv ijara sovun idish uyga',
  oylik: 'oylik maosh', avans: 'avans', kirim: 'sovga bonus',
};
const noteWords = s => s.toLowerCase().replace(/[ʻʼ’‘'`]/g, '').split(/[^a-z0-9а-яёўқғҳ]+/).filter(w => w.length >= 3);
let learnCache = null;
function noteCat(text, k) {
  const words = noteWords(text);
  if (!words.length) return '';
  if (!learnCache || learnCache.ver !== ver) {
    const map = {};
    for (const x of db.tx) {
      if (!x.n || !CATS[x.c] || CATS[x.c].hidden) continue;
      for (const w of noteWords(x.n)) (map[w] ||= {})[x.c] = (map[w][x.c] || 0) + 1;
    }
    learnCache = { ver, map };
  }
  const score = {};
  for (const w of words) {
    for (const [c, n] of Object.entries(learnCache.map[w] || {})) score[c] = (score[c] || 0) + 3 * n;
    for (const [c, list] of Object.entries(CAT_WORDS)) if (list.split(' ').some(kw => w.startsWith(kw))) score[c] = (score[c] || 0) + 2;
  }
  let best = '', top = 0;
  for (const [c, v] of Object.entries(score)) if (CATS[c]?.k === k && v > top) { best = c; top = v; }
  return best;
}
function pressKey(k) {
  let e = form.expr ?? form.a;
  if (k === 'back') e = e.slice(0, -1);
  else if (OPS.includes(k)) {
    if (!e) return;
    e = OPS.includes(e[e.length - 1]) ? e.slice(0, -1) + k : e + k;
  } else {
    const cur = e.match(/\d*$/)[0];
    e = e.slice(0, e.length - cur.length) + (cur + k).replace(/^0+/, '').slice(0, 9);
  }
  form.expr = e.slice(0, 60);
  form.a = String(evalExpr(form.expr) || '');
  rerender();
}
function saveForm() {
  const f = form;
  const a = digits(f.a);
  if (!a) return;

    n: f.n.trim().slice(0, 120), p: f.p, h: f.h, debt: f.k === 'tr' ? '' : f.debt,
  };
  if (!f.id && !t.tm && t.d === today()) t.tm = nowHM();
  const existing = f.id && db.tx.find(x => x.id === f.id);
  if (!t.p && !f.unlinked) t.p = autoLink(t);
  if (existing) updateTx(existing, t); else addTx(t);
  if (!existing && t.k === 'in' && (t.c === 'oylik' || t.c === 'avans')) { toast(t.c === 'oylik' ? 'Oylik tushdi! 🎉' : 'Avans tushdi! 🎉'); confetti(); }

}

// ===== Jurnal: har bir o'zgarish vaqti bilan, eng yangisi tepada (Sozlamalar va Tarix'dan) =====
const jr = { q: '' };
function viewJurnal() {
  return `${subHead("O'zgarishlar jurnali")}

    <p class="note">Har bir qo'shish, tahrir, o'chirish va sozlama o'zgarishi vaqti bilan yoziladi (oxirgi ${LOG_MAX} ta). Hozir: ${db.log.length} ta.</p>
    <div id="j-list" style="display:flex;flex-direction:column;gap:12px">${logList()}</div>`;
}
function logList() {
  const q = jr.q.trim().toLowerCase();
  const list = db.log.filter(e => !q || e.m.toLowerCase().includes(q)).reverse();
  if (!list.length) return `<p class="empty">${db.log.length ? "Bu qidiruv bo'yicha yozuv yo'q" : "Jurnal bo'sh. Har bir o'zgarish shu yerda vaqti bilan ko'rinadi."}</p>`;
  const groups = [];
  for (const e of list) {
    const d = e.t.slice(0, 10);
    if (!groups.length || groups[groups.length - 1].d !== d) groups.push({ d, items: [] });
    groups[groups.length - 1].items.push(e);
  }
  const t = today();
  return groups.map(g => `<section style="display:flex;flex-direction:column;gap:6px">
      <div class="dayhead"><span>${g.d === t ? 'Bugun, ' : g.d === addDays(t, -1) ? 'Kecha, ' : ''}${longDate(g.d)} <span class="wd">· ${WEEKDAYS[dowOf(g.d)]}</span></span><span class="c-soft">${g.items.length} ta</span></div>
      <div class="group">${g.items.map(e => `<div class="logrow"><span class="tile soft" style="--c:var(--${LOG_LOOK[e.k][1]})">${ic(LOG_LOOK[e.k][0], 16)}</span>`
        + `<span class="body"><span class="m">${esc(e.m)}</span><span class="small muted">${e.t.slice(11)}</span></span></div>`).join('')}</div></section>`).join('');
}
function histList(C) {
  const q = hist.q.trim().toLowerCase();
  const qd = q.replace(/\D/g, '');
  const keep = t => {
    if (hist.f === 'out' && t.k !== 'out') return false;
    if (hist.f === 'in' && t.k !== 'in') return false;
    if (hist.f === 'tr' && t.k !== 'tr') return false;
    if (hist.f === 'bad' && !(t.k === 'out' && CATS[t.c]?.bad)) return false;
    if (hist.f === 'humo' && !t.h) return false;
    if (hist.day && t.d !== hist.day) return false;
    if (!q) return true;
    const text = `${txTitle(t, C)} ${t.n} ${CATS[t.c]?.name || ''}`.toLowerCase();
    return text.includes(q) || (qd.length >= 3 && qd === q.replace(/\s/g, '') && String(t.a).includes(qd));
  };
  const groups = [];
  for (const t of C.sorted) {
    if (!keep(t)) continue;
    if (!groups.length || groups[groups.length - 1].d !== t.d) groups.push({ d: t.d, items: [] });
    groups[groups.length - 1].items.push(t);
  }
  if (!groups.length) return `<p class="empty">${db.tx.length ? "Bu filtr bo'yicha amal yo'q" : "Hali amal yo'q"}</p>`;
  const swBg = `<span class="sw-bg" aria-hidden="true"><span class="c">${ic('copy', 18)}Nusxalash</span><span class="x">O'chirish${ic('trash', 18)}</span></span>`;
  return groups.map(g => {
    const total = sum(g.items.filter(x => x.c !== 'tuz'), txDelta); // tuzatish haqiqiy kirim/chiqim emas
    const bad = (C.dayStat[g.d]?.bad || 0) > 0;
    const label = g.d === C.t ? `Bugun, ${longDate(g.d)}` : g.d === addDays(C.t, -1) ? `Kecha, ${longDate(g.d)}` : longDate(g.d);
    const end = C.dayEnd.get(g.d);
    const endText = ACC_IDS.filter(a => a !== 'save' || end.save).map(a => `${ACC[a].name} ${ui.hide ? '•••••' : fmt(end[a])}`).join(' · ');
    return `<section style="display:flex;flex-direction:column;gap:6px">
      <div class="dayhead"><span class="${bad ? 'c-bad' : ''}">${label} <span class="wd">· ${WEEKDAYS[dowOf(g.d)]}</span></span>
        <span class="${total > 0 ? 'c-in' : bad ? 'c-bad' : 'c-soft'}">${total ? signed(total) : '0'}</span></div>
      <div class="dayend">Kun oxirida: ${endText}</div>
      <div class="group sw-list${bad ? ' bad' : ''}">${g.items.map(t => `<div class="sw">${swBg}${txRow(t, C, false, true)}</div>`).join('')}</div></section>`;
  }).join('');
}

// ===== Reja =====
const reja = { m: '', sel: '', tab: 'cal' };

}
function viewReja() {
  const C = calc(), t = C.t;

  }
  if (reja.tab === 'wish') {
    return `<header class="top"><h1 class="h1">Reja</h1><button class="pill-btn" data-act="afford">${ic('hourglass', 16)}Qachon olaman?</button></header>
      ${rejaSeg(C)}${wishPage(C, t)}`;
  }
  if (!reja.m) {
    reja.m = clampMonth(t.slice(0, 7));
    reja.sel = clampDate(t);
  }
  const m = reja.m, mi = MONTHS.indexOf(m);
  const days = DAYS.filter(d => d.month === m);
  if (!reja.sel.startsWith(m)) reja.sel = days.some(d => d.iso === t) ? t : days[0].iso;
  let done = 0, total = 0, inSum = 0, outSum = 0, lockSum = 0, yolN = 0;
  for (const d of days) for (const e of C.byIso[d.iso]) {
    if (e.id === 'yol') { yolN++; continue; }
    total++;
    if (!isPending(C, e)) done++;
    if (e.kind === 'in') inSum += e.amount; else if (e.kind === 'out') outSum += e.amount; else lockSum += e.amount;
  }
  const [y, mo] = m.split('-').map(Number);
  const nDays = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const lead = (new Date(Date.UTC(y, mo - 1, 1)).getUTCDay() + 6) % 7;
  const cells = [];
  // Issiqlik xaritasi: kundalik xarajat (majburiy to'lovlarsiz) oyning eng ko'p kuniga nisbatan
  const maxDisc = Math.max(1, ...days.map(d => C.dayStat[d.iso]?.disc || 0));
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let dd = 1; dd <= nDays; dd++) {
    const iso = `${m}-${pad(dd)}`;
    const day = DAY_BY_ISO.get(iso);
    if (!day) { cells.push(`<button class="d off" disabled aria-label="${dd}-${MONTHS_UZ[mo - 1]}, reja davridan tashqari"><b>${dd}</b><span class="dots"></span></button>`); continue; }
    const evs = C.byIso[iso].filter(e => e.id !== 'yol');
    const colors = { in: 'mint', out: 'amber', lock: 'blue' };
    const dots = evs.map(e => `<i class="${isPending(C, e) ? '' : 'done'}" style="--c:var(--${colors[e.kind]})"></i>`).join('');
    const bad = (C.dayStat[iso]?.bad || 0) > 0;
    const disc = C.dayStat[iso]?.disc || 0;
    const heat = disc && !bad ? ` style="--heat:${(disc / maxDisc).toFixed(2)}"` : '';
    const cls = ['d', !isWorkday(day) && 'off', iso === t && 'today', bad && 'bad soft', heat && 'heat'].filter(Boolean).join(' ');
    cells.push(`<button class="${cls}"${heat} data-act="r-sel" data-iso="${iso}" aria-pressed="${reja.sel === iso}" aria-label="${longDate(iso)}${evs.length ? `, ${evs.length} ta reja` : ''}${disc ? `, xarajat ${fmt(disc)}` : ''}"><b>${dd}</b><span class="dots">${dots}</span></button>`);
  }
  return `<header class="top"><h1 class="h1">Reja</h1>
      <div class="mnav"><button class="round sm" data-act="r-month" data-step="-1" aria-label="Oldingi oy"${mi === 0 ? ' disabled' : ''}>${ic('left', 18)}</button>
        <span>${monthName(m)} ${y}</span>
        <button class="round sm" data-act="r-month" data-step="1" aria-label="Keyingi oy"${mi === MONTHS.length - 1 ? ' disabled' : ''}>${ic('right', 18)}</button></div></header>
    ${rejaSeg(C)}
    <section class="card" style="gap:12px">
      <div class="spread"><span class="lbl">Oy rejasi</span><span class="num c-acc" style="font-size:13px">${done} / ${total} bajarildi</span></div>
      <div class="bar"><i style="width:${total ? (done / total) * 100 : 0}%"></i></div>
      <div class="grid2" style="gap:10px">
        <div class="col"><span class="small muted">Kirim</span><span class="num c-in">+${fmt(inSum)}</span></div>
        <div class="col"><span class="small muted">Majburiy to'lovlar</span><span class="num">−${fmt(outSum)}</span></div>
        <div class="col"><span class="small muted">Yo'lkira · ${yolN} ish kuni</span><span class="num">−${fmt(yolN * PLAN.transport.amount)}</span></div>
        <div class="col"><span class="small muted">Omonatga (20-sana)</span><span class="num c-acc">→ ${fmt(lockSum)}</span></div>

    <section class="card" style="padding:14px 10px;gap:6px">
      <div class="cal">${WD_SHORT.map(w => `<span class="wdh">${w}</span>`).join('')}${cells.join('')}</div>
      <div class="legend"><span><i style="--c:var(--mint)"></i>Kirim</span><span><i style="--c:var(--amber)"></i>To'lov</span>
        <span><i style="--c:var(--blue)"></i>Qulflash</span><span><i style="--c:var(--coral)"></i>Qoida buzilgan</span>
        <span><i style="--c:var(--accent);opacity:.5;border-radius:3px"></i>Ko'p xarajat</span></div></section>
    ${rejaDay(C, reja.sel)}
    <p class="note">«To'lash» yoki «Tushdi» bosilganda summa tanlangan hisobdan Tarixga yoziladi. Ish kunini dam olishga almashtirsangiz, o'sha kunning yo'lkirasi rejadan olib tashlanadi.</p>`;
}

const blankDebtForm = () => ({ id: '', dir: 'owe', who: '', a: '', due: '', flow: true });
function debtLists(C, t) {

function debtInfo(C, d, s, t) {

  const soon = !s.closed && !!d.due && !overdue && d.due <= addDays(t, 3);
  const due = s.closed ? `${owe ? "To'landi" : 'Qaytdi'}${lastPay ? ` · ${dm(lastPay.d)}` : ''}`
    : d.due ? (overdue ? `Muddati o'tdi · ${dm(d.due)}` : `Muddat ${dm(d.due)} · ${relDay(d.due, t)}`) : 'Muddatsiz';
  return {
    owe, txs, due, color: owe ? 'coral' : 'mint',

}

function recordDebtPay(id, amount) {

  const d = C.debtMap.get(id);
  const s = debtState(C, d);
  const a = Math.min(amount, s.left);
  if (!a) return;
  const k = repayKind(d);
  const t = { d: clampDate(C.t), tm: nowHM(), k, a, acc: debtUI.acc, c: k === 'out' ? 'qarz' : 'qarzq', debt: d.id };
  t.p = autoLink(t);
  addTx(t);

// O'tib ketgan, yozilmagan yo'lkira hisobga olinmaydi (affordPath va C.prog bilan bir xil qoida)
function forecast(C) {
  const t = C.t;
  let s = C.total;
  for (const e of C.events.values()) if (e.iso < t && e.id !== 'yol' && isPending(C, e)) s += delta(e);
  return DAYS.map(d => {
    const p = { iso: d.iso, plan: C.planByIso[d.iso], act: null, proj: null };
    if (d.iso < t) { p.act = totalOf(balOn(C, d.iso)); return p; }
    for (const e of C.byIso[d.iso]) if (isPending(C, e)) s += delta(e);
    if (d.iso === t) p.act = C.total;
    p.proj = s;
    return p;
  });
}

// ===== HUMO bilan solishtirish: har HUMO xabaridagi 💰 karta qoldig'i ↔ trekerdagi karta qoldig'i =====
// Farq birinchi paydo bo'lgan joy topiladi: oxirgi mos nuqtadan keyingi qo'lda yozilgan karta amallari — gumondorlar.
const touchesCard = x => x.acc === 'card' || x.to === 'card';

const minuteBefore = tm => {
  if (!tm) return '';
  const [hh, mm] = tm.split(':').map(Number);
  const m = hh * 60 + mm - 1;
  return m < 0 ? '' : `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
};
function reconcile(C) {
  const pts = [];
  let card = db.open.card;
  for (let i = C.sorted.length - 1; i >= 0; i--) {
    const x = C.sorted[i];
    if (x.k === 'in' && x.acc === 'card') card += x.a;
    else if (x.k === 'out' && x.acc === 'card') card -= x.a;
    else if (x.k === 'tr') { if (x.acc === 'card') card -= x.a; if (x.to === 'card') card += x.a; }
    if (Number.isInteger(x.b)) pts.push({ tx: x, i, app: card, humo: x.b, diff: Math.round(x.b / 100) - card, ok: Math.abs(card * 100 - x.b) < 100 });
  }
  if (!pts.length) return null;
  const last = pts[pts.length - 1];
  if (last.ok) return { pts, last, ok: true };
  // Oxirgi farq bilan bir xil farqli nuqtalar — bitta sabab; farq o'zgargan joy — paydo bo'lgan oraliq
  let k = pts.length - 1;
  while (k > 0 && !pts[k - 1].ok && pts[k - 1].diff === last.diff) k--;
  const bad = pts[k], from = pts[k - 1] || null;
  const upTo = from ? from.i : C.sorted.length;
  const suspects = C.sorted.filter((x, i) => i > bad.i && i < upTo && !x.h && x.c !== 'tuz' && touchesCard(x));
  return { pts, last, ok: false, bad, from, suspects };
}

// ===== G'ayrioddiy xarajatlar: odatdagi chek, haftalik va kunlik o'rtachaga nisbatan =====
function anomalies(C, t) {
  const list = db.tx.filter(x => isFree(C, x) && x.d <= t);
  const span = Math.max(0, daysBetween(PLAN.start, t) + 1);
  const rat = v => v.toFixed(1).replace('.', ',').replace(',0', '');
  const res = [];
  if (list.length >= 8) {
    const amts = list.map(x => x.a).sort((a, b) => a - b);
    const med = amts[Math.floor(amts.length / 2)];
    for (const x of list.filter(z => z.d >= addDays(t, -13)).sort((a, b) => b.a - a.a).slice(0, 2)) {
      if (x.a < 50000 || x.a < med * 3) continue;
      res.push({ icon: CATS[x.c]?.icon || 'dots', color: 'amber', act: `data-act="edit-tx" data-id="${x.id}"`,
        text: `${longDate(x.d)}: «${esc(txTitle(x, C))}» <b>${fmt(x.a)}</b> — odatdagi xariddan ${rat(x.a / med)} barobar katta`, sub: `Odatdagi (o'rta) xarid: ${fmt(med)}` });
    }
  }
  const weeks = Math.floor((span - 7) / 7);
  if (weeks >= 3) {
    const cur = {}, prev = {};
    const from = addDays(t, -6), pFrom = addDays(t, -6 - 7 * weeks);
    for (const x of list) {
      if (x.d >= from) cur[x.c] = (cur[x.c] || 0) + x.a;
      else if (x.d >= pFrom) prev[x.c] = (prev[x.c] || 0) + x.a;
    }
    for (const [c, v] of Object.entries(cur)) {
      const avg = (prev[c] || 0) / weeks;
      if (v < 30000 || v < avg * 2) continue;
      res.push({ icon: 'up', color: 'coral', act: '',
        text: `Bu hafta «${CATS[c]?.name || 'Boshqa'}» odatdagidan ${avg ? `<b>${rat(v / avg)} barobar</b>` : '<b>ancha</b>'} ko'p: ${fmt(v)}`, sub: `Oldingi ${weeks} hafta o'rtachasi: ${fmt(Math.round(avg))} / hafta` });
    }
  }
  if (span >= 15) {
    const tday = sum(list.filter(x => x.d === t), x => x.a);
    const avg = sum(list.filter(x => x.d < t), x => x.a) / (span - 1);
    if (tday >= 30000 && tday >= avg * 3) {
      res.push({ icon: 'alert', color: 'coral', act: 'data-act="today-tx"',
        text: `Bugun rejadan tashqari <b>${fmt(tday)}</b> — kunlik o'rtachadan ${avg ? `${rat(tday / avg)} barobar` : 'ancha'} ko'p`, sub: `Kunlik o'rtacha: ${fmt(Math.round(avg))}` });
    }
  }
  return { res: res.slice(0, 4), need: Math.max(0, 28 - span) };
}

  if (passed < 5) return `<section class="card">${head}<p class="small muted" style="line-height:1.5">Ma'lumot yig'ilmoqda — prognoz oyning 5-kunidan chiqadi.</p></section>`;
  const by = {};
  for (const x of db.tx) if (isFree(C, x) && x.d.startsWith(m) && x.d <= t) by[x.c] = (by[x.c] || 0) + x.a;
  const rows = Object.entries(by).map(([c, v]) => ({ c, v, proj: Math.round((v / passed) * mDays.length), lim: CATS[c]?.bad ? 0 : db.lim[c] || null }))
    .sort((a, b) => b.proj - a.proj);
  if (!rows.length) return `<section class="card">${head}<div class="msg soft c-in">${ic('check', 16, 2.5)}Bu oy rejadan tashqari xarajat yo'q</div></section>`;
  const line = r => {
    let status = '', cls = 'muted', pct = null;
    if (r.lim === 0) { status = "taqiqlangan — 0 bo'lishi kerak"; cls = 'c-bad'; }
    else if (r.lim) {
      pct = Math.min(100, Math.round((r.proj / r.lim) * 100));
      if (r.v >= r.lim) { status = `limit ${fmt(r.lim)} tugadi`; cls = 'c-bad'; }
      else if (r.proj > r.lim) { status = `limit ${fmt(r.lim)} dan oshadi — kuniga ${fmt(Math.floor((r.lim - r.v) / Math.max(1, left)))} dan oshmang`; cls = 'c-warn'; }
      else { status = `limit ${fmt(r.lim)} ichida`; cls = 'c-in'; }
    }
    const color = { 'c-in': 'mint', 'c-warn': 'amber', 'c-bad': 'coral' }[cls];
    return `<div class="col" style="gap:4px;padding:8px 0;border-top:1px solid var(--line)">
      <div class="spread" style="font-size:13px"><span style="font-weight:700">${CATS[r.c]?.name || 'Boshqa'}</span><span class="num">${fmt(r.v)} → ${fmt(r.proj)}</span></div>
      ${pct !== null ? `<div class="bar"><i style="width:${pct}%;--c:var(--${color})"></i></div>` : ''}
      ${status ? `<span class="small ${cls}" style="font-weight:700">${status}</span>` : ''}</div>`;
  };
  return `<section class="card" style="gap:8px">${head}
    <span class="small muted" style="line-height:1.5">Rejadan tashqari xarajat hozir <b style="color:var(--text)">${fmt(sum(rows, r => r.v))}</b>, shu sur'atda ${MONTHS_UZ[Number(m.slice(5)) - 1]} oxirida <b style="color:var(--text)">~${fmt(sum(rows, r => r.proj))}</b> bo'ladi.</span>
    <div>${rows.slice(0, 6).map(line).join('')}</div></section>`;
}

// ===== Reja va haqiqat oylar bo'yicha (joriy oy — bugungacha) =====
function varianceCard(C, t) {
  const rows = [];
  for (const m of MONTHS) {
    const all = DAYS.filter(d => d.month === m);
    const days = all.filter(d => d.iso <= t);
    if (!days.length) break;
    let pIn = 0, pOut = 0;
    for (const d of days) for (const e of C.byIso[d.iso]) { if (e.kind === 'in') pIn += e.amount; else if (e.kind === 'out') pOut += e.amount; }
    const txs = db.tx.filter(x => x.d.startsWith(m) && x.d <= t && x.c !== 'tuz');
    rows.push({ m, part: days.length < all.length ? `${days[0].day}–${days[days.length - 1].day}` : '', pIn, pOut,
      aIn: sum(txs.filter(x => x.k === 'in'), x => x.a), aOut: sum(txs.filter(x => x.k === 'out'), x => x.a) });
  }
  if (!rows.length) return '';
  const diff = (p, a, good) => { const d = a - p; return `<span class="${!d ? 'muted' : (d > 0) === good ? 'c-in' : 'c-bad'}">${d ? signed(d) : '±0'}</span>`; };
  return `<section class="card" style="gap:4px">
    <div class="col" style="margin-bottom:6px"><span class="h2">Reja va haqiqat</span><span class="small muted">Oylar bo'yicha · joriy oy bugungacha · o'tkazmalarsiz</span></div>
    <div class="vgrid vhead"><span></span><span>Reja</span><span>Haqiqat</span><span>Farq</span></div>
    ${rows.map(r => {
      const f = r.aIn - r.aOut - (r.pIn - r.pOut);
      return `<div class="vrow"><div class="spread"><span style="font-weight:800">${monthName(r.m)}${r.part ? ` <span class="small muted">${r.part}</span>` : ''}</span>`
        + `<span class="num ${f < 0 ? 'c-bad' : f > 0 ? 'c-in' : 'muted'}">${f ? signed(f) : '±0'}</span></div>`
        + `<div class="vgrid"><span class="muted">Kirim</span><span>${fmt(r.pIn)}</span><span>${fmt(r.aIn)}</span>${diff(r.pIn, r.aIn, true)}`
        + `<span class="muted">Chiqim</span><span>${fmt(r.pOut)}</span><span>${fmt(r.aOut)}</span>${diff(r.pOut, r.aOut, false)}</div></div>`;
    }).join('')}</section>`;
}
function donutCard(txs) {
  const out = txs.filter(x => x.k === 'out');
  const total = sum(out, x => x.a);
  if (!total) return `<section class="card"><span class="h2">Xarajatlar kategoriya bo'yicha</span><p class="empty" style="padding:16px">Bu oyda xarajat yo'q</p></section>`;
  const by = {};
  for (const x of out) by[x.c] = (by[x.c] || 0) + x.a;
  let list = Object.entries(by).sort((a, b) => b[1] - a[1]);
  if (list.length > 5) list = [...list.slice(0, 4), ['_rest', sum(list.slice(4), x => x[1])]];
  const C2 = 2 * Math.PI * 60;
  let off = 0;
  const segs = list.map(([c, v]) => {
    const len = (v / total) * C2;
    const gap = list.length > 1 ? Math.min(2, len / 2) : 0;
    const color = c === '_rest' ? 'gray' : CATS[c].color;
    const s = `<circle cx="80" cy="80" r="60" style="stroke:var(--${color})" stroke-dasharray="${(len - gap).toFixed(2)} ${C2.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len;
    return s;
  }).join('');
  const pct = v => `${Math.round((v / total) * 100)}%`;
  const label = c => (c === '_rest' ? 'Boshqalar' : CATS[c].name);
  return `<section class="card" style="gap:14px"><span class="h2">Xarajatlar kategoriya bo'yicha</span>
    <div style="display:flex;align-items:center;gap:16px">
      <div class="donut"><svg width="150" height="150" viewBox="0 0 160 160" role="img" aria-label="${esc(list.map(([c, v]) => `${label(c)} ${pct(v)}`).join(', '))}">
        <g transform="rotate(-90 80 80)" fill="none" stroke-width="22"><circle cx="80" cy="80" r="60" style="stroke:var(--line)"/>${segs}</g></svg>
        <div class="mid"><span class="num" style="font-size:17px">${fmt(total)}</span><span class="small muted" style="font-size:11px;font-weight:700">jami chiqim</span></div></div>
      <div class="col" style="flex:1;gap:10px">${list.map(([c, v]) => `<div class="lgd" style="--c:var(--${c === '_rest' ? 'gray' : CATS[c].color})"><i></i>`
        + `<div class="col"><span style="font-size:13px;font-weight:700">${label(c)}</span><span class="small muted">${fmt(v)} · ${pct(v)}</span></div></div>`).join('')}</div>

}

function limitsCard(C, m, txs) {
  const spent = c => sum(txs.filter(x => x.k === 'out' && x.c === c), x => x.a);
  const row = (name, status, statusCls, pct, color, detail) => `<div class="col" style="gap:6px">
    <div class="spread" style="font-size:13px"><span style="font-weight:700">${name}</span><span class="num ${statusCls}">${status}</span></div>
    <div class="bar"><i style="width:${pct}%;--c:var(--${color})"></i></div><span class="small muted">${detail}</span></div>`;
  const rows = ['kucha', 'kofe', 'taksi'].map(c => {
    const v = spent(c);
    return row(CATS[c].name, v ? 'Buzildi' : 'Toza', v ? 'c-bad' : 'c-in', v ? 100 : 0, v ? 'coral' : 'mint', `${fmt(v)} sarflandi · limit 0 (taqiqlangan)`);
  });
  const mDays = DAYS.filter(d => d.month === m);
  const yolPlan = mDays.filter(d => isWorkday(d)).length * PLAN.transport.amount;
  const yolLeft = mDays.filter(d => d.iso > C.t && isWorkday(d)).length;
  const yol = spent('yol');
  const yp = yolPlan ? Math.round((yol / yolPlan) * 100) : (yol ? 100 : 0);
  rows.push(row("Yo'lkira", yol > yolPlan ? 'Oshdi' : `${yp}%`, yol > yolPlan ? 'c-bad' : 'c-acc', Math.min(100, yp), yol > yolPlan ? 'coral' : 'blue',
    `${fmt(yol)} / ${fmt(yolPlan)} · ${yolLeft} ish kuni qoldi`));
  for (const c of LIMIT_CATS) {
    const lim = db.lim[c];
    if (!lim) continue;
    const v = spent(c);
    const p = Math.round((v / lim) * 100);
    rows.push(row(CATS[c].name, v > lim ? 'Oshdi' : `${p}%`, v > lim ? 'c-bad' : p >= 80 ? 'c-warn' : 'c-acc', Math.min(100, p), v > lim ? 'coral' : p >= 80 ? 'amber' : 'blue',
      `${fmt(v)} / ${fmt(lim)} · ${v > lim ? `${fmt(v - lim)} oshib ketdi` : `${fmt(lim - v)} qoldi`}`));
  }
  return `<section class="card" style="gap:12px"><div class="spread"><span class="h2">Kategoriya limitlari</span><button class="link-btn" data-act="page" data-to="sz-lim">Sozlash</button></div>${rows.join('')}</section>`;
}

function parseBackup(text) {
  if (!text) throw new Error('Avval zaxira JSON matnini joylang.');
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error(`JSON xato: ${e.message}`); }
  if (!isObj(data)) throw new Error("Format noto'g'ri: obyekt kutilgan.");
  if (data.v === 1) {
    if (!isObj(data.months)) throw new Error("Format noto'g'ri: \"months\" topilmadi.");
    const prev = db;
    db = blankDb();
    try { migrateV1(data.months); return db; } finally { db = prev; }
  }
  if (data.v !== 2 || !Array.isArray(data.tx) || !Array.isArray(data.debts)) throw new Error('Format noto\'g\'ri: {"v": 2, "tx": [...], "debts": [...]} kutilgan.');
  const meta = cleanMeta({ ...data, mig: 1 });
  const wish = Array.isArray(data.wish) ? data.wish.map(cleanWish) : [];
  return finishDb({ ...meta, wish }, data.debts.map(cleanDebt), data.tx.map(cleanTx), data.log || []);
}

  [/KORZINKA|MAKRO|HAVAS|BAZAR|SUPERMARKET|MINIMARKET|DISKONT|\bFRESH\b|OZIQ/, 'oziq'],
  [/PAYNET|BEELINE|UCELL|MOBIUZ|UZMOBILE|HUMANS|TELECOM|INTERNET|CLAUDE|ANTHROPIC|OPENAI|NETFLIX|SPOTIFY|YOUTUBE|GOOGLE|APPLE\.COM/, 'aloqa'],
  [/APTEKA|PHARM|DORIXONA|CLINIC|KLINIKA|\bMED|STOMAT|DENTAL/, 'sog'],

function parseMoney(raw) {

// Har bir blok: [tur] summa, joy, karta, "HH:MM DD.MM.YYYY", qoldiq

    const ai = win.findIndex(l => amtOf(l));
    let next = i + 1;
    let bal = null;
    const b = i + 1 < lines.length ? amtOf(lines[i + 1]) : null;
    if (b && !b.sign) { bal = b.tiyin; next = i + 2; }
    from = next;
    if (ai < 0) continue;
    const amt = amtOf(win[ai]);
    const head = win.slice(0, ai).join(' ');
    const rest = win.slice(ai + 1);
    const cardLine = win.find(l => /\*\d{4}/.test(l)) || '';

    const typeName = kind === 'atm' ? 'Naqd yechish' : kind === 'p2p' ? 'Amaliyot (kartadan kartaga)' : dir === 'in' ? "To'ldirish" : "To'lov";

function humoRows() {

    seen.add(r.key);
    if (!inPeriod(r.d)) x.status = 'out';

function humoTx(x) {

// ===== PIN-kod: ochilganda va 1 daqiqadan ko'p fonda turgandan keyin so'raladi =====
// Bu ekran qulfi: telefoningizni olgan odam trekerni ko'ra olmaydi. Hash bulutda saqlanadi.
const PIN_LEN = 4;
const PIN_TITLES = { unlock: 'PIN-kodni kiriting', verify: 'Joriy PIN-kodni kiriting', set1: 'Yangi PIN-kod (4 raqam)', set2: 'PIN-kodni takrorlang' };

async function pinHash(pin, salt) {
  const data = new TextEncoder().encode(`${salt}:${pin}`);
  if (window.crypto?.subtle) return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', data)));
  let h = 0x811c9dc5;
  for (const b of data) { h ^= b; h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(64, '0');
}
function showLock(mode, done) {
  Object.assign(pinUI, { mode, buf: '', first: '', msg: '', done });
  $('lock').hidden = false;
  renderLock();
  if (mode === 'unlock') bioUnlock();
}
function hideLock() {

  $('lock').innerHTML = '';
}

  const u = pinUI;
  const wait = Math.max(0, Math.ceil((u.until - Date.now()) / 1000));
  const dis = wait ? ' disabled' : '';
  const side = u.mode === 'unlock' ? '<button class="ghost" data-act="pin-forgot">Unutdim</button>' : '<button class="ghost" data-act="pin-cancel">Bekor</button>';
  $('lock').innerHTML = `<div class="lockbox" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <span class="tile lg soft" style="--c:var(--blue)">${ic('lock', 24)}</span>
    <h1 class="h2" id="lock-title" style="font-size:18px">${PIN_TITLES[u.mode]}</h1>
    <div class="pindots${shake ? ' shake' : ''}" role="img" aria-label="${u.buf.length} / ${PIN_LEN}">${Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < u.buf.length ? 'on' : ''}"></i>`).join('')}</div>
    <p class="small ${u.msg || wait ? 'c-bad' : 'muted'}" style="min-height:18px;font-weight:700" role="alert">${wait ? `Juda ko'p urinish. ${wait} soniyadan keyin qayta urining.` : esc(u.msg)}</p>
    ${u.mode === 'unlock' && bioOn() ? `<button class="btn sm" data-act="bio-unlock">${ic(bioIcon(), 18)}${bioName()} bilan ochish</button>` : ''}
    <div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button data-act="pin-key" data-k="${k}"${dis}>${k}</button>`).join('')}
      ${side}<button data-act="pin-key" data-k="0"${dis}>0</button><button data-act="pin-key" data-k="back" aria-label="O'chirish">${ic('backspace', 24)}</button></div>
  </div>`;
  if (wait) setTimeout(() => { if (!$('lock').hidden) renderLock(); }, 1000);
}
function finishLock() {
  const done = pinUI.done;
  pinUI.done = null;
  hideLock();
  done?.();
}
async function pinKey(k) {
  const u = pinUI;
  if (u.until > Date.now()) return;
  if (k === 'back') { u.buf = u.buf.slice(0, -1); renderLock(); return; }
  if (u.buf.length >= PIN_LEN) return;
  u.buf += k;
  u.msg = '';
  renderLock();
  if (u.buf.length < PIN_LEN) return;
  const pin = u.buf;
  if (u.mode === 'set1') { Object.assign(u, { first: pin, buf: '', mode: 'set2' }); renderLock(); return; }
  if (u.mode === 'set2') {
    if (pin !== u.first) {
      Object.assign(u, { mode: 'set1', buf: '', first: '', msg: 'PIN-kodlar mos kelmadi, qaytadan kiriting' });
      haptic.error();
      renderLock(true);
      return;
    }
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    db.pin = { s: salt, h: await pinHash(pin, salt) };
    touch('meta');
    logEv('set', "PIN-kod o'rnatildi");
    haptic.ok();
    toast("PIN-kod o'rnatildi");
    finishLock();
    return;
  }
  if (db.pin && (await pinHash(pin, db.pin.s)) === db.pin.h) {
    u.fails = 0;
    haptic.ok();
    finishLock();
    return;
  }
  u.fails++;
  u.buf = '';
  u.msg = "Noto'g'ri PIN-kod";
  if (u.fails >= 5) { u.until = Date.now() + 30000; u.fails = 0; }
  haptic.error();
  renderLock(true);
}

}
