// ===== Jonli effektlar: konfetti, raqam sanash =====
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n = 140) {
  haptic.ok();
  if (reducedMotion()) return;
  const cv = document.createElement('canvas');
  cv.className = 'confetti';
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  document.body.append(cv);
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colors = ['--accent', '--mint', '--amber', '--coral', '--purple', '--pink'].map(v => css.getPropertyValue(v).trim() || '#4F8BFF');
  const P = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - 0.5) * 120, y: H * 0.38, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 5,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0],
  }));
  let last = performance.now();
  const end = last + 4000;
  const frame = () => {
    const now = performance.now(); // rAF vaqt belgisi ba'zi WebView'larda boshqa soatdan keladi
    const dt = Math.max(0, Math.min(32, now - last)) / 16;
    last = now;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of P) {
      p.vy += 0.38 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.y < H + 20) alive++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    }
    if (alive && now < end) requestAnimationFrame(frame); else cv.remove();
  };
  requestAnimationFrame(frame);
  setTimeout(() => cv.remove(), 4500); // kadrlar to'xtab qolsa ham (fon, eski WebView) ekranda qolib ketmasin
}
// Balans raqami eski qiymatdan yangisiga "sanab" o'tadi (birinchi ochilishda — noldan)
let heroShown = null;
function heroCount() {
  const el = $('hero-num');
  if (!el) return;
  const to = Number(el.dataset.v), from = heroShown ?? 0;
  heroShown = to;
  if (from === to || reducedMotion()) return;
  countTo(el, from, to, from === 0 ? 900 : 650);
}
function countTo(el, from, to, dur, pre = '') {
  const t0 = performance.now();
  const step = () => {
    if (!el.isConnected) return;
    const k = Math.max(0, Math.min(1, (performance.now() - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
    el.textContent = pre + fmt(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = pre + fmt(from);
  requestAnimationFrame(step);
  setTimeout(() => { if (el.isConnected) el.textContent = pre + fmt(to); }, dur + 80); // kadr kelmasa ham yakuniy qiymat
}
// data-count="123" bo'lgan elementlar 0 dan sanaladi
function countUpIn(root) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const v = Number(el.dataset.count), pre = el.dataset.pre || '';
    if (reducedMotion()) { el.textContent = pre + fmt(v); return; }
    countTo(el, 0, v, 900, pre);
  });
}

// ===== Moliyaviy salomatlik (0–100) va nishonlar =====
function health(C, t) {
  const past = DAYS.filter(d => d.iso <= t).slice(-14);
  const ok = past.filter(d => !C.dayStat[d.iso]?.bad).length;
  const overdue = [...C.events.values()].filter(e => e.iso < t && e.id !== 'yol' && isPending(C, e)).length;
  const lateDebts = db.debts.filter(d => d.dir === 'owe' && d.due && d.due < t && !debtState(C, d).closed).length;
  const parts = [
    { name: 'Intizom', max: 40, v: past.length ? Math.round((40 * ok) / past.length) : 40, sub: `So'nggi ${past.length || 14} kunning ${ok} tasida taqiqlangan xarajat yo'q`, tip: 'Ko\'cha ovqati, kofe va taksidan saqlaning' },
    { name: 'Rejaga muvofiqlik', max: 30, v: C.dev >= 0 ? 30 : Math.round(30 * Math.max(0, 1 + C.dev / 500000)), sub: `Rejadan farq: ${C.dev ? signed(C.dev) : '±0'}`, tip: 'Rejadan tashqari xarajatni kamaytiring' },
    { name: 'Reja bandlari', max: 15, v: Math.max(0, 15 - 5 * overdue), sub: overdue ? `${overdue} ta belgilanmagan band` : 'Hammasi belgilangan', tip: 'Belgilanmagan rejalarni belgilang' },
    { name: 'Qarzlar', max: 15, v: Math.max(0, 15 - 8 * lateDebts), sub: lateDebts ? `${lateDebts} ta muddati o'tgan qarz` : "Muddati o'tgan qarz yo'q", tip: "Muddati o'tgan qarzni yoping" },
  ];
  const score = sum(parts, p => p.v);
  const [level, color] = score >= 90 ? ["A'lo", 'mint'] : score >= 75 ? ['Yaxshi', 'blue'] : score >= 50 ? ["O'rtacha", 'amber'] : ['Xavf', 'coral'];
  const weak = parts.reduce((a, b) => (b.max - b.v > a.max - a.v ? b : a));
  return { score, level, color, parts, tip: weak.v < weak.max ? weak.tip : 'Hammasi zo\'r — shunday davom eting' };
}
const BADGES = [
  ['first', 'Birinchi qadam', 'Birinchi amalni yozdingiz', 'check', 'mint'],
  ['streak7', '7 kun taqiqsiz', 'Ketma-ket 7 kun qoidaga amal qildingiz', 'flame', 'amber'],
  ['streak30', '30 kun taqiqsiz', 'Ketma-ket 30 kun — temir intizom', 'flame', 'coral'],
  ['lockday', 'Oylik qulflandi', '20-sanada omonatga o\'sha kuni o\'tkazdingiz', 'lock', 'blue'],
  ['nodebt', 'Qarzsiz', 'Barcha qarzlaringiz yopilgan', 'users', 'teal'],
  ['planmonth', 'Reja ustasi', 'Bir oyning hamma reja bandlari bajarildi', 'calendar', 'purple'],
  ['humo10', 'HUMO ustasi', '10 ta amal HUMO dan import qilindi', 'clipboard', 'teal'],
  ['plus', 'Rejadan oldinda', 'Balansingiz rejadagidan ko\'p', 'chart', 'mint'],
  ['half', "Yarim yo'l", 'Yakuniy maqsadning yarmi yig\'ildi', 'target', 'pink'],
];
function badges(C, t) {
  let run = 0, best = 0;
  for (const d of DAYS) { if (d.iso > t) break; run = C.dayStat[d.iso]?.bad ? 0 : run + 1; best = Math.max(best, run); }
  const monthDone = MONTHS.some(m => {
    const days = DAYS.filter(d => d.month === m);
    if (!days.length || days[days.length - 1].iso >= t) return false;
    return days.every(d => C.byIso[d.iso].every(e => e.id === 'yol' || !isPending(C, e)));
  });
  const has = {
    first: db.tx.length > 0,
    streak7: best >= 7,
    streak30: best >= 30,
    lockday: db.tx.some(x => x.p?.endsWith(':lock') && x.d === x.p.slice(0, 10)),
    nodebt: db.debts.some(d => d.dir === 'owe') && db.debts.filter(d => d.dir === 'owe').every(d => debtState(C, d).closed),
    planmonth: monthDone,
    humo10: db.tx.filter(x => x.h).length >= 10,
    plus: C.dev > 0,
    half: C.final > 0 && C.total >= C.final / 2,
  };
  return BADGES.map(([id, name, desc, icon, color]) => ({ id, name, desc, icon, color, on: !!has[id] }));
}

function checkBadges(C, t) {
  const earned = badges(C, t).filter(b => b.on).map(b => b.id);
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem('byudjet:ui:badges')); } catch { /* yo'q */ }
  const all = [...new Set([...(Array.isArray(seen) ? seen : []), ...earned])];
  try { localStorage.setItem('byudjet:ui:badges', JSON.stringify(all)); } catch { /* saqlash yo'q */ }
  if (!Array.isArray(seen)) return;
  const fresh = earned.filter(id => !seen.includes(id));
  if (!fresh.length) return;
  const b = BADGES.find(x => x[0] === fresh[0]);
  setTimeout(() => { toast(`🏅 Yangi nishon: ${b[1]}`); confetti(); }, 900);
}

function insights(C, t) {
  const res = [];
  const planned = x => x.p && C.byPlan.get(x.p) === x;
  const free = x => x.k === 'out' && x.c !== 'tuz' && x.c !== 'yol' && !x.debt && !planned(x); // rejadan tashqari, ixtiyoriy
  const byCat = (from, to) => {
    const o = {};
    for (const x of db.tx) if (free(x) && x.d >= from && x.d <= to) o[x.c] = (o[x.c] || 0) + x.a;
    return o;
  };
  const cur = byCat(addDays(t, -6), t), prev = byCat(addDays(t, -13), addDays(t, -7));
  let best = null;
  for (const c of new Set([...Object.keys(cur), ...Object.keys(prev)])) {
    const a = cur[c] || 0, b = prev[c] || 0;
    if (Math.abs(a - b) >= 20000 && (!best || Math.abs(a - b) > Math.abs(best.a - best.b))) best = { c, a, b };
  }
  if (best && addDays(t, -13) >= PLAN.start) {
    const name = CATS[best.c]?.name || 'Boshqa', more = best.a > best.b;
    const text = !best.b ? `Bu hafta «${name}» uchun ${fmt(best.a)} sarfladingiz — o'tgan hafta umuman yo'q edi`
      : !best.a ? `Bu hafta «${name}» uchun hech narsa sarflamadingiz — o'tgan hafta ${fmt(best.b)} edi 👏`
      : `Bu hafta «${name}» uchun o'tgan haftadan <b>${Math.round((Math.abs(best.a - best.b) / best.b) * 100)}% ${more ? "ko'p" : 'kam'}</b> sarfladingiz (${fmt(best.a)} / ${fmt(best.b)})`;
    res.push({ icon: more ? 'up' : 'down', color: more ? 'amber' : 'mint', text });
  }
  let quiet = 0;
  for (let i = 0; i < 60; i++) {
    const d = addDays(t, -i);
    if (d < PLAN.start || db.tx.some(x => free(x) && x.d === d)) break;
    quiet++;
  }
  if (quiet >= 3) res.push({ icon: 'check', color: 'mint', text: `<b>${quiet} kun</b>dan beri rejadan tashqari xarajat yo'q 👏` });
  const m = t.slice(0, 7), dom = Number(t.slice(8)), dim = new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5)), 0)).getUTCDate();
  for (const c of LIMIT_CATS) {
    const lim = db.lim[c];
    if (!lim || dom < 5) continue;
    const v = sum(db.tx.filter(x => x.k === 'out' && x.c === c && x.d.startsWith(m)), x => x.a);
    const proj = Math.round((v / dom) * dim);
    if (v < lim && proj > lim * 1.1) res.push({ icon: 'alert', color: 'amber', text: `Shu sur'atda oy oxirigacha «${CATS[c].name}» <b>${fmt(proj)}</b> bo'ladi — limit ${fmt(lim)}` });
  }
  const past = DAYS.filter(d => d.iso < t);
  if (past.length >= 14) {
    const spend = {};
    for (const x of db.tx) if (free(x)) spend[x.d] = (spend[x.d] || 0) + x.a;
    const tot = Array(7).fill(0), cnt = Array(7).fill(0);
    for (const d of past) { tot[d.dow] += spend[d.iso] || 0; cnt[d.dow]++; }
    const avg = tot.map((v, i) => (cnt[i] ? v / cnt[i] : 0));
    const all = sum(tot, v => v) / past.length;
    const i = avg.indexOf(Math.max(...avg));
    if (avg[i] >= 10000 && avg[i] >= all * 1.5) res.push({ icon: 'calendar', color: 'purple', text: `<b>${WEEKDAYS[i]}</b> kunlari eng ko'p sarflaysiz — o'rtacha ${fmt(Math.round(avg[i]))}` });
  }
  const places = {};
  for (const x of db.tx) {
    if (!x.h || x.k !== 'out' || x.d < addDays(t, -29)) continue;
    const p = x.n.split(' · ').pop();
    if (p) { places[p] ||= { n: 0, a: 0 }; places[p].n++; places[p].a += x.a; }
  }
  const top = Object.entries(places).sort((a, b) => b[1].a - a[1].a)[0];
  if (top && top[1].n >= 3) res.push({ icon: 'cart', color: 'teal', text: `Eng ko'p pul ketgan joy: <b>${esc(top[0])}</b> — ${top[1].n} marta, ${fmt(top[1].a)}` });
  return res.slice(0, 3);
}

// ===== «Qachon sotib ola olaman?»: rejani buzmasdan qaysi kundan pul yetadi =====
// Karta + naqd (omonatga tegilmaydi) kunma-kun reja bandlari bo'yicha: xariddan keyin hech qaysi kunda manfiyga tushmasligi kerak.
function affordPath(C) {
  const t = C.t;
  let s = C.bal.card + C.bal.cash;
  const step = e => (e.kind === 'lock' ? -e.amount : delta(e));
  for (const e of C.events.values()) if (e.iso < t && e.id !== 'yol' && isPending(C, e)) s += step(e); // muddati o'tgan bandlar
  const path = [];
  for (const d of DAYS) {
    if (d.iso < t) continue;
    for (const e of C.byIso[d.iso]) if (isPending(C, e)) s += step(e);
    path.push({ iso: d.iso, s });
  }
  if (!path.length) path.push({ iso: t, s });
  for (let i = path.length - 1, m = Infinity; i >= 0; i--) { m = Math.min(m, path[i].s); path[i].min = m; }
  return path;
}
// Erkin pul: rejadagi barcha to'lovlardan keyin karta + naqddan hozir sarflash mumkin bo'lgan summa
function freeMoney(C) {
  const path = affordPath(C);
  const low = path.find(x => x.s === path[0].min) || path[0];
  return { v: path[0].min, iso: low.iso };
}
function freeInfo() {
  const C = calc(), fm = freeMoney(C);

    <p class="small muted" style="line-height:1.55">Rejadagi barcha kelgusi to'lovlar, qulflash va yo'lkira hisobga olingach, karta va naqddan hozir shuncha sarflasangiz ham hech qaysi kunda pul yetmay qolmaydi. Omonatdagi pul hisobga olinmaydi.</p>
    <div>${kv('Karta + naqd hozir', fmt(C.bal.card + C.bal.cash))}${kv("Eng tig'iz kun", `${longDate(fm.iso)} · ${fm.v < 0 ? `${fmt(-fm.v)} yetmaydi` : `${fmt(fm.v)} qoladi`}`)}
      ${next ? kv('Keyingi kirim', `${longDate(next.iso)} · +${fmt(inc)}`) : ''}</div>
    ${fm.v < 0 ? `<div class="msg soft c-bad">${ic('alert', 16)}<span>${longDate(fm.iso)} da ${fmt(-fm.v)} so'm yetmaydi — rejadan tashqari xarajatni to'xtating yoki to'lovni boshqa kunga suring.</span></div>` : ''}

      <button class="btn sm" data-act="afford" style="color:var(--accent)">${ic('hourglass', 16)}Qachon olaman?</button></div>`);

function whenAfford(C, price) {
  const p = affordPath(C);
  const i = p.findIndex(x => x.min >= price);
  const low = p.find(x => x.s - price < 0);
  return { now: i === 0, iso: i < 0 ? '' : p[i].iso, max: Math.max(0, p[0].min), low };
}

// ===== Bir qatorli tez yozish: «30k non karta», «+3.3m oylik», «kecha 12 000 taksi naqd» =====
function parseLine(s) {
  let x = ` ${s.toLowerCase().replace(/[ʻʼ’‘`]/g, "'").replace(/(\d)[ .](?=\d{3}(?!\d))/g, '$1')} `;
  const r = { a: 0, k: '', acc: '', y: false, note: '' };
  const am = x.match(/(\d+(?:[.,]\d+)?)\s*(k|ming|mln|million|m)?(?![a-z0-9'])/);
  if (am) {
    const mul = /^(k|ming)$/.test(am[2] || '') ? 1000 : am[2] ? 1e6 : 1;
    r.a = Math.round(parseFloat(am[1].replace(',', '.')) * mul);
    x = x.replace(am[0], ' ');
  }
  if (/(^|\s)\+/.test(x) || /\b(kirim|oylik|avans|tushdi|keldi|qaytdi)\b/.test(x)) r.k = 'in';
  if (/\b(karta|kartadan|kartaga|card|humo)\b/.test(x)) r.acc = 'card';
  else if (/\b(naqd|naqt|naqddan|naqdga|cash)\b/.test(x)) r.acc = 'cash';

function wrapSeen() { try { return JSON.parse(localStorage.getItem('byudjet:ui:wrap')) || []; } catch { return []; } }
function wrapReady(t) {
  const cur = t.slice(0, 7), day = Number(t.slice(8));
  const prev = MONTHS[MONTHS.indexOf(cur) - 1] || (cur > PLAN.end.slice(0, 7) ? MONTHS[MONTHS.length - 1] : '');
  if (day <= 5 && prev && !wrapSeen().includes(prev)) return prev;
  if (addDays(t, 1).slice(0, 7) !== cur && MONTHS.includes(cur) && !wrapSeen().includes(cur)) return cur;

function wrapBanner(C, t) {

    <span class="small">Kirim, chiqim, rekordlar va nishonlar</span></span>${ic('right', 18)}</button>`;
}
function monthWrap(C, m) {
  const t = C.t;
  const days = DAYS.filter(d => d.month === m && d.iso <= t);
  const txs = db.tx.filter(x => x.d.startsWith(m) && x.d <= t && x.c !== 'tuz');
  const outs = txs.filter(x => x.k === 'out');
  const byCat = {};
  for (const x of outs) byCat[x.c] = (byCat[x.c] || 0) + x.a;
  let run = 0, best = 0;
  for (const d of days) { run = C.dayStat[d.iso]?.bad ? 0 : run + 1; best = Math.max(best, run); }
  const bad = days.filter(d => C.dayStat[d.iso]?.bad).length;
  const last = days.length ? days[days.length - 1].iso : t;
  return {
    m, days, count: txs.length, ins: sum(txs.filter(x => x.k === 'in'), x => x.a), outs: sum(outs, x => x.a),
    cats: Object.entries(byCat).sort((a, b) => b[1] - a[1]), biggest: [...outs].sort((a, b) => b.a - a.a)[0] || null,
    bad, ok: days.length - bad, best, locked: sum(txs.filter(x => x.k === 'tr' && x.to === 'save'), x => x.a),
    last, endBal: totalOf(balOn(C, last)), planBal: C.planByIso[last] ?? PLAN.startBalance,
  };
}

function wrapCanvas() {

  cv.width = 1080; cv.height = 1350;
  const g = cv.getContext('2d');

  grad.addColorStop(0, '#2F6BFF'); grad.addColorStop(1, '#0B1638');
  g.fillStyle = grad; g.fillRect(0, 0, 1080, 1350);
  const font = (wt, px) => `${wt} ${px}px "Manrope Variable", Manrope, system-ui, sans-serif`;
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = font(700, 40); g.fillText('OY YAKUNI · BYUDJET TREKER', 80, 150);
  g.fillStyle = '#FFFFFF'; g.font = font(800, 104); g.fillText(`${monthName(w.m)} ${w.m.slice(0, 4)}`, 80, 270);
  const rows = [['Kirim', `+${fmt(w.ins)}`, '#8FF0C4'], ['Chiqim', `−${fmt(w.outs)}`, '#FFFFFF'],
    ["Eng ko'p", w.cats[0] ? `${CATS[w.cats[0][0]]?.name || ''} · ${fmt(w.cats[0][1])}` : '—', '#FFFFFF'],
    ['Qoida bajarilgan kunlar', `${w.ok} / ${w.days.length}`, '#FFFFFF'], ['Eng uzun seriya', `${w.best} kun`, '#FFFFFF'],
    ['Oy oxiridagi balans', fmt(w.endBal), '#FFFFFF'], ['Moliyaviy salomatlik', `${h.score} / 100 · ${h.level}`, '#FFD27A']];
  let y = 420;
  for (const [k, v, col] of rows) {

    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = font(600, 38); g.fillText(k, 80, y);
    g.fillStyle = col; g.font = font(800, 46); g.textAlign = 'right'; g.fillText(v, 1000, y); g.textAlign = 'left';
    y += 120;
  }

  return cv;
}
async function saveWrapImage() {

  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  if (blob && !inTelegram) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Rasm saqlandi');

  }
  if (blob && ['android', 'android_x', 'ios'].includes(WA.platform)) {
    try {

    } catch (e) { if (e.name === 'AbortError') return; }

  // Ulashib bo'lmasa — rasm shu yerda ko'rsatiladi, bosib turib saqlanadi

  },
  'd-delete': async el => {
    const d = debtById(el.dataset.id);
    if (!d || !(await confirmDialog(`«${d.who}» qarzi o'chirilsinmi? Unga bog'langan amallar Tarixda qoladi.`))) return;
    db.debts.splice(db.debts.indexOf(d), 1);
    logEv('del', `Qarz o'chirildi: ${d.who} (${fmt(d.a)})`, d.id);
    for (const t of db.tx) if (t.debt === d.id) {
      t.debt = '';
      if (CATS[t.c]?.hidden) t.c = t.k === 'in' ? 'kirim' : 'boshqa';
      touch(tdoc(t.d));
    }
    touch('debts');
    closeModal();
    toast("Qarz o'chirildi");
    rerender();
  },
  'd-save': () => saveDebt(),
  // Hisobot
  'h-month': el => {
    const i = MONTHS.indexOf(rep.m) + Number(el.dataset.step);
    if (i < 0 || i >= MONTHS.length) return;
    rep.m = MONTHS[i];
    rerender();
  },
  'save-lim': () => {
    const lim = {};
    document.querySelectorAll('[data-lim]').forEach(i => { const v = digits(i.value); if (v) lim[i.dataset.lim] = v; });
    db.lim = lim;
    touch('meta');
    logEv('set', Object.keys(lim).length ? `Oylik limitlar: ${Object.entries(lim).map(([c, v]) => `${CATS[c].name} ${fmt(v)}`).join(', ')}` : 'Oylik limitlar olib tashlandi');
    toast('Limitlar saqlandi');
    if (route === 'sz-lim') back(); else rerender();
  },
  'save-open': () => {
    document.querySelectorAll('[data-open]').forEach(i => { db.open[i.dataset.open] = digits(i.value); });
    touch('meta');
    logEv('set', `Boshlang'ich qoldiqlar: ${ACC_IDS.map(a => `${ACC[a].name} ${fmt(db.open[a])}`).join(', ')}`);
    toast("Boshlang'ich qoldiqlar saqlandi");
    if (route === 'sz-open') back(); else rerender();
  },
  csv: () => exportData('csv'),
  'b-export': () => exportData('json'),
  'b-show': () => { $('b-text').value = exportText(); setBackupMsg('', false); },
  'b-copy': async () => {
    const ta = $('b-text');
    if (!ta.value.trim()) ta.value = exportText();
    if (await copyText(ta.value)) toast('Nusxalandi');
  },
  'b-import': async () => {
    let next;
    try {
      next = parseBackup($('b-text').value.trim());
    } catch (e) {
      setBackupMsg(e.message, true);
      haptic.error();
      return;
    }
    if (!(await confirmDialog("Joriy ma'lumotlar zaxiradagisi bilan almashtiriladi. Davom etasizmi?"))) return;
    const oldDocs = Object.keys(chunkCount).filter(d => d.startsWith('t_'));
    next.pin = db.pin;
    next.bio = db.bio;
    next.home = db.home;
    db = next;
    logEv('import', `Zaxira import qilindi: ${db.tx.length} ta amal, ${db.debts.length} ta qarz`);
    touch('meta', 'debts', 'log', 'wish', ...oldDocs, ...new Set(db.tx.map(t => tdoc(t.d))));
    await flush();
    rerender();
    setBackupMsg(`Import qilindi: ${db.tx.length} ta amal, ${db.debts.length} ta qarz.`, false);
  },
  // HUMO
  'hu-paste': async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text.trim()) throw new Error();
      humo.text = text;
      $('hu-text').value = text;
      $('hu-res').innerHTML = humoResults();
    } catch { toast("Buferni o'qib bo'lmadi — matnni maydonga qo'lda joylang"); }
  },
  'hu-choice': el => { humo.choice[el.dataset.key] = el.dataset.ch; $('hu-res').innerHTML = humoResults(); },
  'hu-import': el => importHumo(el),
};
function setBackupMsg(text, isError) {
  const el = $('b-msg');
  if (!el) return;
  el.textContent = text;
  el.className = `small ${isError ? 'c-bad' : 'c-in'}`;
}
let huTimer;
const INPUT = {
  'aff-a': el => { $('aff-res').innerHTML = affordResultHTML(digits(el.value)); },
  'sim-daily': el => { simUI.daily = Number(el.value); $('sim-dv').textContent = `${fmt(simUI.daily)} so'm`; $('sim-res').innerHTML = simResultHTML(); },
  'sim-monthly': el => { simUI.monthly = Number(el.value); $('sim-mv').textContent = `${fmt(simUI.monthly)} so'm`; $('sim-res').innerHTML = simResultHTML(); },
  'f-note': el => {
    form.n = el.value;
    // Kategoriya qo'lda tanlanmagan yangi amalda — izohga qarab tanlanadi (fokus yo'qolmasligi uchun faqat shu bloklar yangilanadi)
    if (form.id || form.catSet || form.k === 'tr' || form.debt) return;
    const c = noteCat(el.value, form.k);
    if (!c || c === form.c) return;
    form.c = c;
    $('f-cats').innerHTML = addCatsHTML(form, null);
    $('f-actions').outerHTML = addSaveHTML(form);
    $('view').querySelector('.amount b')?.classList.toggle('c-bad', !!CATS[c].bad && form.k === 'out');
  },
  'h-q': el => { hist.q = el.value; $('h-list').innerHTML = histList(calc()); },
  'j-q': el => { jr.q = el.value; $('j-list').innerHTML = logList(); },
  'd-who': el => { debtUI.form.who = el.value; },
  'hu-note': el => { humo.note[el.dataset.key] = el.value.trim(); },
  'd-a': el => { debtUI.form.a = el.value; },
  'd-due': el => { debtUI.form.due = validISO(el.value) ? el.value : ''; },
  'hu-text': el => {
    humo.text = el.value;
    clearTimeout(huTimer);
    huTimer = setTimeout(() => { $('hu-res').innerHTML = humoResults(); }, 250);
  },
};
const CHANGE = {
  'f-date': el => { if (validISO(el.value)) { form.d = clampDate(el.value); form.tm = form.id ? form.tm : ''; } rerender(); },
  'fmt-num': el => { const v = digits(el.value); el.value = v ? fmt(v) : ''; },
  'd-flow': el => { debtUI.form.flow = el.checked; },
  'hu-on': el => { humo.on[el.dataset.key] = el.checked; $('hu-res').innerHTML = humoResults(); },
  'hu-cat': el => { humo.cat[el.dataset.key] = el.value; $('hu-res').innerHTML = humoResults(); },
  'hu-fix': el => { humo.fix = el.checked; $('hu-res').innerHTML = humoResults(); },
  'home-on': el => toggleHomeCard(el.dataset.id, el.checked),
  // Summa hali kiritilmagan bo'lsa, izoh «30k non karta» kabi bir qatorli yozuv sifatida ajratiladi
  'f-note': el => { if (!form.id && form.k !== 'tr' && !digits(form.a) && parseLine(el.value).a >= 500) applyLine(el.value); },
};
document.addEventListener('click', ev => {
  // Kompyuterda sana tanlagich faqat ikonkadan ochiladi — butun tugmadan ochilsin
  if (ev.target.matches?.('input[type="date"]')) { try { ev.target.showPicker(); } catch { /* eski brauzer */ } return; }
  const el = ev.target.closest('[data-act]');
  if (!el) {
    if (ev.target === $('modal')) closeModal();
    return;
  }
  const fn = ACT[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
// Tarix: qatorni chapga surish — o'chirish, o'ngga — bugunga nusxalash (90px dan keyin)
const swipe = { row: null, id: 0, x0: 0, y0: 0, dx: 0, on: false, block: false };
const SWIPE_AT = 90;
document.addEventListener('pointerdown', ev => {
  const row = ev.target.closest?.('.sw > .row[data-id]');
  if (!row || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  Object.assign(swipe, { row, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, dx: 0, on: false });
});
document.addEventListener('pointermove', ev => {
  const s = swipe;
  if (!s.row || ev.pointerId !== s.id) return;
  const dx = ev.clientX - s.x0, dy = ev.clientY - s.y0;
  if (!s.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s.row = null; return; }
    if (Math.abs(dx) < 12) return;
    s.on = true;
    s.row.classList.add('swiping');
    try { s.row.setPointerCapture(ev.pointerId); } catch { /* sintetik hodisa */ }
  }
  s.dx = Math.max(-140, Math.min(140, dx));
  s.row.style.transform = `translateX(${s.dx}px)`;
  const wrap = s.row.parentElement;
  if (s.dx > 0) wrap.dataset.dir = 'r'; else wrap.dataset.dir = 'l';
  if (Math.abs(s.dx) >= SWIPE_AT && !s.row.dataset.armed) { s.row.dataset.armed = '1'; haptic.light(); }
  if (Math.abs(s.dx) < SWIPE_AT) delete s.row.dataset.armed;
});
function endSwipe(ev) {
  const s = swipe;
  if (!s.row || ev.pointerId !== s.id) return;
  const { row, dx, on } = s;
  s.row = null;
  if (!on) return;
  s.block = true; // keyingi "click" tahrirlashni ochmasin
  setTimeout(() => { s.block = false; }, 350);
  row.classList.remove('swiping');
  const tx = db.tx.find(x => x.id === row.dataset.id);
  if (ev.type === 'pointerup' && tx && Math.abs(dx) >= SWIPE_AT) {
    if (dx < 0) deleteTx(tx); else copyTxToday(tx);
    rerender();
    return;
  }
  row.style.transform = '';
  setTimeout(() => { delete row.parentElement?.dataset.dir; }, 200);
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
document.addEventListener('click', ev => {
  if (swipe.block && ev.target.closest?.('.sw')) { swipe.block = false; ev.stopPropagation(); ev.preventDefault(); }
}, true);
// Prognoz grafigi: sichqoncha yoki barmoq bilan kun tanlanadi
document.addEventListener('pointermove', fcTip);
document.addEventListener('pointerdown', fcTip);
document.addEventListener('pointerout', ev => {
  if (ev.pointerType !== 'mouse' || !ev.target.closest?.('.fc svg') || ev.relatedTarget?.closest?.('.fc svg')) return;
  const fc = ev.target.closest('.fc');
  fc.querySelector('.fc-tip').hidden = true;
  fc.querySelector('.fc-g').style.visibility = 'hidden';
});
// Telefonda matn yozilayotganda raqamlar paneli klaviaturani to'smasin
document.addEventListener('focusin', ev => {
  document.body.classList.toggle('typing', !!ev.target.matches?.('#view input:not([type]), #view input[type="text"], #view textarea'));
});
document.addEventListener('focusout', () => document.body.classList.remove('typing'));
document.addEventListener('input', ev => { const k = ev.target.dataset?.input; if (k && INPUT[k]) INPUT[k](ev.target); });
document.addEventListener('change', ev => { const k = ev.target.dataset?.change; if (k && CHANGE[k]) CHANGE[k](ev.target); });
document.addEventListener('keydown', ev => {
  if (!$('lock').hidden) {
    if (/^\d$/.test(ev.key)) pinKey(ev.key);
    else if (ev.key === 'Backspace') pinKey('back');
    else return;
    ev.preventDefault();
    return;
  }
  if (!$('story').hidden) {
    if (ev.key === 'ArrowRight' || ev.key === ' ') stepStory(1);
    else if (ev.key === 'ArrowLeft') stepStory(-1);
    else if (ev.key === 'Escape') closeStory();
    else return;
    ev.preventDefault();
    return;
  }
  if (!$('modal').hidden) {
    if (ev.key === 'Escape') closeModal();
    if (ev.key === 'Enter' && ev.target.matches?.('input:not([type="checkbox"])')) {
      $('modal').querySelector(ev.target.id === 'd-part' ? '[data-act="d-part"]' : '[data-enter]')?.click();
    }
    return;
  }
  if (route !== 'add' || ev.target.closest?.('input, textarea, select')) return;
  if (/^\d$/.test(ev.key)) pressKey(ev.key);
  else if (ev.key.length === 1 && '+-*/'.includes(ev.key)) pressKey({ '+': '+', '-': '−', '*': '×', '/': '÷' }[ev.key]);
  else if (ev.key === 'Backspace') pressKey('back');
  else if (ev.key === 'Enter') saveForm();
  else if (ev.key === 'Escape') back();
  else return;
  ev.preventDefault();
});

const VIEWS = {
  main: viewMain, tarix: viewTarix, reja: viewReja, tahlil: viewTahlil, add: viewAdd, humo: viewHumo, jurnal: viewJurnal,
  sozlama: viewSozlama, 'sz-home': viewSzHome, 'sz-lim': viewSzLim, 'sz-open': viewSzOpen, 'sz-backup': viewSzBackup,
};

// ===== Ishga tushirish =====
async function start() {
  if (inTelegram) {
    WA.ready();
    WA.expand();
    WA.onEvent('themeChanged', applyTheme);
    if (tgAtLeast('6.1')) WA.BackButton.onClick(back);
    if (tgAtLeast('7.7')) WA.disableVerticalSwipes();
  } else {
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  }
  applyTheme();
  // Begona akkauntda ma'lumot yuklanmaydi ham, yozilmaydi ham.
  if (!(await isOwner())) { showPrivate(); return; }
  const bioP = bioInit();
  try {
    await load();
    await bioP;
  } catch (e) {
    $('loading').innerHTML = `<p>Ma'lumotlarni yuklab bo'lmadi: ${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Qayta urinish</button>`;
    return;
  }
  $('loading').hidden = true;
  if (inTelegram && tgAtLeast('8.0')) {
    WA.onEvent('deactivated', () => { hiddenAt = Date.now(); flush(); });
    WA.onEvent('activated', lockIfAway);
  }
  if (db.pin) showLock('unlock', showApp); else showApp();
}
function showApp() {
  $('view').hidden = false;
  $('nav').hidden = false;
  render(0);
  openDeepPlan();
}
function openDeepPlan() {
  const key = deepPlan;
  deepPlan = '';
  if (!key) return;
  const C = calc();
  if (!C.events.has(key)) { toast('Bu reja bandi topilmadi'); return; }
  if (C.byPlan.has(key)) toast("Bu band allaqachon yozilgan — kerak bo'lsa tahrirlang");
  openFromEvent(key);
}
start();
</script>
