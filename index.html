document.addEventListener('keydown', ev => {
  if (!$('lock').hidden) {
    // Faqat PIN ekranida: reja kiritish va «shaxsiy ilova» ekranlarida raqamlar PIN emas
    if ($('lock').dataset.mode !== 'pin' || ev.target.closest?.('textarea, input')) return;
    if (/^\d$/.test(ev.key)) pinKey(ev.key);
    else if (ev.key === 'Backspace') pinKey('back');
    else return;
    ev.preventDefault();
    return;
  }
  if (!$('story').hidden) {
    if (ev.key === 'ArrowRight' || ev.key === ' ') stepStory(1);
    else if (ev.key === 'ArrowLeft') stepStory(-1);
    else if (ev.key === 'Escape') closeStory();
    else return;
    ev.preventDefault();
    return;
  }
  if (!$('modal').hidden) {
    if (ev.key === 'Tab') {
      const items = [...$('modal').querySelectorAll('button:not(:disabled), input, select, textarea, a[href]')];
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1], cur = document.activeElement;
      if (ev.shiftKey && (cur === first || !$('modal').contains(cur) || cur.classList.contains('sheet'))) { last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && (cur === last || !$('modal').contains(cur))) { first.focus(); ev.preventDefault(); }
      return;
    }
    if (ev.key === 'Escape') closeModal();
    if (ev.key === 'Enter' && ev.target.matches?.('input:not([type="checkbox"])')) {
      $('modal').querySelector(ev.target.id === 'd-part' ? '[data-act="d-part"]' : '[data-enter]')?.click();
    }
    return;
  }
  if (route !== 'add' || ev.target.closest?.('input, textarea, select')) return;
  if (/^\d$/.test(ev.key)) pressKey(ev.key);
  else if (ev.key.length === 1 && '+-*/'.includes(ev.key)) pressKey({ '+': '+', '-': '−', '*': '×', '/': '÷' }[ev.key]);
  else if (ev.key === 'Backspace') pressKey('back');
  else if (ev.key === 'Enter') saveForm();
  else if (ev.key === 'Escape') back();
  else return;
  ev.preventDefault();
});

const VIEWS = {
  main: viewMain, tarix: viewTarix, reja: viewReja, tahlil: viewTahlil, add: viewAdd, humo: viewHumo, jurnal: viewJurnal,
  hisob: viewHisob, hello: viewHello, sozlama: viewSozlama, 'sz-plan': viewSzPlan, 'sz-home': viewSzHome, 'sz-lim': viewSzLim, 'sz-open': viewSzOpen, 'sz-backup': viewSzBackup,
};

// ===== Ishga tushirish =====
async function start() {
  if (inTelegram) {
    WA.ready();
    WA.expand();
    WA.onEvent('themeChanged', applyTheme);
    if (tgAtLeast('6.1')) WA.BackButton.onClick(back);
    if (tgAtLeast('7.7')) WA.disableVerticalSwipes();
    WA.MainButton?.onClick?.(() => { if (route === 'add') saveForm(); });
    if (tgAtLeast('7.0') && WA.SettingsButton) {
      WA.SettingsButton.show();
      WA.SettingsButton.onClick(() => { if (route !== 'sozlama' && $('lock').hidden && $('story').hidden) { if (!$('modal').hidden) closeModal(); push('sozlama'); } });
    }
    // Zaif Android: xiralik va ortiqcha harakat o'chadi
    if (/Telegram-Android\/.*;\s*LOW\)/.test(navigator.userAgent)) document.documentElement.classList.add('low-end');
  } else {
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  }
  applyTheme();
  // Begona akkauntda ma'lumot yuklanmaydi ham, yozilmaydi ham.
  if (!(await isOwner())) { showPrivate(); return; }
  const bioP = bioInit();
  try {
    const ok = await load();
    await bioP;
    if (!ok) { showPlanSetup(); return; }
  } catch (e) {
    $('loading').removeAttribute('aria-busy');
    $('loading').innerHTML = `<div class="card" role="alert" style="margin-top:24px">${emptyBox("Ma'lumot olinmadi", `Internetni tekshiring. ${esc(e.message)}`, '<button class="btn primary" onclick="location.reload()">Qayta urinish</button>')}</div>`;
    return;
  }
  $('loading').hidden = true;
  if (navigator.onLine === false) setSave('offline');
  if (Object.keys(pending).length) { saveUI.st = 'fail'; sendPending(); }
  if (inTelegram && tgAtLeast('8.0')) {
    WA.onEvent('deactivated', () => { hiddenAt = Date.now(); flush(); });
    WA.onEvent('activated', lockIfAway);
  }
  if (db.pin) showLock('unlock', showApp); else showApp();
}
function showApp() {
  $('view').hidden = false;
  $('nav').hidden = false;
  $('fab').hidden = false;
  if (firstRun() && !deepPlan) route = 'hello';
  render(0);
  openDeepPlan();
}
function openDeepPlan() {
  const key = deepPlan;
  deepPlan = '';
  if (!key) return;
  const C = calc();
  if (!C.events.has(key)) { toast('Bu reja bandi topilmadi'); return; }
  if (C.settled.has(key)) { toast('Bu qarz allaqachon yopilgan'); return; }
  if (C.byPlan.has(key)) toast("Bu band allaqachon yozilgan — kerak bo'lsa tahrirlang");
  openFromEvent(key);
}
start();
</script>
