<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byudjet treker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons-outline.min.css">
<style>
:root {
  --fb-page: #f1f2f6; --fb-section: #ffffff; --fb-text: #111418; --fb-hint: #8a8f98;
  --fb-accent: #2481cc; --fb-accent-text: #ffffff; --fb-danger: #e5393b; --ok: #2f9e4f;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fb-page: #101418; --fb-section: #1c2229; --fb-text: #f2f4f7; --fb-hint: #8b98a5;
    --fb-accent: #5aa7e6; --fb-accent-text: #0b1118; --fb-danger: #ff6b6b; --ok: #4cc764;
  }
}
:root {
  --page: var(--tg-theme-secondary-bg-color, var(--fb-page));
  --section: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-section)));
  --text: var(--tg-theme-text-color, var(--fb-text));
  --hint: var(--tg-theme-hint-color, var(--fb-hint));
  --accent: var(--tg-theme-button-color, var(--fb-accent));
  --accent-text: var(--tg-theme-button-text-color, var(--fb-accent-text));
  --danger: var(--tg-theme-destructive-text-color, var(--fb-danger));
  --line: color-mix(in srgb, var(--hint) 25%, transparent);
  --danger-bg: color-mix(in srgb, var(--danger) 12%, var(--section));
  --accent-bg: color-mix(in srgb, var(--accent) 14%, var(--section));
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
.ti { font-size: 1.15em; vertical-align: -0.15em; }
.hint { color: var(--hint); }
.num { white-space: nowrap; }
.in { color: var(--ok); }
.out { color: var(--text); }
.lock { color: var(--accent); }
.bad-text { color: var(--danger); }
#loading { padding: 48px 16px; text-align: center; color: var(--hint); }

/* Summary */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: var(--section); border-radius: 14px; padding: 12px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card .label { font-size: 13px; color: var(--hint); display: flex; gap: 6px; align-items: center; }
.card .value { font-size: 19px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.wide .value { font-size: 28px; }
.card.alert { background: var(--danger-bg); }
.card.alert .value { color: var(--danger); }
.next { margin-top: 8px; background: var(--section); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; }
.next .ti { color: var(--accent); font-size: 22px; }
.next b { display: block; }
.progress { margin-top: 8px; background: var(--section); border-radius: 14px; padding: 12px; }
.progress .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--hint); flex-wrap: wrap; }
.bar { height: 10px; border-radius: 5px; background: var(--line); margin-top: 8px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 5px; transition: width .3s; }

/* Month tabs */
.tabs { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
  margin: 12px -12px 0; padding: 8px 12px; background: var(--page); }
.tab { border: 0; border-radius: 10px; min-height: 48px; padding: 4px 0; background: var(--section); color: var(--text);
  font: inherit; font-weight: 600; cursor: pointer; line-height: 1.15; }
.tab small { display: block; font-weight: 400; font-size: 11px; color: var(--hint); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }
.tab[aria-selected="true"] small { color: inherit; opacity: .8; }

/* Weeks and days */
.week-head { display: flex; justify-content: space-between; gap: 8px; margin: 16px 4px 6px; font-size: 13px;
  color: var(--hint); text-transform: uppercase; letter-spacing: .02em; }
.day { background: var(--section); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; border: 2px solid transparent; }
.day.today { border-color: var(--accent); }
.day.off .day-date { color: var(--hint); }
.day.bad { background: var(--danger-bg); border-color: var(--danger); }
.day-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.day-date { font-size: 16px; }
.day-date b { margin-right: 4px; }
.badge { font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; }
.badge.hol { background: var(--danger-bg); color: var(--danger); }
.wd-toggle { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px;
  min-height: 36px; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.day.off .wd-toggle { color: var(--hint); }
.ev { display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid var(--line); cursor: pointer; }
.ev:first-of-type { margin-top: 6px; }
.ev input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.ev .t { flex: 1; min-width: 0; }
.ev .num { font-weight: 600; }
.ev.done .t { color: var(--hint); }
.empty { min-height: 36px; display: flex; align-items: center; border-top: 1px solid var(--line); margin-top: 6px; font-size: 13px; }
.extra { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.extra label { flex: 1; font-size: 13px; color: var(--hint); }
.extra input { width: 130px; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px;
  background: var(--page); color: var(--text); font: inherit; text-align: right; }
.extra input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.day.bad .extra input { border-color: var(--danger); color: var(--danger); }
.warn { margin: 8px 0 0; color: var(--danger); font-size: 13px; font-weight: 600; display: flex; gap: 6px; }
.warn[hidden] { display: none; }
.plan { margin-top: 6px; text-align: right; font-size: 13px; color: var(--hint); }

/* Backup */
.backup { margin-top: 16px; background: var(--section); border-radius: 14px; padding: 0 12px; }
.backup[open] { padding-bottom: 12px; }
.backup summary { min-height: 48px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; list-style: none; }
.backup summary::-webkit-details-marker { display: none; }
.backup p { margin: 0 0 10px; font-size: 13px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.btn { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--text);
  font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
#b-text { display: block; width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px;
  background: var(--page); color: var(--text); font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical; }
.b-msg { min-height: 1em; margin: 0; font-size: 13px; font-weight: 600; }
.foot { text-align: center; font-size: 12px; margin: 16px 0 0; }

#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--page); padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
  opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <div id="loading"><i class="ti ti-clock"></i> Yuklanmoqda…</div>
  <div id="app" hidden>
    <section class="cards">
      <div class="card wide"><div class="label"><i class="ti ti-wallet"></i>Jami balans</div><div class="value num" id="s-total"></div></div>
      <div class="card"><div class="label"><i class="ti ti-cash"></i>Qo'ldagi naqd</div><div class="value num" id="s-cash"></div></div>
      <div class="card"><div class="label"><i class="ti ti-lock"></i>Qulflangan</div><div class="value num" id="s-locked"></div></div>
      <div class="card"><div class="label"><i class="ti ti-target"></i>Bugun kechgacha reja</div><div class="value num" id="s-plan"></div></div>
      <div class="card" id="c-bad"><div class="label"><i class="ti ti-alert-triangle"></i>Qoida buzilgan kunlar</div><div class="value" id="s-bad"></div></div>
    </section>
    <div class="next"><i class="ti ti-calendar-event"></i><div id="s-next"></div></div>
    <div class="progress">
      <div class="row"><span>Yakuniy maqsad sari</span><span id="s-pct"></span></div>
      <div class="bar"><div id="s-bar"></div></div>
      <div class="row" style="margin-top:6px"><span class="num" id="s-pnow"></span><span class="num" id="s-pfinal"></span></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section id="days"></section>
    <details class="backup">
      <summary><i class="ti ti-download"></i>Zaxira nusxa</summary>
      <p class="hint">Eksport — joriy ma'lumotlarni nusxalab, xavfsiz joyga saqlang.
        Import — saqlangan JSON ni shu yerga joylab, tiklang (joriy ma'lumotlar almashtiriladi).</p>
      <div class="btns">
        <button class="btn" id="b-export"><i class="ti ti-download"></i>Eksport</button>
        <button class="btn" id="b-copy"><i class="ti ti-copy"></i>Nusxalash</button>
      </div>
      <textarea id="b-text" spellcheck="false" autocomplete="off" placeholder='{"v":1,"months":{...}}'></textarea>
      <div class="btns"><button class="btn primary" id="b-import"><i class="ti ti-upload"></i>Import qilish</button></div>
      <p class="b-msg" id="b-msg" role="alert"></p>
    </details>
    <p class="foot hint" id="store-label"></p>
  </div>
</main>
<div id="toast" role="status"></div>
<script>
'use strict';

// ===== Moliyaviy reja — remind.py dagi PLAN bilan bir xil bo'lishi shart (CLAUDE.md) =====
const LOCK = 2500000; // har 20-sanada omonatga
const PLAN = {
  start: '2026-10-27',
  end: '2027-03-20',
  startBalance: 1000000,
  monthly: {
    5: [
      { id: 'avans', kind: 'in', amount: 523691, title: 'Oylik avans' },
      { id: 'ingliz', kind: 'out', amount: 600000, title: 'Ingliz tili kursi' },
    ],
    14: [
      { id: 'claude', kind: 'out', amount: 410000, title: 'Claude obunasi' },
    ],
    20: [
      { id: 'oylik', kind: 'in', amount: 3325200, title: 'Asosiy oylik' },
      { id: 'telefon', kind: 'out', amount: 52000, title: 'Telefon' },
      { id: 'lock', kind: 'lock', amount: LOCK, title: 'Omonatga qulflash' },
    ],
  },
  once: {
    '2026-11-05': [{ id: 'qarz', kind: 'in', amount: 300000, title: 'Qarz qaytishi' }],
    '2026-11-14': [{ id: 'uzum', kind: 'out', amount: 430000, title: 'Uzum qarzini yopish' }],
  },
  transport: { id: 'yol', kind: 'out', amount: 10000, title: "Yo'lkira (5k + 5k)" },
  holidays: {
    '2026-12-08': 'Konstitutsiya kuni',
    '2027-01-01': 'Yangi yil',
    '2027-03-08': 'Xotin-qizlar kuni',
  },
};

const WEEKDAYS = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const MONTH_SHORT = ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun', 'Iyul', 'Avg', 'Sen', 'Okt', 'Noy', 'Dek'];
const SIGN = { in: '+', out: '−', lock: '→ ' };

// ===== Sana: reja UTC da, "bugun" qurilmaning mahalliy sanasi =====
const DAY_MS = 86400000;
const pad = n => String(n).padStart(2, '0');
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const toISO = t => new Date(t).toISOString().slice(0, 10);
const todayISO = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const dm = day => `${day.dd}.${day.iso.slice(5, 7)}`;
const mondayOf = day => day.t - ((day.dow + 6) % 7) * DAY_MS; // hafta dushanbadan boshlanadi

const fmt = n => (n < 0 ? '−' : '') + String(Math.abs(Math.trunc(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const $ = id => document.getElementById(id);

const DAYS = [];
for (let t = parseISO(PLAN.start), end = parseISO(PLAN.end); t <= end; t += DAY_MS) {
  const date = new Date(t), iso = toISO(t);
  DAYS.push({ iso, t, dd: iso.slice(8), month: iso.slice(0, 7), day: date.getUTCDate(), dow: date.getUTCDay(),
    holiday: PLAN.holidays[iso] || '' });
}
const MONTHS = [...new Set(DAYS.map(d => d.month))];

// ===== Holat: state["2026-11"] = { c: {"05:avans": 1}, x: {"05": 15000}, w: {"08": 0} } =====
let state = {};
const emptyShard = () => ({ c: {}, x: {}, w: {} });
const shard = month => state[month] || (state[month] = emptyShard());
const checkKey = (day, e) => `${day.dd}:${e.id}`;
const isChecked = (day, e) => state[day.month]?.c[checkKey(day, e)] === 1;
const extraOf = day => state[day.month]?.x[day.dd] || 0;
const defaultWorkday = day => day.dow >= 1 && day.dow <= 5 && !day.holiday;
function isWorkday(day) {
  const w = state[day.month]?.w[day.dd];
  return w === undefined ? defaultWorkday(day) : w === 1;
}
function eventsFor(day) {
  const list = [...(PLAN.monthly[day.day] || []), ...(PLAN.once[day.iso] || [])];
  if (isWorkday(day)) list.push(PLAN.transport);
  return list;
}
const delta = e => (e.kind === 'in' ? e.amount : e.kind === 'out' ? -e.amount : 0);

function computePlan() {
  let bal = PLAN.startBalance;
  const byIso = {};
  for (const day of DAYS) {
    for (const e of eventsFor(day)) bal += delta(e);
    byIso[day.iso] = bal;
  }
  return { byIso, final: bal };
}

function computeActual() {
  let total = PLAN.startBalance, locked = 0, badDays = 0;
  for (const day of DAYS) {
    for (const e of eventsFor(day)) {
      if (!isChecked(day, e)) continue;
      total += delta(e);
      if (e.kind === 'lock') locked += e.amount;
    }
    const x = extraOf(day);
    if (x > 0) { total -= x; badDays++; }
  }
  return { total, locked, cash: total - locked, badDays };
}

function plannedTonight(plan, today) {
  if (today < PLAN.start) return PLAN.startBalance;
  if (today > PLAN.end) return plan.final;
  return plan.byIso[today];
}

function nextPayment(today) {
  for (const day of DAYS) {
    if (day.iso < today) continue;
    const pending = eventsFor(day).filter(e => e !== PLAN.transport && !isChecked(day, e));
    if (pending.length) return { day, pending };
  }
  return null;
}

// ===== Telegram yordamchilari =====
const WA = window.Telegram?.WebApp;
const inTelegram = !!WA?.initData;
const tgAtLeast = v => inTelegram && WA.isVersionAtLeast(v);
const haptic = {
  light() { if (tgAtLeast('6.1')) WA.HapticFeedback.impactOccurred('light'); },
  error() { if (tgAtLeast('6.1')) WA.HapticFeedback.notificationOccurred('error'); },
};
function confirmDialog(text) {
  if (tgAtLeast('6.2')) return new Promise(res => WA.showConfirm(text, ok => res(!!ok)));
  return Promise.resolve(window.confirm(text));
}
let toastTimer;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== Saqlash: Telegram CloudStorage (6.9+) yoki localStorage, har oy alohida kalitda =====
const MAX_VALUE = 4096; // CloudStorage bitta qiymat chegarasi
const shardKey = month => `m_${month}`;

function createStore() {
  if (tgAtLeast('6.9') && WA.CloudStorage) {
    const cs = WA.CloudStorage;
    return {
      label: "Ma'lumotlar Telegram bulutida saqlanadi.",
      getMany: keys => new Promise((res, rej) => cs.getItems(keys, (err, vals) => (err ? rej(new Error(err)) : res(vals || {})))),
      set: (key, value) => new Promise((res, rej) => cs.setItem(key, value, err => (err ? rej(new Error(err)) : res()))),
    };
  }
  // *.github.io domeni barcha repolar uchun umumiy, shuning uchun kalitlarga prefiks qo'shiladi
  let ls = null;
  try { ls = window.localStorage; ls.setItem('byudjet:t', '1'); ls.removeItem('byudjet:t'); } catch { ls = null; }
  const mem = {};
  return {
    label: ls ? "Ma'lumotlar shu brauzerda (localStorage) saqlanadi."
      : "Diqqat: ma'lumotlar saqlanmaydi — sahifa yopilsa yo'qoladi.",
    getMany: async keys => Object.fromEntries(keys.map(k => [k, (ls ? ls.getItem(`byudjet:${k}`) : mem[k]) || ''])),
    set: async (key, value) => { if (ls) ls.setItem(`byudjet:${key}`, value); else mem[key] = value; },
  };
}
const store = createStore();

const saveTimers = {};
function save(month) {
  clearTimeout(saveTimers[month]);
  saveTimers[month] = setTimeout(() => flush(month), 400);
}
function flush(month) {
  clearTimeout(saveTimers[month]);
  delete saveTimers[month];
  const json = JSON.stringify(state[month] || emptyShard());
  if (json.length > MAX_VALUE) {
    toast(`${month}: ma'lumot juda katta, saqlanmadi`);
    return Promise.resolve();
  }
  return store.set(shardKey(month), json).catch(() => toast("Saqlab bo'lmadi. Internetni tekshiring."));
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Object.keys(saveTimers).forEach(m => flush(m));
});

// ===== Tekshiruv (yuklash va import uchun) =====
const ISO_SET = new Set(DAYS.map(d => d.iso));
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

function cleanShard(month, s) {
  if (!isObj(s)) throw new Error(`${month}: obyekt kutilgan`);
  for (const part of ['c', 'x', 'w']) {
    if (s[part] !== undefined && !isObj(s[part])) throw new Error(`${month}.${part}: obyekt kutilgan`);
  }
  const dayOk = dd => ISO_SET.has(`${month}-${dd}`);
  const out = emptyShard();
  for (const [k, v] of Object.entries(s.c || {})) {
    if (!/^\d{2}:[a-z]+$/.test(k) || !dayOk(k.slice(0, 2)) || v !== 1) throw new Error(`${month}: noto'g'ri belgi "${k}"`);
    out.c[k] = 1;
  }
  for (const [k, v] of Object.entries(s.x || {})) {
    if (!dayOk(k) || !Number.isInteger(v) || v < 0 || v > 999999999) throw new Error(`${month}: noto'g'ri xarajat "${k}"`);
    if (v > 0) out.x[k] = v;
  }
  for (const [k, v] of Object.entries(s.w || {})) {
    if (!dayOk(k) || (v !== 0 && v !== 1)) throw new Error(`${month}: noto'g'ri ish kuni "${k}"`);
    out.w[k] = v;
  }
  return out;
}

function parseBackup(text) {
  if (!text) throw new Error('Avval zaxira JSON matnini joylang.');
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error(`JSON xato: ${e.message}`); }
  if (!isObj(data) || data.v !== 1 || !isObj(data.months)) throw new Error('Format noto\'g\'ri: {"v": 1, "months": {...}} kutilgan.');
  const next = {};
  for (const [m, s] of Object.entries(data.months)) {
    if (!MONTHS.includes(m)) throw new Error(`Noma'lum oy: "${m}"`);
    next[m] = cleanShard(m, s);
  }
  return next;
}
const exportText = () => JSON.stringify({ v: 1, months: state });

async function load() {
  const raw = await store.getMany(MONTHS.map(shardKey));
  const next = {};
  for (const m of MONTHS) {
    const text = raw[shardKey(m)];
    if (!text) continue;
    try { next[m] = cleanShard(m, JSON.parse(text)); } catch { toast(`${m}: saqlangan ma'lumot buzilgan, e'tiborsiz qoldirildi`); }
  }
  state = next;
}

// ===== Ko'rinish =====
let selectedMonth = null;

function renderSummary() {
  const today = todayISO();
  const plan = computePlan();
  const a = computeActual();
  $('s-total').textContent = fmt(a.total);
  $('s-cash').textContent = fmt(a.cash);
  $('s-locked').textContent = fmt(a.locked);
  $('s-plan').textContent = fmt(plannedTonight(plan, today));
  $('s-bad').textContent = a.badDays;
  $('c-bad').classList.toggle('alert', a.badDays > 0);

  const next = nextPayment(today);
  if (next) {
    const left = Math.round((next.day.t - parseISO(today)) / DAY_MS);
    const when = left === 0 ? 'bugun' : left === 1 ? 'ertaga' : `${left} kun qoldi`;
    const items = next.pending.map(e => `${esc(e.title)} <span class="num ${e.kind}">${SIGN[e.kind]}${fmt(e.amount)}</span>`);
    $('s-next').innerHTML = `<b>Keyingi to'lov: ${dm(next.day)}, ${WEEKDAYS[next.day.dow]} — ${when}</b>`
      + `<span class="hint">${items.join(' · ')}</span>`;
  } else {
    $('s-next').innerHTML = "<b>Barcha rejali to'lovlar bajarilgan</b>";
  }

  const pct = plan.final > 0 ? Math.max(0, Math.min(100, Math.floor((a.total / plan.final) * 100))) : 0;
  $('s-pct').textContent = `${pct}%`;
  $('s-bar').style.width = `${pct}%`;
  $('s-pnow').textContent = `Hozir: ${fmt(a.total)}`;
  $('s-pfinal').textContent = `Reja: ${fmt(plan.final)}`;
  return plan;
}

function renderTabs() {
  $('tabs').innerHTML = MONTHS.map(m => {
    const [y, mm] = m.split('-');
    return `<button class="tab" role="tab" data-month="${m}" aria-selected="${m === selectedMonth}">`
      + `${MONTH_SHORT[Number(mm) - 1]}<small>${y}</small></button>`;
  }).join('');
}

function dayHTML(day, plan, today) {
  const work = isWorkday(day);
  const x = extraOf(day);
  const events = eventsFor(day);
  const cls = ['day', day.iso === today && 'today', !work && 'off', x > 0 && 'bad'].filter(Boolean).join(' ');
  const badges = (day.iso === today ? '<span class="badge">Bugun</span>' : '')
    + (day.holiday ? `<span class="badge hol">${esc(day.holiday)}</span>` : '');
  const toggle = work
    ? '<i class="ti ti-briefcase"></i>Ish kuni'
    : '<i class="ti ti-beach"></i>Dam olish';
  const rows = events.length
    ? events.map(e => {
      const on = isChecked(day, e);
      return `<label class="ev${on ? ' done' : ''}"><input type="checkbox" data-iso="${day.iso}" data-id="${e.id}"${on ? ' checked' : ''}>`
        + `<span class="t">${esc(e.title)}</span><span class="num ${e.kind}">${SIGN[e.kind]}${fmt(e.amount)}</span></label>`;
    }).join('')
    : '<div class="empty hint">Rejali to\'lov yo\'q</div>';
  return `<article class="${cls}" id="d-${day.iso}">`
    + `<header class="day-head"><span class="day-date"><b>${dm(day)}</b>${WEEKDAYS[day.dow]}</span>${badges}`
    + `<button class="wd-toggle" data-toggle="${day.iso}" aria-pressed="${work}">${toggle}</button></header>`
    + rows
    + `<div class="extra"><label for="x-${day.iso}">Rejadan tashqari xarajat</label>`
    + `<input id="x-${day.iso}" class="extra-in" data-iso="${day.iso}" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="0" value="${x ? fmt(x) : ''}"></div>`
    + `<p class="warn"${x > 0 ? '' : ' hidden'}><i class="ti ti-alert-triangle"></i><span>${warnText(x, plan.final)}</span></p>`
    + `<div class="plan">Reja: <span class="num">${fmt(plan.byIso[day.iso])}</span></div>`
    + '</article>';
}

function warnText(x, final) {
  return x > 0 ? `Qoida buzildi! ${fmt(x)} so'm rejadan tashqari sarflandi — bu ${fmt(final)} so'mlik maqsaddan ayiriladi.` : '';
}

function renderDays(plan) {
  const today = todayISO();
  const days = DAYS.filter(d => d.month === selectedMonth);
  const weeks = [];
  for (const day of days) {
    const monday = mondayOf(day);
    if (!weeks.length || weeks[weeks.length - 1].monday !== monday) weeks.push({ monday, days: [] });
    weeks[weeks.length - 1].days.push(day);
  }
  $('days').innerHTML = weeks.map(w => {
    const first = w.days[0], last = w.days[w.days.length - 1];
    const extra = w.days.reduce((s, d) => s + extraOf(d), 0);
    return `<div class="week-head"><span>${dm(first)} – ${dm(last)}</span>`
      + `<span class="num bad-text" data-week-extra="${first.iso}">${extra ? `−${fmt(extra)}` : ''}</span></div>`
      + w.days.map(d => dayHTML(d, plan, today)).join('');
  }).join('');
}

function render() {
  const plan = renderSummary();
  renderTabs();
  renderDays(plan);
}

function updateDayExtra(day) {
  const card = $(`d-${day.iso}`);
  const x = extraOf(day);
  const plan = renderSummary();
  card.classList.toggle('bad', x > 0);
  const warn = card.querySelector('.warn');
  warn.hidden = !(x > 0);
  warn.querySelector('span').textContent = warnText(x, plan.final);
  // Hafta sarlavhasidagi jami rejadan tashqari xarajat
  let head = card;
  while (head && !head.classList.contains('week-head')) head = head.previousElementSibling;
  const monday = mondayOf(day);
  const sum = DAYS.filter(d => d.month === day.month && mondayOf(d) === monday).reduce((s, d) => s + extraOf(d), 0);
  head.querySelector('[data-week-extra]').textContent = sum ? `−${fmt(sum)}` : '';
}

const dayByIso = iso => DAYS.find(d => d.iso === iso);

// ===== Hodisalar =====
$('tabs').addEventListener('click', ev => {
  const btn = ev.target.closest('.tab');
  if (!btn || btn.dataset.month === selectedMonth) return;
  selectedMonth = btn.dataset.month;
  renderTabs();
  renderDays(computePlan());
  window.scrollTo({ top: $('tabs').offsetTop, behavior: 'smooth' });
});

$('days').addEventListener('change', ev => {
  const el = ev.target;
  if (el.type === 'checkbox') {
    const day = dayByIso(el.dataset.iso);
    const s = shard(day.month), key = `${day.dd}:${el.dataset.id}`;
    if (el.checked) s.c[key] = 1; else delete s.c[key];
    el.closest('.ev').classList.toggle('done', el.checked);
    save(day.month);
    renderSummary();
    haptic.light();
  } else if (el.classList.contains('extra-in')) {
    const x = extraOf(dayByIso(el.dataset.iso));
    el.value = x ? fmt(x) : '';
    if (x > 0) haptic.error();
  }
});

$('days').addEventListener('input', ev => {
  const el = ev.target;
  if (!el.classList.contains('extra-in')) return;
  const day = dayByIso(el.dataset.iso);
  const x = Math.min(999999999, Number(el.value.replace(/\D/g, '')) || 0);
  const s = shard(day.month);
  if (x > 0) s.x[day.dd] = x; else delete s.x[day.dd];
  save(day.month);
  updateDayExtra(day);
});

$('days').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-toggle]');
  if (!btn) return;
  const day = dayByIso(btn.dataset.toggle);
  const s = shard(day.month);
  const next = !isWorkday(day);
  if (next === defaultWorkday(day)) delete s.w[day.dd]; else s.w[day.dd] = next ? 1 : 0;
  if (!next) delete s.c[checkKey(day, PLAN.transport)];
  save(day.month);
  haptic.light();
  const plan = renderSummary();
  renderDays(plan);
});

function setBackupMsg(text, isError) {
  const el = $('b-msg');
  el.textContent = text;
  el.className = `b-msg ${isError ? 'bad-text' : 'in'}`;
}
$('b-export').addEventListener('click', () => {
  $('b-text').value = exportText();
  setBackupMsg('', false);
});
$('b-copy').addEventListener('click', async () => {
  const ta = $('b-text');
  if (!ta.value.trim()) ta.value = exportText();
  try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
  toast('Nusxalandi');
});
$('b-import').addEventListener('click', async () => {
  let next;
  try {
    next = parseBackup($('b-text').value.trim());
  } catch (e) {
    setBackupMsg(e.message, true);
    haptic.error();
    return;
  }
  if (!(await confirmDialog("Joriy ma'lumotlar zaxiradagisi bilan almashtiriladi. Davom etasizmi?"))) return;
  state = next;
  await Promise.all(MONTHS.map(m => flush(m)));
  setBackupMsg('Import qilindi.', false);
  render();
});

// ===== Ishga tushirish =====
async function start() {
  if (inTelegram) {
    WA.ready();
    WA.expand();
    const syncScheme = () => { document.documentElement.style.colorScheme = WA.colorScheme; };
    syncScheme();
    WA.onEvent('themeChanged', syncScheme);
    if (tgAtLeast('6.1')) {
      WA.setHeaderColor('secondary_bg_color');
      WA.setBackgroundColor('secondary_bg_color');
    }
  }
  try {
    await load();
  } catch (e) {
    $('loading').innerHTML = `<p>Ma'lumotlarni yuklab bo'lmadi: ${esc(e.message)}</p>`
      + '<button class="btn primary" onclick="location.reload()">Qayta urinish</button>';
    return;
  }
  $('store-label').textContent = store.label;
  const today = todayISO();
  selectedMonth = MONTHS.includes(today.slice(0, 7)) ? today.slice(0, 7)
    : today < PLAN.start ? MONTHS[0] : MONTHS[MONTHS.length - 1];
  $('loading').hidden = true;
  $('app').hidden = false;
  render();
  $(`d-${today}`)?.scrollIntoView({ block: 'nearest' });
}
start();
</script>
