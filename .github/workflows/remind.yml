name: remind

on:
  schedule:
    - cron: "0 3 * * *" # har kuni 08:00 (Asia/Tashkent, UTC+5) — ertalabki eslatma
    - cron: "0 15 * * *" # har kuni 20:00 — ertangi to'lovlar, yakshanba — keyingi hafta
  workflow_dispatch:
    inputs:
      slot:
        description: "Qaysi eslatma: evening (20:00) yoki morning (08:00)"
        type: choice
        options: [evening, morning]
        default: evening
      today:
        description: "Sinov sanasi (YYYY-MM-DD). Bo'sh qoldirilsa — bugun."
        required: false
        default: ""
      dry_run:
        description: "Yubormasdan faqat logga chiqarish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Eslatma yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          TODAY: ${{ inputs.today }}
          SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' && 'morning' || 'evening') || inputs.slot }}
        run: python3 remind.py --slot "$SLOT" ${{ inputs.dry_run && '--dry-run' || '' }}
