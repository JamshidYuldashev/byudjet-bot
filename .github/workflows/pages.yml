name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Egasini belgilash (CHAT_ID dan sekin hash — PBKDF2)
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import hashlib, os, pathlib, sys
          chat_id = os.environ.get("CHAT_ID", "").strip()
          if not chat_id:
              sys.exit("Xato: CHAT_ID secret topilmadi")
          src = pathlib.Path("index.html").read_text(encoding="utf-8")
          if src.count("__OWNER_HASH__") != 1:
              sys.exit("Xato: index.html da __OWNER_HASH__ bitta bo'lishi kerak")
          # index.html dagi OWNER_ITER bilan bir xil; sekin hash ID ni tanlab topishni qimmatlashtiradi
          owner = hashlib.pbkdf2_hmac("sha256", chat_id.encode(), b"byudjet-bot", 300000).hex()
          site = pathlib.Path("_site")
          site.mkdir()
          if src.count("__BUILD__") != 1:
              sys.exit("Xato: index.html da __BUILD__ bitta bo'lishi kerak")
          page = src.replace("__OWNER_HASH__", owner).replace("__BUILD__", os.environ["GITHUB_SHA"])
          (site / "index.html").write_text(page, encoding="utf-8")
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
